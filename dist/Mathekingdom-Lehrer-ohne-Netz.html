":"Prüfe mit einem Überschlag, wie viele Stellen dein Ergebnis haben muss."},"div-rest-nicht-gedeutet":{"beschreibung":"Berechnet den Quotienten richtig, deutet den Rest aber nicht im Sachzusammenhang.","hinweis":"Deine Rechnung stimmt. Überlege jetzt, was mit dem Rest in dieser Situation passiert."},"div-rest-vergessen":{"beschreibung":"Gibt den Rest nicht oder falsch an.","hinweis":"Prüfe den Rest: Was bleibt übrig, wenn du Ergebnis mal Divisor vom Dividenden abziehst?"},"sach-falsche-rechnung":{"beschreibung":"Wählt eine Rechnung, die nicht zur Situation passt.","hinweis":"Lies die Frage noch einmal: Welche Rechenart passt zu dieser Situation?"},"sach-unnoetige-angabe":{"beschreibung":"Verrechnet eine Angabe, die für die Frage nicht gebraucht wird.","hinweis":"Nicht jede Zahl im Text wird gebraucht. Welche Angaben gehören wirklich zur Frage?"},"sach-schritt-vergessen":{"beschreibung":"Führt nur einen von mehreren nötigen Rechenschritten aus.","hinweis":"Du bist noch nicht fertig: Es fehlt noch ein Rechenschritt."},"div-vertauscht":{"beschreibung":"Vertauscht bei der Division die beiden Zahlen.","hinweis":"Beim Teilen darfst du die Zahlen nicht tauschen. Die erste Zahl wird geteilt."},"div-falsche-rechenart":{"beschreibung":"Wählt statt der Division eine andere Rechenart.","hinweis":"Überlege: Wird hier gerecht verteilt oder in gleiche Gruppen aufgeteilt? Dann wird geteilt."},"div-rest-zu-gross":{"beschreibung":"Lässt einen Rest stehen, der so groß wie der Divisor oder größer ist.","hinweis":"Der Rest muss kleiner sein als die Zahl, durch die du teilst. Passt sie noch einmal hinein?"},"div-einmaleins":{"beschreibung":"Irrt sich im kleinen Einmaleins.","hinweis":"Prüfe mit der Mal-Aufgabe: Ergebnis mal die zweite Zahl muss die erste Zahl ergeben."},"teilbar-summe":{"beschreibung":"Erkennt nicht, dass die Summe zweier Vielfacher wieder ein Vielfaches ist.","hinweis":"Zerlege in Päckchen: Was passiert, wenn du zu vollen Päckchen weitere volle Päckchen legst?"},"add-uebertrag-vergessen":{"beschreibung":"Addiert stellenweise, berücksichtigt den Übertrag aber nicht.","hinweis":"Schau dir deine Überträge noch einmal an. Hast du sie in der nächsten Stelle mitgerechnet?"},"add-subtrahiert":{"beschreibung":"Subtrahiert, statt zu addieren.","hinweis":"Schau auf das Rechenzeichen: Hier wird addiert."},"kopf-stellenwert":{"beschreibung":"Verrechnet sich beim Kopfrechnen um eine Stelle.","hinweis":"Prüfe die Stellen: Rechnest du mit Zehnern, Hundertern oder Tausendern?"},"ergaenzen-zu-viel":{"beschreibung":"Ergänzt jede Stelle einzeln bis zur vollen Zehn und erhält dadurch zu viel.","hinweis":"Nur die Einer werden bis 10 ergänzt. Alle anderen Stellen ergänzt du bis 9."},"geschickt-nicht-ausgeglichen":{"beschreibung":"Rechnet mit der glatten Nachbarzahl, gleicht danach aber nicht aus.","hinweis":"Du hast mit einer glatten Zahl gerechnet. Jetzt musst du noch ausgleichen."},"geschickt-falsch-ausgeglichen":{"beschreibung":"Gleicht nach dem Rechnen mit der glatten Nachbarzahl in die falsche Richtung aus.","hinweis":"Überlege: Hast du zu viel oder zu wenig gerechnet? In welche Richtung musst du ausgleichen?"},"klammer-ignoriert":{"beschreibung":"Rechnet von links nach rechts und beachtet die Klammer nicht.","hinweis":"Was in der Klammer steht, wird zuerst berechnet."},"klammer-falsch-gesetzt":{"beschreibung":"Setzt die Klammer an die falsche Stelle.","hinweis":"Lies genau: Was soll zuerst zusammengefasst werden? Das gehört in die Klammer."},"gesetz-auf-subtraktion":{"beschreibung":"Überträgt das Vertauschungs- oder Verbindungsgesetz auf die Subtraktion.","hinweis":"Die beiden Gesetze gelten nur für die Addition. Rechne beide Seiten aus."}},"kapitel":[{"id":"5.1","titel":"Daten und Diagramme","unterkapitel":[{"id":"5.1.1","titel":"Strichlisten und Häufigkeitstabellen","extra":false,"lernziele":[{"id":"5.1.1-L1","text":"Ich kann mit Strichlisten und Häufigkeitstabellen umgehen."}]},{"id":"5.1.2","titel":"Diagramme lesen","extra":false,"lernziele":[{"id":"5.1.2-L1","text":"Ich kann Informationen aus Diagrammen ablesen."}]},{"id":"5.1.3","titel":"Diagramme zeichnen","extra":false,"lernziele":[{"id":"5.1.3-L1","text":"Ich kann Diagramme anfertigen."}]},{"id":"5.1.4","titel":"Daten vergleichen","extra":false,"lernziele":[{"id":"5.1.4-L1","text":"Ich kann Daten miteinander vergleichen."}]},{"id":"5.1.5","titel":"Daten erheben","extra":false,"lernziele":[{"id":"5.1.5-L1","text":"Ich kann Daten erheben."}]}]},{"id":"5.2","titel":"Natürliche Zahlen","unterkapitel":[{"id":"5.2.1","titel":"Natürliche Zahlen","extra":false,"lernziele":[{"id":"5.2.1-L1","text":"Ich kann mit natürlichen Zahlen umgehen."}]},{"id":"5.2.2","titel":"Große Zahlen","extra":false,"lernziele":[{"id":"5.2.2-L1","text":"Ich kann mit großen Zahlen umgehen."}]},{"id":"5.2.3","titel":"Runden","extra":false,"lernziele":[{"id":"5.2.3-L1","text":"Ich kann Zahlen runden."}]},{"id":"5.2.4","titel":"Schätzen","extra":false,"lernziele":[{"id":"5.2.4-L1","text":"Ich kann eine Anzahl auf Bildern schätzen."}]},{"id":"5.2.5","titel":"Zweiersystem","extra":false,"lernziele":[{"id":"5.2.5-L1","text":"Ich kann Zahlen im Zweiersystem verwenden."}]},{"id":"5.2.X1","titel":"Römische Zahlzeichen","extra":true,"lernziele":[{"id":"5.2.X1-L1","text":"Ich kann römische Zahlzeichen verwenden."}]}]},{"id":"5.3","titel":"Addieren und Subtrahieren","unterkapitel":[{"id":"5.3.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.3.1-K1","text":"Ich kann im Kopf addieren."},{"id":"5.3.1-K2","text":"Ich kann im Kopf subtrahieren."},{"id":"5.3.1-K3","text":"Ich kann beim Kopfrechnen geschickt vorgehen."}],"merkzettel":{"regeln":["Rechne in Schritten: erst bis zum nächsten Zehner oder Hunderter, dann den Rest.","Liegt eine Zahl knapp neben einem Hunderter, rechne mit dem Hunderter und gleiche danach aus.","Suche Zahlen, die zusammen einen glatten Zehner oder Hunderter ergeben."],"beispiel":"67 + 48 = 67 + 3 + 45 = 115 und 83 − 27 = 83 − 3 − 24 = 56. Geschickt: 298 + 137 = 300 + 137 − 2 = 435.","heft":"Schreibe bei schwierigen Aufgaben deine Zwischenschritte auf."}},{"id":"5.3.2","titel":"Addieren","extra":false,"lernziele":[{"id":"5.3.2-A1","text":"Ich kann die Fachbegriffe Summand und Summe verwenden."},{"id":"5.3.2-A2","text":"Ich kann schriftlich addieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K1"]},{"id":"5.3.2-A3","text":"Ich kann mehrere Zahlen schriftlich addieren.","voraussetzungen":["5.3.2-A2"]},{"id":"5.3.2-A4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.2-A2","5.3.1-K1"]},{"id":"5.3.2-A5","text":"Ich kann Sachaufgaben zur Addition lösen, auch mit Tabellen und Diagrammen.","voraussetzungen":["5.3.2-A2"]}],"merkzettel":{"regeln":["Summand + Summand = Summe. Bei 34 + 12 = 46 sind 34 und 12 die Summanden, 46 ist der Wert der Summe.","Schriftlich addieren: Schreibe stellengerecht untereinander, Einer unter Einer. Addiere von rechts nach links.","Ist das Ergebnis einer Spalte 10 oder größer, schreibst du den Übertrag klein in die nächste Spalte und rechnest ihn dort mit.","Überschlage vorher mit gerundeten Zahlen. Prüfe danach mit der Probe: Summe − Summand = anderer Summand."],"beispiel":"467 + 285: Einer 7 + 5 = 12, schreibe 2, Übertrag 1. Zehner 6 + 8 + 1 = 15, schreibe 5, Übertrag 1. Hunderter 4 + 2 + 1 = 7. Ergebnis 752.","heft":"Rechne schriftliche Aufgaben im Heft, ein Kästchen pro Ziffer."}},{"id":"5.3.3","titel":"Subtrahieren","extra":false,"lernziele":[{"id":"5.3.3-S1","text":"Ich kann die Fachbegriffe Minuend, Subtrahend und Differenz verwenden."},{"id":"5.3.3-S2","text":"Ich kann schriftlich subtrahieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K2","5.3.2-A2"]},{"id":"5.3.3-S3","text":"Ich kann mehrere Zahlen schriftlich subtrahieren.","voraussetzungen":["5.3.3-S2"]},{"id":"5.3.3-S4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.3-S2","5.3.2-A4"]},{"id":"5.3.3-S5","text":"Ich kann Sachaufgaben zur Subtraktion lösen.","voraussetzungen":["5.3.3-S2"]}],"merkzettel":{"regeln":["Minuend − Subtrahend = Differenz. Bei 46 − 12 = 34 ist 46 der Minuend, 12 der Subtrahend, 34 der Wert der Differenz.","Schriftlich subtrahieren: Schreibe stellengerecht untereinander und beginne bei den Einern.","Ist die obere Ziffer zu klein, rechnest du mit 10 mehr und merkst dir den Übertrag 1 für die nächste Spalte.","Mehrere Subtrahenden kannst du zuerst addieren und ihre Summe dann abziehen.","Probe: Differenz + Subtrahend = Minuend."],"beispiel":"532 − 218: Einer 12 − 8 = 4, Übertrag 1. Zehner 3 − 1 − 1 = 1. Hunderter 5 − 2 = 3. Ergebnis 314. Probe: 314 + 218 = 532.","heft":"Rechne schriftliche Aufgaben im Heft und schreibe den Übertrag immer mit."}},{"id":"5.3.4","titel":"Klammern","extra":false,"lernziele":[{"id":"5.3.4-B1","text":"Ich kann Rechenausdrücke mit Klammern berechnen.","voraussetzungen":["5.3.1-K1","5.3.1-K2"]},{"id":"5.3.4-B2","text":"Ich kann zu einem Text den passenden Rechenausdruck mit Klammern finden.","voraussetzungen":["5.3.4-B1"]}],"merkzettel":{"regeln":["Was in der Klammer steht, wird zuerst berechnet.","Ohne Klammern rechnest du bei Plus und Minus von links nach rechts.","Eine Klammer hinter einem Minus fasst zusammen, was insgesamt abgezogen wird."],"beispiel":"80 − (25 + 15) = 80 − 40 = 40. Ohne Klammer kommt etwas anderes heraus: 80 − 25 + 15 = 55 + 15 = 70.","heft":"Schreibe jeden Rechenschritt in eine neue Zeile und unterstreiche, was du als Nächstes rechnest."}},{"id":"5.3.5","titel":"Rechengesetze","extra":false,"lernziele":[{"id":"5.3.5-R1","text":"Ich kann das Vertauschungsgesetz und das Verbindungsgesetz erkennen."},{"id":"5.3.5-R2","text":"Ich kann mit den Rechengesetzen vorteilhaft rechnen.","voraussetzungen":["5.3.5-R1","5.3.1-K3"]}],"merkzettel":{"regeln":["Vertauschungsgesetz: Beim Addieren darfst du die Summanden vertauschen. 17 + 48 = 48 + 17.","Verbindungsgesetz: Beim Addieren darfst du Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52).","Beide Gesetze gelten nicht beim Subtrahieren: 9 − 4 ist nicht dasselbe wie 4 − 9.","Nutze die Gesetze, um zuerst die Zahlen zu addieren, die gut zusammenpassen."],"beispiel":"37 + 48 + 63 = 37 + 63 + 48 = 100 + 48 = 148.","heft":"Schreibe auf, wie du umgestellt hast, bevor du rechnest."}}]},{"id":"5.4","titel":"Multiplizieren und Dividieren","unterkapitel":[{"id":"5.4.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.4.1-L1","text":"Ich kann im Kopf multiplizieren und dividieren und dabei geschickt vorgehen."}]},{"id":"5.4.2","titel":"Multiplizieren","extra":false,"lernziele":[{"id":"5.4.2-L1","text":"Ich kann Multiplikationsaufgaben berechnen."}]},{"id":"5.4.3","titel":"Rechenvorteile","extra":false,"lernziele":[{"id":"5.4.3-L1","text":"Ich kann Rechengesetze anwenden und somit Rechenvorteile nutzen."}]},{"id":"5.4.4","titel":"Potenzen","extra":false,"lernziele":[{"id":"5.4.4-L1","text":"Ich kann Potenzen berechnen."}]},{"id":"5.4.5","titel":"Dividieren","extra":false,"lernziele":[{"id":"5.4.5-D1","text":"Ich kann die Fachbegriffe Dividend, Divisor und Quotient verwenden."},{"id":"5.4.5-D2","text":"Ich kann schriftlich durch einstellige Zahlen dividieren.","voraussetzungen":["5.3.1-K2","5.4.5-D1"]},{"id":"5.4.5-D3","text":"Ich kann schriftlich durch zweistellige Zahlen dividieren.","voraussetzungen":["5.4.5-D2"]},{"id":"5.4.5-D4","text":"Ich kann Divisionen mit Rest berechnen und den Rest deuten.","voraussetzungen":["5.4.5-D2"]},{"id":"5.4.5-D5","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.4.5-D2","5.3.2-A4"]},{"id":"5.4.5-D6","text":"Ich kann Sachaufgaben zur Division lösen.","voraussetzungen":["5.4.5-D2","5.4.5-D4"]}],"merkzettel":{"regeln":["Dividend : Divisor = Quotient. Bei 48 : 6 = 8 ist 48 der Dividend, 6 der Divisor, 8 der Wert des Quotienten.","Schriftlich dividieren: Beginne links. Teile, multipliziere zurück, ziehe ab und hole die nächste Ziffer herunter.","Bleibt am Ende etwas übrig, ist das der Rest. Der Rest ist immer kleiner als der Divisor.","Probe: Quotient · Divisor, dazu der Rest, ergibt den Dividenden.","Durch 0 kann man nicht dividieren."],"beispiel":"952 : 4: 9 : 4 = 2 Rest 1. Dann 15 : 4 = 3 Rest 3. Dann 32 : 4 = 8. Ergebnis 238. Probe: 238 · 4 = 952.","heft":"Rechne schriftliche Divisionen im Heft und schreibe die Probe dazu."},"wortspeicher":[{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen : vor. 12 : 3 heißt: 12 geteilt durch 3."},{"wort":"teilen","ab":"F","erklaerung":"Gerecht verteilen oder gleich große Gruppen bilden."},{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen · vor. Mal ist das Gegenteil von geteilt."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"Probe","ab":"F","erklaerung":"Du prüfst dein Ergebnis mit der Mal-Aufgabe. Zu 12 : 3 = 4 gehört 4 · 3 = 12."},{"wort":"Rest","ab":"F","erklaerung":"Was beim Teilen übrig bleibt. 14 : 4 = 3 Rest 2."},{"wort":"Quotient","ab":"G","erklaerung":"Das Ergebnis einer Geteilt-Aufgabe. Bei 12 : 3 = 4 ist 4 der Quotient."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"schriftlich dividieren","ab":"G","erklaerung":"Schritt für Schritt teilen: teilen, malnehmen, abziehen, nächste Ziffer herunterholen."},{"wort":"Dividend","ab":"M","erklaerung":"Die Zahl, die geteilt wird. Bei 12 : 3 ist 12 der Dividend."},{"wort":"Divisor","ab":"M","erklaerung":"Die Zahl, durch die geteilt wird. Bei 12 : 3 ist 3 der Divisor."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Division gehört die Multiplikation."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel (12 + 8) : 4."},{"wort":"Wert","ab":"E","erklaerung":"Die Zahl, die herauskommt, wenn man einen Term ausrechnet."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 7 teilbar, wenn beim Dividieren dur ","lernziel":"5.4.5-D2","niveau":"M","afb":2,"format":"zahl","text":"Um wie viel ist 856 : 2 größer als 856 : 8?","loesung":321,"typischeFehler":[{"wert":428,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":107,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne beide Quotienten und bilde dann die Differenz.","loesungsschritt":"Erster Quotient: 856 : 2 = 428."}},{"id":"5.4.5-D2-M-06","lernziel":"5.4.5-D2","niveau":"M","afb":3,"format":"auswahl","text":"Jana erhält bei 3535 : 7 das Ergebnis 55. Prüfe mit einem Überschlag und entscheide.","mehrfach":false,"optionen":[{"text":"Richtig: Der Überschlag bestätigt ein zweistelliges Ergebnis.","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"Falsch: Der Quotient muss vierstellig sein.","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"Falsch: 3500 : 7 = 500, der Quotient muss dreistellig sein. Richtig ist 505.","richtig":true},{"text":"Richtig: 55 · 7 = 3535.","richtig":false,"fehlvorstellung":"div-null-vergessen"}],"hilfen":{"tipp":"Runde den Dividenden so, dass du im Kopf teilen kannst. Wie viele Stellen hat der Quotient dann?","loesungsschritt":"Überschlage mit 3500 : 7."}},{"id":"5.4.5-D2-E-01","lernziel":"5.4.5-D2","niveau":"E","afb":1,"format":"zahl","text":"Dividiere schriftlich: 14 714 : 7","loesung":2102,"typischeFehler":[{"wert":212,"fehlvorstellung":"div-null-vergessen"},{"wert":21020,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Wie viele Stellen muss der Quotient nach einem Überschlag haben?"}},{"id":"5.4.5-D2-E-02","lernziel":"5.4.5-D2","niveau":"E","afb":2,"format":"zahl","text":"Bei einer Division wurde gekleckert: 9▢1 : 7. Welche Ziffer muss in der Lücke stehen, damit die Division ohne Rest aufgeht?","loesung":3,"typischeFehler":[],"hilfen":{"tipp":"Welche Vielfachen von 7 liegen zwischen 900 und 999 und enden auf 1?"}},{"id":"5.4.5-D2-E-03","lernziel":"5.4.5-D2","niveau":"E","afb":2,"format":"zahl","text":"Die Zahl 4▢3 soll ohne Rest durch 7 teilbar ehner. Das ist das Ergebnis."}},{"id":"5.4.5-D3-F-06","lernziel":"5.4.5-D3","niveau":"F","afb":3,"format":"auswahl","text":"Ali sagt:\n„Teile ich eine Zehnerzahl durch 10, fällt eine Null weg.“\nPrüfe mit 90 : 10 und 500 : 10.\nStimmt das?","mehrfach":false,"optionen":[{"text":"Ja.\n90 : 10 = 9 und 500 : 10 = 50.","richtig":true},{"text":"Ja.\n90 : 10 = 900.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"Nein.\n500 : 10 = 5.","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"Nein.\n90 : 10 = 90.","richtig":false,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Rechne beide Aufgaben aus. Vergleiche die Zahlen vorher und nachher.","beispiel":"40 : 10 = 4. Aus 40 wird 4. Eine Null ist weg.","loesungsschritt":"In 90 stecken 9 Zehner. In 500 stecken 50 Zehner."}},{"id":"5.4.5-D3-G-01","lernziel":"5.4.5-D3","niveau":"G","afb":1,"format":"zahl","text":"Rechne.\n360 : 90","loesung":4,"typischeFehler":[{"wert":40,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Teile erst durch 10. Teile dann durch 9.","beispiel":"180 : 20: 180 : 10 = 18. Dann 18 : 2 = 9.","loesungsschritt":"360 : 10 = 36. Rechne jetzt 36 : 9."}},{"id":"5.4.5-D3-G-02","lernziel":"5.4.5-D3","niveau":"G","afb":2,"format":"luecken","text":"Rechne 570 : 30 in 2 Schritten.\n570 : 10 = {{erst}}\nDann geteilt durch 3: {{dann}}","hilfen":{"tipp":"Durch 30 teilen heißt: erst durch 10, dann durch 3.","beispiel":"240 : 30: 240 : 10 = 24. Dann 24 : 3 = 8.","loesungsschritt":"570 : 10 = 57. Bei geteilt durch 10 fällt die letzte Null weg."},"luecken":{"erst":{"loesung":57,"typischeFehler":[]},"dann":{"loesung":19,"typischeFehler":[{"wert":190,"fehlvorstellung":"div-stellenwert"}]}}},{"id":"5.4.5-D3-G-03","lernziel":"5.4.5-D3","niveau":"G","afb":2,"format":"zahl","text":"Welche Zahl fehlt?\n▢ : 50 = 5","loesung":250,"typischeFehler":[{"wert":25,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Rechne rückwärts mit einer Mal-Aufgabe.","beispiel":"▢ : 20 = 6. Rechne 6 · 2 wert"}],"hilfen":{"tipp":"Notiere dir zuerst die Reihe 15, 30, 45, … am Rand. Sie hilft bei jedem Schritt.","loesungsschritt":"Beginne links. Wie oft passt die 15 in die 19? 1-mal, denn 1 · 15 = 15. Rechne 19 − 15 = 4. Hole die nächste Ziffer herunter."}},{"id":"5.4.5-D3-M-02","lernziel":"5.4.5-D3","niveau":"M","afb":2,"format":"zahl","text":"Bestimme den fehlenden Dividenden: ▢ : 18 = 445","loesung":8010,"typischeFehler":[{"wert":463,"fehlvorstellung":"begriffe-verwechselt"}],"hilfen":{"tipp":"Die Umkehraufgabe der Division ist die Multiplikation.","loesungsschritt":"Rechne 445 · 18."}},{"id":"5.4.5-D3-M-03","lernziel":"5.4.5-D3","niveau":"M","afb":2,"format":"zahl","text":"Dividiere 7380 durch das Produkt aus 3 und 15.","loesung":164,"typischeFehler":[{"wert":2460,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":492,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne zuerst das Produkt. Es ist der Divisor.","loesungsschritt":"Das Produkt ist 3 · 15 = 45."}},{"id":"5.4.5-D3-M-04","lernziel":"5.4.5-D3","niveau":"M","afb":1,"format":"zahl","text":"Dividiere schriftlich: 5275 : 25","loesung":211,"typischeFehler":[{"wert":2110,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Notiere dir zuerst die Reihe 25, 50, 75, … am Rand. Sie hilft bei jedem Schritt.","loesungsschritt":"Beginne links. Wie oft passt die 25 in die 52? 2-mal, denn 2 · 25 = 50. Rechne 52 − 50 = 2. Hole die nächste Ziffer herunter."}},{"id":"5.4.5-D3-M-05","lernziel":"5.4.5-D3","niveau":"M","afb":2,"format":"auswahl","text":"Welcher Überschlag passt am besten zu 6944 : 28?","mehrfach":false,"optionen":[{"text":"7500 : 30 = 250","richtig":true},{"text":"7500 : 100 = 75","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"7500 : 10 = 750","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"75 000 : 30 = 2500","richtig":false,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Runde den Divisor auf Zehner. Runde den Dividenden so, dass die Division glat 496 : 74","loesung":2304,"typischeFehler":[{"wert":234,"fehlvorstellung":"div-null-vergessen"},{"wert":23040,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Wie viele Stellen muss der Quotient nach einem Überschlag haben?"}},{"id":"5.4.5-D3-E-05","lernziel":"5.4.5-D3","niveau":"E","afb":2,"format":"zahl","text":"Eine Zahl ergibt bei Division durch 15 den Quotienten 45 und den größtmöglichen Rest. Wie heißt die Zahl?","loesung":689,"typischeFehler":[{"wert":675,"fehlvorstellung":"div-rest-vergessen"},{"wert":690,"fehlvorstellung":"div-rest-zu-gross"}],"hilfen":{"tipp":"Wie groß kann ein Rest bei Division durch 15 höchstens sein?"}},{"id":"5.4.5-D3-E-06","lernziel":"5.4.5-D3","niveau":"E","afb":3,"format":"auswahl","text":"Eine Zahl ist ohne Rest durch 18 teilbar. Welche Aussage gilt dann immer?","mehrfach":false,"optionen":[{"text":"Sie ist größer als 100.","richtig":false},{"text":"Sie ist auch durch 2 und durch 9 teilbar.","richtig":true},{"text":"Sie ist auch durch 12 teilbar.","richtig":false,"fehlvorstellung":"teilbar-summe"},{"text":"Sie ist auch durch 36 teilbar.","richtig":false,"fehlvorstellung":"teilbar-summe"}],"hilfen":{"tipp":"Prüfe jede Aussage an der Zahl 18 selbst."}},{"id":"5.4.5-D4-F-01","lernziel":"5.4.5-D4","niveau":"F","afb":1,"format":"zahl","text":"Du hast 5 Plättchen.\nDu legst immer 2 zusammen.\nWie viele Plättchen bleiben übrig?","loesung":1,"einheit":"Plättchen","typischeFehler":[{"wert":2,"fehlvorstellung":"div-rest-vergessen"},{"wert":0,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Nimm 5 Wendeplättchen. Lege 2er-Häufchen. Was nicht mehr für ein Häufchen reicht, bleibt übrig.","beispiel":"14 Plättchen, immer 4 zusammen: 3 Häufchen sind 12 Plättchen. 2 bleiben übrig.","loesungsschritt":"2 Häufchen sind 2 · 2 = 4 Plättchen. Wie viele fehlen bis 5?"}},{"id":"5.4.5-D4-F-02","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"zahl","text":"Welche Zahl fehlt?\n▢ : 3 = 6 Rest 2","loesung":20,"typischeFehler":[{"wert":18,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Rechne rückwärts: erst mal, dann den Rest dazu.","beispiel":"▢ : 3 = 4 Rest 1. Rechne 4 · 3 = 12. Dann 12 + 1 = 13.","loesungsschritt":"Rechne 6 · 3 = 18. Zähle dann den Rest 2 dazu."}},{"id":"5.4.5-D4-F-03","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"zahl","text":"13 Kinder bilden 2er-Gruppen.\nWie viele Kinder bleiben übrig?","loesung":1,"einheit":"Kinder","typischeFehler":[{"wert":6,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Zeichne 13 Kreise auf dein Schmierblatt. Kreise immer 2 ein.","beispiel":"13 Kinder, 4er-Gruppen: 3 Gruppen sind 12 Kinder. 1 Kind bleibt übrig.","loesungsschritt":"6 Gruppen sind 12 Kinder. Wie viele Kinder sind noch nicht in einer Gruppe?"}},{"id":"5.4.5-D4-F-04","lernziel":"5.4.5-D4","niveau":"F","afb":1,"format":"luecken","text":"5 : 2 = {{q}} Rest {{r}}","hilfen":{"tipp":"Suche in der 2er-Reihe die größte Zahl, die noch in die 5 passt.","beispiel":"17 : 5: 3 · 5 = 15 passt. Bis 17 fehlen 2. Also 3 Rest 2.","loesungsschritt":"2 · 2 = 4. Das passt in die 5. Wie viel bleibt übrig?"},"luecken":{"q":{"loesung":2,"typischeFehler":[{"wert":3,"fehlvorstellung":"div-einmaleins"}]},"r":{"loesung":1,"typischeFehler":[{"wert":3,"fehlvorstellung":"div-rest-zu-gross"}]}}},{"id":"5.4.5-D4-F-05","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"auswahl","text":"Bei welcher Aufgabe bleibt ein Rest?","mehrfach":false,"optionen":[{"text":"13 : 4","richtig":true},{"text":"20 : 4","richtig":false},{"text":"16 : 4","richtig":false},{"text":"12 : 4","richtig":false}],"hilfen":{"tipp":"Sage die 4er-Reihe auf. Welche Zahl kommt in der Reihe nicht vor?","beispiel":"Die 3er-Reihe: 3, 6, 9, 12. Die 10 kommt nicht vor. Bei 10 : 3 bleibt ein Rest.","loesungsschritt":"Die 4er-Reihe: 4, 8, 12, 16, 20, 24, 28, 32."}},{"id":"5.4.5-D4-F-06","lernziel":"5.4.5-D4","niveau":"F","afb":3,"format":"auswahl","text":"Paul rechnet: 11 : 2 = 4 Rest 3.\nWas stimmt?","mehrfach":false,"optionen":[{"text":"Falsch.\nBeim Teilen gibt es nie einen Rest.","richtig":false,"fehlvorstellung":"div-rest-vergessen"},{"text":"Richtig.\n4 · 2 + 3 = 11.","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"Falsch.\nRichtig ist 6 Rest 1.","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"Falsch.\nDer Rest 3 ist zu groß.\nDie 2 passt noch 1-mal hinein.\nRichtig ist 5 Rest 1.","richtig":true}],"hilfen":{"tipp":"Der Rest muss kleiner sein als die Zahl, durch die du teilst.","beispiel":"14 : 4 = 2 Rest 6? Der Rest 6 ist größer als 4. Es passt noch ein Häufchen. Richtig ist 3 Rest 2.","loesungsschritt":"Paul hat 3 Plättchen übrig. Kann er daraus noch ein 2er-Häufchen legen?"}},{"id":"5.4.5-D4-G-01","lernziel":"5.4.5-D4","niveau":"G","afb":1,"format":"luecken","text":"55 : 7 = {{q}} Rest {{r}}","hilfen":{"tipp":"Suche in der 7er-Reihe die größte Zahl, die noch in die 55 passt.","beispiel":"47 : 6: 7 · 6 = 42 passt. Bis 47 fehlen 5. Also 7 Rest 5.","loesungsschritt":"7 · 7 = 49. Rechne 55 − 49."},"luecken":{"q":{"loesung":7,"typischeFehler":[{"wert":8,"fehlvorstellung":"div-einmaleins"}]},"r":{"loesung":6,"typischeFehler":[{"wert":13,"fehlvorstellung":"div-rest-zu-gross"}]}}},{"id":"5.4.5-D4-G-02","lernziel":"5.4.5-D4","niveau":"G","afb":2,"format":"zahl","text":"Welche Zahl fehlt?\n▢ : 9 = 6 Rest 4","loesung":58,"typischeFehler":[{"wert":54,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Mache die Probe: Ergebnis mal Teiler, dann den Rest dazu.","beispiel":"▢ : 6 = 7 Rest 5. Rechne 7 · 6 = 42. Dann 42 + 5 = 47.","loesungsschritt":"Rechne 6 · 9 = 54. Zähle den Rest 4 dazu."}},{"id":"5.4.5-D4-G-03","lernziel":"5.4.5-D4","niveau":"G","afb":2,"format":"zahl","text":"Es gibt 23 Eier.\nIn 1 Karton passen 3 Eier.\nWie viele Kartons werden ganz voll?","loesung":7,"typischeFehler":[{"wert":8,"fehlvorstellung":"div-rest-nicht-gedeutet"},{"wert":2,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Teile 23 durch 3. Nur volle Kartons zählen.","beispiel":" lvorstellung":"ueberschlag-nicht-gerundet"},{"text":"Er kann zu groß oder zu klein sein, weil die beiden Rundungen in entgegengesetzte Richtungen wirken.","richtig":true},{"text":"Er ist dann immer zu klein.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Er ist dann immer zu groß.","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Was bewirkt ein größerer Dividend, was ein größerer Divisor? Probiere 100 : 20, 120 : 20 und 100 : 25."}},{"id":"5.4.5-D6-F-01","lernziel":"5.4.5-D6","niveau":"F","afb":1,"format":"zahl","text":"Herr Keller legt 24 Kekse in Dosen.\nIn jede Dose kommen 4 Kekse.\nWie viele Dosen werden voll?","loesung":6,"einheit":"Dosen","typischeFehler":[{"wert":20,"fehlvorstellung":"div-falsche-rechenart"},{"wert":28,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Nimm 24 Wendeplättchen. Lege immer 4 Plättchen zusammen. Zähle die Häufchen.","beispiel":"24 Äpfel, immer 4 in eine Tüte: 24 : 4 = 6. Es werden 6 Tüten.","loesungsschritt":"Nutze die 4er-Reihe: 1 · 4 = 4, 2 · 4 = 8, … ▢ · 4 = 24."}},{"id":"5.4.5-D6-F-02","lernziel":"5.4.5-D6","niveau":"F","afb":2,"format":"auswahl","text":"6 Kekse.\nImmer 2 kommen in eine Dose.\nWie viele Dosen sind es?\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"6 : 2","richtig":true},{"text":"6 · 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"6 − 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"6 + 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Hier wird in gleiche Gruppen aufgeteilt. Dazu passt geteilt.","beispiel":"12 Kekse, immer 3 in eine Dose. Die Rechnung ist 12 : 3.","loesungsschritt":"Du legst immer 2 zusammen, bis alle 6 verteilt sind. Das ist Teilen."}},{"id":"5.4.5-D6-F-03","lernziel":"5.4.5-D6","niveau":"F","afb":2,"format":"auswahl","text":"Die Rechnung ist 10 : 2 = 5.\nWelche Geschichte passt?","mehrfach":false,"optionen":[{"text":"Zu 10 Keksen kommen 2 Kekse dazu.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"10 Kekse werden an 2 Kinder gerecht verteilt.","richtig":true},{"text":"Von 10 Keksen werden 2 gegessen.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"2 Kinder haben jedes 10 Kekse.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Geteilt bedeutet: gerecht verteilen.","beispiel":"10 : 2 = 5 passt zu: 10 Äpfel werden an 2 Kinder verteilt.","loesungsschritt":"Suche die Geschichte, in der etwas gerecht verteilt wird."}},{"id":"5.4.5-D6-F-04","lernziel":"5.4.5-D6","niveau":"F","afb":1,"format":"zahl","text":"3 Kinder teilen 15 Äpfel gerecht.\nWie viele Äpfel bekommt 1 Kind?","loesung":5,"einheit":"Äpfel","typischeFehler":[{"wert":12,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Zeichne 3 Kinder auf dein Schmierblatt. Verteile 15 Striche reihum.","beispiel":"3 Kinder teilen 15 Kekse: 15 : 3 = 5. Jedes Kind bekommt 5.","loesungsschritt":"Rechne 15 : 3. Frage dich: Wie oft passt die 3 in die 15?"}},{"id":"5.4.5-D6-F-05","lernziel":"5.4.5-D6","niveau":"F","afb":2,"format":"auswahl","text":"15 Kinder gehen in 5 gleich große Gruppen.\nLeo rechnet 15 : 5 = 3.\nWas bedeutet die 3?","mehrfach":false,"optionen":[{"text":"Es fehlen 3 Kinder.","richtig":false},{"text":"3 Kinder bleiben übrig.","richtig":false,"fehlvorstellung":"div-rest-vergessen"},{"text":"Es gibt 3 Gruppen.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"In jeder Gruppe sind 3 Kinder.","richtig":true}],"hilfen":{"tipp":"Lies noch einmal: Wie viele Gruppen gibt es? Was wurde ausgerechnet?","beispiel":"12 Kinder in 3 Gruppen: 12 : 3 = 4. In jeder Gruppe sind 4 Kinder.","loesungsschritt":"Die Zahl der Gruppen kennst du schon: 5. Die 3 sagt etwas über eine Gruppe."}},{"id":"5.4.5-D6-F-06","lernziel":"5.4.5-D6","niveau":"F","afb":3,"format":"auswahl","text":"Sara hat 20 Bonbons für 5 Kinder.\nJedes Kind soll gleich viele bekommen.\nSara rechnet 20 − 5 = 15.\nWas stimmt?","mehrfach":false,"optionen":[{"text":"Richtig.\nJedes Kind bekommt 15 Bonbons.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"Richtig.\nEs bleiben 15 Bonbons übrig.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"Falsch.\nSie muss teilen: 20 : 5 = 4.\nJedes Kind bekommt 4.","richtig":true},{"text":"Falsch.\nSie muss mal rechnen: 20 · 5 = 100.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Gerecht verteilen heißt teilen. Lege es mit Wendeplättchen nach.","beispiel":"12 Bonbons für 3 Kinder: 12 : 3 = 4. Jedes Kind bekommt 4.","loesungsschritt":"Verteile 20 Plättchen reihum an 5 Plätze. Wie viele liegen an jedem Platz?"}},{"id":"5.4.5-D6-G-01","lernziel":"5.4.5-D6","niveau":"G","afb":1,"format":"zahl","text":"Die Klasse kauft 8 Bälle.\nAlle kosten gleich viel.\nZusammen kosten sie 216 €.\nWie viel Euro kostet 1 Ball?","loesung":27,"einheit":"€","typischeFehler":[{"wert":208,"fehlvorstellung":"div-falsche-rechenart"},{"wert":270,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Der Preis wird gerecht auf 8 Bälle verteilt. Du musst teilen.","beispiel":"6 Springseile kosten 138 €. Zerlege: 120 : 6 = 20 und 18 : 6 = 3. Ein Seil kostet 23 €.","loesungsschritt":"Beginne links. Wie oft passt die 8 in die 21? 2-mal, denn 2 · 8 = 16. Rechne 21 − 16 = 5. Hole die nächste Ziffer herunter."}},{"id":"5.4.5-D6-G-02","lernziel":"5.4.5-D6","niveau":"G","afb":2,"format":"auswahl","text":"7 Springseile kosten zusammen 133 €.\nAlle kosten gleich viel.\nGesucht ist der Preis für 1 Stück.\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"133 : 7","richtig":true},{"text":"7 : 133","richtig":false,"fehlvorstellung":"div-vertauscht"},{"text":"133 · 7","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"133 − 7","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Der Gesamtpreis wird gerecht aufgeteilt.","beispiel":"4 Bälle kosten 48 €. Ein Ball kos 06","lernziel":"5.4.5-D6","niveau":"G","afb":3,"format":"auswahl","text":"8 Springseile kosten zusammen 120 €.\nFinn sagt: „1 Springseil kostet 112 €.“\nEr hat minus gerechnet.\nWas stimmt?","mehrfach":false,"optionen":[{"text":"Falsch.\nEr muss mal rechnen: 120 · 8.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"Falsch.\nEr muss teilen: 120 : 8 = 15.\n1 Springseil kostet 15 €.","richtig":true},{"text":"Richtig.\nEin Stück kostet fast so viel wie alle zusammen.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"Richtig.\n120 − 8 = 112.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Überlege: Kann ein Stück fast so viel kosten wie alle zusammen?","beispiel":"4 Bälle kosten 48 €. Ein Ball kostet 48 : 4 = 12 €. Nicht 48 − 4 = 44 €.","loesungsschritt":"Prüfe Finns Antwort: 8 mal 112 € wäre viel mehr als 120 €."}},{"id":"5.4.5-D6-M-01","lernziel":"5.4.5-D6","niveau":"M","afb":1,"format":"zahl","text":"Ein Lkw legt in 21 Tagen 3045 km zurück, jeden Tag gleich viel. Wie viele Kilometer fährt er an einem Tag?","loesung":145,"einheit":"km","typischeFehler":[{"wert":1450,"fehlvorstellung":"div-stellenwert"},{"wert":3024,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Hier wird gleichmäßig verteilt. Welche Rechenart passt?","loesungsschritt":"Rechne 3045 : 21."}},{"id":"5.4.5-D6-M-02","lernziel":"5.4.5-D6","niveau":"M","afb":2,"format":"sachaufgabe","text":"Eine Schule bekommt 3026 Hefte. 730 Hefte kommen ins Lager. Die übrigen werden gleichmäßig an 14 Klassen verteilt.","teile":[{"format":"zahl","text":"Wie viele Hefte werden verteilt?","loesung":2296,"einheit":"Hefte","typischeFehler":[]},{"format":"zahl","text":"Wie viele Hefte bekommt jede Klasse?","loesung":164,"einheit":"Hefte","typischeFehler":[]}],"hilfen":{"tipp":"Rechne Schritt für Schritt: erst abziehen, dann gleichmäßig teilen.","loesungsschritt":"Für die erste Frage rechnest du 3026 − 730."}},{"id":"5.4.5-D6-M-03","lernziel":"5.4.5-D6","niveau":"M","afb":2,"format":"auswahl","text":"Ein Bauer erntet 2516 kg Kartoffeln. 360 kg behält er selbst. Den Rest füllt er gleichmäßig in 22 Säcke. Wie viel Kilogramm sind in einem Sack? Welcher Rechenausdruck passt?","mehrfach":false,"optionen":[{"text":"2516 : 22 − 360","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"(2516 − 360) : 22","richtig":true},{"text":"(2516 + 360) : 22","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"2516 − 360 : 22","richtig":false,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Was muss zuerst berechnet werden? Das gehört in die Klammer.","loesungsschritt":"Erst wird abgezogen, dann wird das Ergebnis geteilt."}},{"id":"5.4.5-D6-M-04","lernziel":"5.4.5-D6","niveau":"M","afb":1,"format":"zahl","text":"Ein Lkw legt in 22 Tagen 3080 km zurück, jeden Tag gleich viel. Wie viele Kilometer fährt er an einem Tag?","loesung":140,"einheit":"km","typischeFehler":[{"wert":1400,"fehlvorstellung":"div-stellenwert"},{"wert":3058,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Hier wird gleichmäßig verteilt. Welche Rechenart passt?","loesungsschritt":"Rechne 3080 : 22."}},{"id":"5.4.5-D6-M-05","lernziel":"5.4.5-D6","niveau":"M","afb":2,"format":"zahl","text":"In einer Fabrik werden 7920 Flaschen in Kästen zu je 24 Flaschen gepackt. Je 30 Kästen kommen auf eine Palette. Wie viele Paletten werden voll?","loesung":11,"einheit":"Paletten","typischeFehler":[{"wert":330,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne zuerst die Zahl der Kästen, dann die Zahl der Paletten.","loesungsschritt":"Kästen: 7920 : 24 = 330."}},{"id":"5.4.5-D6-M-06","lernziel":"5.4.5-D6","niveau":"M","afb":3,"format":"auswahl","text":"Der Ausflug kostet für 21 Kinder zusammen 420 €. Mira sagt: „Wenn jedes Kind 18 € mitbringt, reicht das Geld.“ Beurteile ihre Aussage.","mehrfach":false,"optionen":[{"text":"Falsch: Jedes Kind muss 21 € zahlen.","richtig":false,"fehlvorstellung":"div- (()=>{var I={nummer:"0.7",datum:"18.11.2026",schueler:["Einstiegscheck: Bevor du in einem Kapitel die erste Aufgabe bearbeitest, bietet dir die Regionskarte sechs bis acht Aufgaben aus allen Meilensteinen an, je ein Versuch, ohne Hilfek\xE4rtchen. Danach bekommst du einen Vorschlag, um welche Krone du spielen k\xF6nntest. Es gibt dabei keine M\xFCnzen und keine Siegel, und meistens darfst du ihn \xFCberspringen.","Br\xFCcke: Wird ein Lernziel wackelig, schl\xE4gt dir das Dashboard drei kurze Aufgaben zu einem Lernziel vor, das du daf\xFCr brauchst, eine Krone tiefer. Danach geht es zur\xFCck zu deinem Lernziel. Die Br\xFCcke ist freiwillig."],lehrkraft:["Einstiegscheck: unter Verwaltung je Kapitel als Pflicht einstellbar. Im Lernstand zeigt die neue Karte \u201EVorwissen aus dem Einstiegscheck\u201C, wie viele ihn gemacht oder \xFCbersprungen haben, welche Kronen vorgeschlagen wurden und wie gut jeder Meilenstein schon sitzt.","Br\xFCcken-Impuls: Ist ein Sch\xFCler in der laufenden Stunde bei einem Lernziel wackelig und eine Voraussetzung sitzt noch nicht, steht das unter \u201EImpulse\u201C, mit dem Hinweis, ob die Br\xFCcke schon gegangen wurde.","Aufgaben aus dem Einstiegscheck z\xE4hlen f\xFCr kein Lernziel: Ein Lernziel wird dadurch nicht \u201Ebegonnen\u201C oder \u201Ewackelig\u201C."]};var At=`#mathekingdom-lehrer, #mk-druck {

  --rand: #d9d4c7; --gut: #1a7f4b; --gut-hell: #e3f4ea; --schlecht: #b3372f; --schlecht-hell: #fbe9e7; --hell: #fff8e1;
  font: 15.5px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--tinte);
}
body { margin: 0; background: #f4f1ea; }
#mathekingdom-lehrer { min-height: 100vh; background: var(--papier); }
#mathekingdom-lehrer *, #mk-druck * { box-sizing: border-box; }
#mathekingdom-lehrer main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
#mathekingdom-lehrer h1, #mk-druck h1 { font-size: 1.5rem; margin: 0 0 6px; color: var(--nacht); }
#mathekingdom-lehrer h2, #mk-druck h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--nacht); }
#mathekingdom-lehrer h3, #mk-druck h3 { font-size: .98rem; margin: 18px 0 8px; color: var(--nacht); }
#mathekingdom-lehrer p, #mk-druck p { margin: 0 0 10px; }
#mathekingdom-lehrer .klein, #mk-druck .klein { font-size: .86rem; color: var(--grau); }
#mathekingdom-lehrer .fehlertext { color: var(--schlecht); font-weight: 600; }

#mathekingdom-lehrer button, #mathekingdom-lehrer input, #mathekingdom-lehrer select, #mathekingdom-lehrer textarea { font: inherit; color: inherit; }
#mathekingdom-lehrer button { cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 7px 14px; white-space: nowrap; }
#mathekingdom-lehrer :is(button, input, select, textarea):focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#mathekingdom-lehrer .haupt { background: var(--nacht); color: #fff; font-weight: 600; }
#mathekingdom-lehrer .haupt:hover { background: #2a3d6e; }
#mathekingdom-lehrer .schlicht { background: #fff; border-color: #b9bfcc; color: var(--nacht); }
#mathekingdom-lehrer .schlicht:hover { background: #ece8dd; }
#mathekingdom-lehrer .schlicht.hell { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
#mathekingdom-lehrer .link { background: none; border: 0; padding: 0; color: var(--nacht); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
#mathekingdom-lehrer input[type=text], #mathekingdom-lehrer select, #mathekingdom-lehrer textarea { border: 1.5px solid #b9bfcc; border-radius: 8px; padding: 6px 10px; background: #fff; }
#mathekingdom-lehrer textarea { width: 100%; max-width: 520px; display: block; margin-bottom: 10px; }

#mathekingdom-lehrer .kopf { background: var(--nacht); color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-bottom: 4px solid var(--gold); flex-wrap: wrap; }
#mathekingdom-lehrer .kopf strong { font-size: 1.1rem; }
#mathekingdom-lehrer .kopf > span { color: #c9d1e8; }
#mathekingdom-lehrer .kopf .demo { color: #ffe08a; font-weight: 600; }
#mathekingdom-lehrer .kopf button { margin-left: auto; }

#mathekingdom-lehrer .meldung { display: flex; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 10px; margin: 0 0 14px; border: 1px solid; }
#mathekingdom-lehrer .meldung ul { margin: 0; padding-left: 18px; flex: 1; }
#mathekingdom-lehrer .meldung.warnung { background: var(--hell); border-color: #ecd58a; }
#mathekingdom-lehrer .meldung.fehler { background: var(--schlecht-hell); border-color: #e7b3ad; color: var(--schlecht); font-weight: 600; border-radius: 0; margin: 0; justify-content: center; }

#mathekingdom-lehrer .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(29,43,79,.06); }
#mathekingdom-lehrer .karte.schmal { max-width: 620px; margin: 6vh auto 0; }
#mathekingdom-lehrer .karte.schmal h2 { margin-top: 22px; }
#mathekingdom-lehrer .karte.schmal > .schlicht { margin-top: 14px; }
#mathekingdom-lehrer .reihe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#mathekingdom-lehrer .klassenliste { list-style: none; padding: 0; margin: 0; }

#mathekingdom-lehrer .leiste { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
#mathekingdom-lehrer .leiste h1 { margin: 0; }
#mathekingdom-lehrer .leiste .rechts { margin-left: auto; display: flex; gap: 8px; }
#mathekingdom-lehrer .schalter { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

#mathekingdom-lehrer .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--rand); margin-bottom: 14px; flex-wrap: wrap; }
#mathekingdom-lehrer .tabs button { background: transparent; border-radius: 8px 8px 0 0; color: var(--grau); padding: 8px 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; }
#mathekingdom-lehrer .tabs button.aktiv { color: var(--nacht); font-weight: 700; border-bottom-color: var(--gold); background: #fff; }

#mathekingdom-lehrer .schlange { list-style: none; counter-reset: platz; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
#mathekingdom-lehrer .schlange li { counter-increment: platz; border: 2px solid #ecd58a; background: var(--hell); border-radius: 10px; padding: 10px 12px 10px 46px; position: relative; display: grid; gap: 6px; }
#mathekingdom-lehrer .schlange li::before { content: counter(platz); position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--nacht); color: #fff; display: grid; place-items: center; font-weight: 700; }
#mathekingdom-lehrer .schlange li.unterwegs { border-color: #a9dcbf; background: var(--gut-hell); }

#mathekingdom-lehrer .marke { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 99px; padding: 1px 9px; margin: 1px 4px 1px 0; border: 1px solid; white-space: nowrap; }
#mathekingdom-lehrer .marke.warn { background: var(--hell); color: #7a5b00; border-color: #ecd58a; }
#mathekingdom-lehrer .marke.gut { background: var(--gut-hell); color: var(--gut); border-color: #a9dcbf; }
#mathekingdom-lehrer .marke.schlecht { background: var(--schlecht-hell); color: var(--schlecht); border-color: #e7b3ad; }
.chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-weight: 700; font-size: .78rem; margin-right: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

#mathekingdom-lehrer .rollbar { overflow-x: auto; }
.tabelle { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tabelle th { text-align: left; font-size: .8rem; font-weight: 600; color: #5d6679; padding: 6px 10px; border-bottom: 2px solid #d9d4c7; vertical-align: bottom; }
.tabelle td { padding: 6px 10px; border-bottom: 1px solid #ece8dd; vertical-align: top; }
.tabelle td.zahl { text-align: right; white-space: nowrap; }
.tabelle td.code { font-family: Consolas, ui-monospace, monospace; font-weight: 700; letter-spacing: .05em; }
#mathekingdom-lehrer .tabelle tbody tr:hover { background: #faf8f2; }

.balken { position: relative; display: inline-block; width: 120px; height: 18px; background: #ece8dd; border-radius: 4px; overflow: hidden; vertical-align: middle; }
.balken i { position: absolute; inset: 0 auto 0 0; background: #7f9bd1; border-radius: 0 4px 4px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.balken b { position: relative; font-size: .78rem; padding-left: 6px; line-height: 18px; color: #1f2533; }

.matrix th.gruppe { text-align: center; border-left: 2px solid #fff; background: #ece8dd; color: #1d2b4f; }
.matrix th.kurz { text-align: center; cursor: help; }
.matrix td.zelle { text-align: center; width: 46px; border-left: 2px solid #fff; font-size: .82rem; cursor: help; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.matrix td.zelle.erreicht { background: #f5c518; color: #4a3a00; font-weight: 700; }
.matrix td.zelle.begonnen { background: #fff8e1; color: #7a5b00; }
.matrix td.zelle.offen { color: #9aa3b5; }

#mathekingdom-lehrer .liste { margin: 0 0 10px; padding-left: 18px; }
#mathekingdom-lehrer .liste li { margin-bottom: 4px; }
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; }
.kachel { border: 1px solid #d9d4c7; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; }
.kachel span { font-size: .8rem; color: #5d6679; }
.kachel b { font-size: 1.25rem; color: #1d2b4f; font-variant-numeric: tabular-nums; }
.verlauf { line-height: 1.9; }

@media print {
  body > *:not(#mk-druck) { display: none !important; }
  body { background: #fff; }
  #mk-druck { font-size: 10pt; }
  #mk-druck .rollbar { overflow: visible; }
  #mk-druck .tabelle th, #mk-druck .tabelle td { padding: 3px 6px; }
  #mk-druck tr { break-inside: avoid; }
  #mk-druck h2 { margin-top: 18px; }
  #mk-druck ul.klein { list-style: none; padding: 0; margin-top: 10px; }
  #mk-druck .kaertchen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  #mk-druck .kaertchen > div { border: 1px dashed #777; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; break-inside: avoid; }
  #mk-druck .kaertchen b { font: 700 20pt Consolas, ui-monospace, monospace; letter-spacing: .08em; }
  #mk-druck .kaertchen small { color: #555; }
}
@media screen { #mk-druck { display: none; } }

/* Bedienung mit dem Finger */
#mathekingdom-lehrer button, #mathekingdom-lehrer select { min-height: 40px; }
#mathekingdom-lehrer .link { min-height: 0; }

/* Klassenraum */
#mathekingdom-lehrer .karte > .reihe:first-child { margin-bottom: 10px; }
#mathekingdom-lehrer .karte > .reihe:first-child h2 { margin: 0; }
#mathekingdom-lehrer .reihe .rechts, #mathekingdom-lehrer .rechts { margin-left: auto; }
#mathekingdom-lehrer .legende { display: flex; gap: 12px; flex-wrap: wrap; font-size: .86rem; color: var(--grau); }
#mathekingdom-lehrer .punkt { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#mathekingdom-lehrer .punkt i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-style: normal; font-weight: 700; font-size: .75rem; color: #fff; background: #8d97ad; }
#mathekingdom-lehrer .punkt.flow i { background: var(--gut); }
#mathekingdom-lehrer .punkt.arbeitet i { background: #7f9bd1; }
#mathekingdom-lehrer .punkt.beobachten i, #mathekingdom-lehrer .punkt.hilfe i { background: #c98a00; }
#mathekingdom-lehrer .punkt.blockiert i { background: var(--schlecht); }
#mathekingdom-lehrer .sitzplan { display: grid; gap: 8px; }
#mathekingdom-lehrer .platz { min-height: 92px; border-radius: 10px; border: 2px solid var(--rand); background: #fff; padding: 8px 10px; text-align: left; white-space: normal;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-content: start; position: relative; overflow: hidden; }
#mathekingdom-lehrer .platz b { grid-column: 1; font-size: .95rem; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; min-width: 0; }
@media (max-width: 900px) { #mathekingdom-lehrer .platz { padding: 6px; } #mathekingdom-lehrer .platz b { font-size: .84rem; } #mathekingdom-lehrer .platz .zeichen { width: 20px; height: 20px; font-size: .75rem; } }
#mathekingdom-lehrer .platz .zeichen { grid-column: 2; grid-row: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: #8d97ad; }
#mathekingdom-lehrer .platz .was { grid-column: 1 / -1; font-size: .8rem; color: var(--grau); }
#mathekingdom-lehrer .platz .unten { grid-column: 1 / -1; font-size: .8rem; display: flex; align-items: center; gap: 2px; margin-top: 2px; }
#mathekingdom-lehrer .platz .chip { width: 18px; height: 18px; font-size: .68rem; }
#mathekingdom-lehrer .platz.leer { border: 0; background: transparent; }
#mathekingdom-lehrer .sitzplan.bearbeiten .platz.leer { border: 2px dashed #b9bfcc; }
#mathekingdom-lehrer .platz.gewaehlt { outline: 4px solid var(--gold); outline-offset: 1px; }
#mathekingdom-lehrer .platz.flow { background: var(--gut-hell); border-color: var(--gut); }
#mathekingdom-lehrer .platz.flow .zeichen { background: var(--gut); }
#mathekingdom-lehrer .platz.arbeitet .zeichen { background: #7f9bd1; }
#mathekingdom-lehrer .platz.beobachten, #mathekingdom-lehrer .platz.hilfe { background: #fff1c2; border-color: #c98a00; }
#mathekingdom-lehrer .platz.beobachten .zeichen, #mathekingdom-lehrer .platz.hilfe .zeichen { background: #c98a00; }
#mathekingdom-lehrer .platz.hilfe { box-shadow: 0 0 0 3px #c98a00; }
#mathekingdom-lehrer .platz.hilfe .was, #mathekingdom-lehrer .platz.blockiert .was { color: var(--tinte); font-weight: 600; }

#mathekingdom-lehrer .platz.inaktiv { background: #ebe8e0; }
#mathekingdom-lehrer .platz.fehlt { background: transparent; border-style: dashed; color: var(--grau); }

/* Akut-Zone und Impulse */
#mathekingdom-lehrer .schlange li.blockiert { border-color: #e7b3ad; background: var(--schlecht-hell); }
#mathekingdom-lehrer .schlange li .marke { margin-left: 8px; }
#mathekingdom-lehrer .nachricht summary { cursor: pointer; color: var(--nacht); font-weight: 600; padding: 6px 0; }
#mathekingdom-lehrer .nachricht .reihe { margin-top: 6px; }
#mathekingdom-lehrer .nachricht .schlicht { white-space: normal; text-align: left; }
#mathekingdom-lehrer .nachricht input { flex: 1 1 160px; min-height: 40px; }
#mathekingdom-lehrer .impulse { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
#mathekingdom-lehrer .impulse li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid #ecd58a; background: var(--hell); border-radius: 10px; padding: 8px 12px; }
#mathekingdom-lehrer .impulse li > span { flex: 1 1 320px; }
#mathekingdom-lehrer .impulse li.gut { border-color: #a9dcbf; background: var(--gut-hell); }

/* Detailansicht */
#mathekingdom-lehrer .overlay { position: fixed; inset: 0; background: rgba(29,43,79,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
#mathekingdom-lehrer .overlay-inhalt { background: #fff; border-radius: 14px; width: min(980px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
#mathekingdom-lehrer .overlay-kopf { position: sticky; top: -18px; background: #fff; padding: 10px 0; margin-top: -10px; z-index: 1; border-bottom: 1px solid var(--rand); }
#mathekingdom-lehrer .overlay-kopf h2 { margin: 0; font-size: 1.3rem; }
.zweispaltig { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 24px; }

/* Lernpfad */
#mathekingdom-lehrer .pfad th { vertical-align: top; min-width: 150px; }
#mathekingdom-lehrer .pfad th select { margin-top: 4px; font-weight: 400; max-width: 190px; }
#mathekingdom-lehrer .sperre { width: 100%; background: #fff; border-color: #b9bfcc; color: var(--nacht); }
#mathekingdom-lehrer .sperre.erreicht { background: #f5c518; border-color: #a67c00; color: #4a3a00; font-weight: 600; }
#mathekingdom-lehrer .sperre.begonnen { background: var(--hell); border-color: #ecd58a; }
#mathekingdom-lehrer .sperre.zu { background: #5d6679; border-color: #5d6679; color: #fff; font-weight: 600; }

@media print {
  #mk-druck .kacheln { grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
  #mk-druck .kachel { padding: 4px 8px; }
  #mk-druck h3 { margin: 10px 0 4px; }
  #mk-druck .zweispaltig { grid-template-columns: 1fr 1fr; }
}
@media print { #mk-druck .kaertchen b.pin { font-size: 16pt; letter-spacing: .25em; } #mk-druck .kaertchen span { margin-top: 6px; font-size: 9pt; color: #555; } }

/* Aufgaben-Auswertung */
.filter { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 12px; }
.filter label { display: flex; flex-direction: column; gap: 2px; }
.filter select { min-height: 40px; }
.tabelle.gruppen td:first-child { font-weight: 600; white-space: nowrap; }

/* ---------- Bereiche und Lernstand (ADR 0010) ---------- */
#mathekingdom-lehrer .tabs.bereiche button { font-size: 1.02rem; padding: 10px 22px; }
#mathekingdom-lehrer .leiste .rechts { margin-left: auto; }
#mathekingdom-lehrer .zweispaltig > .karte { margin-bottom: 14px; }

#mathekingdom-lehrer .kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
#mathekingdom-lehrer .kennzahl { background: var(--karte); border: 1px solid var(--rand); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
#mathekingdom-lehrer .kennzahl b { font-size: 1.7rem; line-height: 1.1; color: var(--nacht); font-variant-numeric: tabular-nums; }
#mathekingdom-lehrer .kennzahl span { font-size: .9rem; color: var(--tinte); }

#mathekingdom-lehrer .nebenwerte { margin: -4px 2px 14px; }

#mathekingdom-lehrer details.aufklapp[open] > summary::before { content: '\u25BE'; }
#mathekingdom-lehrer details.aufklapp > summary h2 { margin: 0; }
#mathekingdom-lehrer details.aufklapp[open] > summary { margin-bottom: 12px; }

/* Vier Zust\xE4nde: Farbe plus Zeichen, damit nichts an der Farbe allein h\xE4ngt. */
.zelle { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.zelle.offen { background: #ece9e2; color: #6b7280; }
.zelle.begonnen { background: #5f97cf; color: #fff; }
.zelle.wackelig { background: #dd8526; color: #1f2533; font-weight: 800; }
.zelle.siegel { background: #2a7a50; color: #fff; font-weight: 700; }
.zelle.aufzufrischen { background: #a8d5b8; color: #14402a; font-weight: 800; box-shadow: inset 0 0 0 2px #2a7a50; }
.zlegende { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; font-size: .84rem; color: #5d6679; }
.zlegende li { display: inline-flex; align-items: center; gap: 6px; }
.zlegende i, #mathekingdom-lehrer .gruppenliste h3 i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font-size: .78rem; }

.heatmap { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
.heatmap th { font-size: .78rem; font-weight: 600; color: #5d6679; padding: 2px 4px; }
.heatmap th.gruppe { background: #ece8dd; color: #1d2b4f; border-radius: 4px; text-align: center; font-size: .74rem; }
.heatmap th.name { text-align: left; padding-right: 12px; white-space: nowrap; font-size: .88rem; color: #1f2533; }
.heatmap th.kurz { text-align: center; }
.heatmap .spalte { background: none; border: 0; padding: 4px 2px; font: inherit; font-weight: 700; color: #1d2b4f; text-decoration: underline dotted; text-underline-offset: 3px; }
.heatmap .spalte:hover { color: #000; background: #ece8dd; border-radius: 4px; }
.heatmap td.zelle { width: 34px; min-width: 34px; height: 28px; text-align: center; border-radius: 4px; font-size: .82rem; cursor: default; }
.heatmap td.summe, .heatmap th.summe { text-align: right; padding-left: 10px; font-weight: 700; color: #1d2b4f; }
#mathekingdom-lehrer .heatmap tbody tr:hover th.name { background: #faf8f2; }

/* Gestapelte Balken je Lernziel */
#mathekingdom-lehrer .stapel { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
#mathekingdom-lehrer .stapelzeile { width: 100%; display: grid; grid-template-columns: minmax(0, 2fr) minmax(160px, 3fr) 3.5em; gap: 12px; align-items: center; background: none; border: 0; border-radius: 6px; padding: 6px 8px; text-align: left; white-space: normal; }
#mathekingdom-lehrer .stapelzeile:hover { background: #faf8f2; }
#mathekingdom-lehrer .stapelname { font-size: .88rem; line-height: 1.3; }
#mathekingdom-lehrer .stapelname small { display: block; color: var(--grau); font-size: .76rem; }
#mathekingdom-lehrer .stapelbalken { display: flex; gap: 2px; height: 22px; }
#mathekingdom-lehrer .stapelbalken .teil { flex-basis: 0; display: grid; place-items: center; font-style: normal; font-size: .76rem; font-weight: 700; min-width: 4px; }
#mathekingdom-lehrer .stapelbalken .teil:first-child { border-radius: 4px 0 0 4px; }
#mathekingdom-lehrer .stapelbalken .teil:last-child { border-radius: 0 4px 4px 0; }

#mathekingdom-lehrer .stapelzahl { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--nacht); }

/* Einfache Balkenliste */
.balkenliste { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.balkenliste li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(80px, 2fr) auto; gap: 10px; align-items: center; font-size: .88rem; }
.balkenliste .bspur { height: 14px; background: #ece8dd; border-radius: 4px; overflow: hidden; }
.balkenliste .bspur i { display: block; height: 100%; background: #4f6fa8; border-radius: 0 4px 4px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.balkenliste .bwert { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.balkenliste .bwert small { font-weight: 400; color: #5d6679; }

#mathekingdom-lehrer .vierspaltig { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
#mathekingdom-lehrer .gruppenliste h3 { display: flex; align-items: center; gap: 8px; margin: 4px 0 6px; }
#mathekingdom-lehrer .gruppenliste ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }

/* Weg eines Sch\xFClers \xFCber die Lernziele */
.weg { display: flex; flex-wrap: wrap; gap: 14px 20px; }
.weggruppe small { display: block; font-size: .76rem; color: #5d6679; margin-bottom: 4px; }
.wegzellen { display: flex; gap: 3px; }
.wegzellen .zelle { width: 30px; height: 30px; border-radius: 5px; border: 0; padding: 0; display: inline-grid; place-items: center; font-style: normal; font-size: .85rem; }
#mathekingdom-lehrer .wegzellen button.zelle:hover { outline: 2px solid var(--nacht); outline-offset: 1px; }

  #mathekingdom-lehrer .stapelzeile { grid-template-columns: 1fr 3em; }
  #mathekingdom-lehrer .stapelbalken { grid-column: 1 / -1; grid-row: 2; }
}
#mathekingdom-lehrer button.zelle.siegel, #mathekingdom-lehrer button.zelle.begonnen { color: #fff; }
#mathekingdom-lehrer button.zelle.wackelig, #mathekingdom-lehrer button.zelle.aufzufrischen { color: #1f2533; }
#mathekingdom-lehrer button.zelle.offen { color: #6b7280; }

/* Tafelbild f\xFCr den Beamer (ADR 0014) */
#mathekingdom-lehrer .tafelbild { position: fixed; inset: 0; z-index: 20; background: #fbfaf6; color: #1f2533; padding: 3vh 5vw; overflow-y: auto; font-size: clamp(18px, 2.2vw, 30px); }
#mathekingdom-lehrer .tafelbild:focus { outline: none; }
#mathekingdom-lehrer .tafel-kopf { display: flex; align-items: center; gap: 12px; font-size: .7em; color: #5a6275; border-bottom: 1px solid var(--rand); padding-bottom: 8px; }
#mathekingdom-lehrer .tafel-aufgabe { font-size: 1.3em; line-height: 1.4; margin: 1em 0 .5em; white-space: pre-line; }
#mathekingdom-lehrer .tafel-optionen { margin: 0 0 1em; }

#mathekingdom-lehrer .tafel-loesung { font-size: 1.1em; background: #e6f3ec; border-left: 6px solid #2a7a50; padding: .4em .7em; }
