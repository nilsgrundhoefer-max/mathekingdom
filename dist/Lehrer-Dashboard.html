ebertrag-vergessen":{"beschreibung":"Addiert stellenweise, berücksichtigt den Übertrag aber nicht.","hinweis":"Schau dir deine Überträge noch einmal an. Hast du sie in der nächsten Stelle mitgerechnet?"},"add-subtrahiert":{"beschreibung":"Subtrahiert, statt zu addieren.","hinweis":"Schau auf das Rechenzeichen: Hier wird addiert."},"kopf-stellenwert":{"beschreibung":"Verrechnet sich beim Kopfrechnen um eine Stelle.","hinweis":"Prüfe die Stellen: Rechnest du mit Zehnern, Hundertern oder Tausendern?"},"ergaenzen-zu-viel":{"beschreibung":"Ergänzt jede Stelle einzeln bis zur vollen Zehn und erhält dadurch zu viel.","hinweis":"Nur die Einer werden bis 10 ergänzt. Alle anderen Stellen ergänzt du bis 9."},"geschickt-nicht-ausgeglichen":{"beschreibung":"Rechnet mit der glatten Nachbarzahl, gleicht danach aber nicht aus.","hinweis":"Du hast mit einer glatten Zahl gerechnet. Jetzt musst du noch ausgleichen."},"geschickt-falsch-ausgeglichen":{"beschreibung":"Gleicht nach dem Rechnen mit der glatten Nachbarzahl in die falsche Richtung aus.","hinweis":"Überlege: Hast du zu viel oder zu wenig gerechnet? In welche Richtung musst du ausgleichen?"},"klammer-ignoriert":{"beschreibung":"Rechnet von links nach rechts und beachtet die Klammer nicht.","hinweis":"Was in der Klammer steht, wird zuerst berechnet."},"klammer-falsch-gesetzt":{"beschreibung":"Setzt die Klammer an die falsche Stelle.","hinweis":"Lies genau: Was soll zuerst zusammengefasst werden? Das gehört in die Klammer."},"gesetz-auf-subtraktion":{"beschreibung":"Überträgt das Vertauschungs- oder Verbindungsgesetz auf die Subtraktion.","hinweis":"Die beiden Gesetze gelten nur für die Addition. Rechne beide Seiten aus."}},"kapitel":[{"id":"5.1","titel":"Daten und Diagramme","unterkapitel":[{"id":"5.1.1","titel":"Strichlisten und Häufigkeitstabellen","extra":false,"lernziele":[{"id":"5.1.1-L1","text":"Ich kann mit Strichlisten und Häufigkeitstabellen umgehen."}]},{"id":"5.1.2","titel":"Diagramme lesen","extra":false,"lernziele":[{"id":"5.1.2-L1","text":"Ich kann Informationen aus Diagrammen ablesen."}]},{"id":"5.1.3","titel":"Diagramme zeichnen","extra":false,"lernziele":[{"id":"5.1.3-L1","text":"Ich kann Diagramme anfertigen."}]},{"id":"5.1.4","titel":"Daten vergleichen","extra":false,"lernziele":[{"id":"5.1.4-L1","text":"Ich kann Daten miteinander vergleichen."}]},{"id":"5.1.5","titel":"Daten erheben","extra":false,"lernziele":[{"id":"5.1.5-L1","text":"Ich kann Daten erheben."}]}]},{"id":"5.2","titel":"Natürliche Zahlen","unterkapitel":[{"id":"5.2.1","titel":"Natürliche Zahlen","extra":false,"lernziele":[{"id":"5.2.1-L1","text":"Ich kann mit natürlichen Zahlen umgehen."}]},{"id":"5.2.2","titel":"Große Zahlen","extra":false,"lernziele":[{"id":"5.2.2-L1","text":"Ich kann mit großen Zahlen umgehen."}]},{"id":"5.2.3","titel":"Runden","extra":false,"lernziele":[{"id":"5.2.3-L1","text":"Ich kann Zahlen runden."}]},{"id":"5.2.4","titel":"Schätzen","extra":false,"lernziele":[{"id":"5.2.4-L1","text":"Ich kann eine Anzahl auf Bildern schätzen."}]},{"id":"5.2.5","titel":"Zweiersystem","extra":false,"lernziele":[{"id":"5.2.5-L1","text":"Ich kann Zahlen im Zweiersystem verwenden."}]},{"id":"5.2.X1","titel":"Römische Zahlzeichen","extra":true,"lernziele":[{"id":"5.2.X1-L1","text":"Ich kann römische Zahlzeichen verwenden."}]}]},{"id":"5.3","titel":"Addieren und Subtrahieren","unterkapitel":[{"id":"5.3.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.3.1-K1","text":"Ich kann im Kopf addieren."},{"id":"5.3.1-K2","text":"Ich kann im Kopf subtrahieren."},{"id":"5.3.1-K3","text":"Ich kann beim Kopfrechnen geschickt vorgehen."}],"merkzettel":{"regeln":["Rechne in Schritten: erst bis zum nächsten Zehner oder Hunderter, dann den Rest.","Liegt eine Zahl knapp neben einem Hunderter, rechne mit dem Hunderter und gleiche danach aus.","Suche Zahlen, die zusammen einen glatten Zehner oder Hunderter ergeben."],"beispiel":"67 + 48 = 67 + 3 + 45 = 115 und 83 − 27 = 83 − 3 − 24 = 56. Geschickt: 298 + 137 = 300 + 137 − 2 = 435.","heft":"Schreibe bei schwierigen Aufgaben deine Zwischenschritte auf."}},{"id":"5.3.2","titel":"Addieren","extra":false,"lernziele":[{"id":"5.3.2-A1","text":"Ich kann die Fachbegriffe Summand und Summe verwenden."},{"id":"5.3.2-A2","text":"Ich kann schriftlich addieren, auch mit Übertrag."},{"id":"5.3.2-A3","text":"Ich kann mehrere Zahlen schriftlich addieren."},{"id":"5.3.2-A4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen."},{"id":"5.3.2-A5","text":"Ich kann Sachaufgaben zur Addition lösen, auch mit Tabellen und Diagrammen."}],"merkzettel":{"regeln":["Summand + Summand = Summe. Bei 34 + 12 = 46 sind 34 und 12 die Summanden, 46 ist der Wert der Summe.","Schriftlich addieren: Schreibe stellengerecht untereinander, Einer unter Einer. Addiere von rechts nach links.","Ist das Ergebnis einer Spalte 10 oder größer, schreibst du den Übertrag klein in die nächste Spalte und rechnest ihn dort mit.","Überschlage vorher mit gerundeten Zahlen. Prüfe danach mit der Probe: Summe − Summand = anderer Summand."],"beispiel":"467 + 285: Einer 7 + 5 = 12, schreibe 2, Übertrag 1. Zehner 6 + 8 + 1 = 15, schreibe 5, Übertrag 1. Hunderter 4 + 2 + 1 = 7. Ergebnis 752.","heft":"Rechne schriftliche Aufgaben im Heft, ein Kästchen pro Ziffer."}},{"id":"5.3.3","titel":"Subtrahieren","extra":false,"lernziele":[{"id":"5.3.3-S1","text":"Ich kann die Fachbegriffe Minuend, Subtrahend und Differenz verwenden."},{"id":"5.3.3-S2","text":"Ich kann schriftlich subtrahieren, auch mit Übertrag."},{"id":"5.3.3-S3","text":"Ich kann mehrere Zahlen schriftlich subtrahieren."},{"id":"5.3.3-S4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen."},{"id":"5.3.3-S5","text":"Ich kann Sachaufgaben zur Subtraktion lösen."}],"merkzettel":{"regeln":["Minuend − Subtrahend = Differenz. Bei 46 − 12 = 34 ist 46 der Minuend, 12 der Subtrahend, 34 der Wert der Differenz.","Schriftlich subtrahieren: Schreibe stellengerecht untereinander und beginne bei den Einern.","Ist die obere Ziffer zu klein, rechnest du mit 10 mehr und merkst dir den Übertrag 1 für die nächste Spalte.","Mehrere Subtrahenden kannst du zuerst addieren und ihre Summe dann abziehen.","Probe: Differenz + Subtrahend = Minuend."],"beispiel":"532 − 218: Einer 12 − 8 = 4, Übertrag 1. Zehner 3 − 1 − 1 = 1. Hunderter 5 − 2 = 3. Ergebnis 314. Probe: 314 + 218 = 532.","heft":"Rechne schriftliche Aufgaben im Heft und schreibe den Übertrag immer mit."}},{"id":"5.3.4","titel":"Klammern","extra":false,"lernziele":[{"id":"5.3.4-B1","text":"Ich kann Rechenausdrücke mit Klammern berechnen."},{"id":"5.3.4-B2","text":"Ich kann zu einem Text den passenden Rechenausdruck mit Klammern finden."}],"merkzettel":{"regeln":["Was in der Klammer steht, wird zuerst berechnet.","Ohne Klammern rechnest du bei Plus und Minus von links nach rechts.","Eine Klammer hinter einem Minus fasst zusammen, was insgesamt abgezogen wird."],"beispiel":"80 − (25 + 15) = 80 − 40 = 40. Ohne Klammer kommt etwas anderes heraus: 80 − 25 + 15 = 55 + 15 = 70.","heft":"Schreibe jeden Rechenschritt in eine neue Zeile und unterstreiche, was du als Nächstes rechnest."}},{"id":"5.3.5","titel":"Rechengesetze","extra":false,"lernziele":[{"id":"5.3.5-R1","text":"Ich kann das Vertauschungsgesetz und das Verbindungsgesetz erkennen."},{"id":"5.3.5-R2","text":"Ich kann mit den Rechengesetzen vorteilhaft rechnen."}],"merkzettel":{"regeln":["Vertauschungsgesetz: Beim Addieren darfst du die Summanden vertauschen. 17 + 48 = 48 + 17.","Verbindungsgesetz: Beim Addieren darfst du Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52).","Beide Gesetze gelten nicht beim Subtrahieren: 9 − 4 ist nicht dasselbe wie 4 − 9.","Nutze die Gesetze, um zuerst die Zahlen zu addieren, die gut zusammenpassen."],"beispiel":"37 + 48 + 63 = 37 + 63 + 48 = 100 + 48 = 148.","heft":"Schreibe auf, wie du umgestellt hast, bevor du rechnest."}}]},{"id":"5.4","titel":"Multiplizieren und Dividieren","unterkapitel":[{"id":"5.4.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.4.1-L1","text":"Ich kann im Kopf multiplizieren und dividieren und dabei geschickt vorgehen."}]},{"id":"5.4.2","titel":"Multiplizieren","extra":false,"lernziele":[{"id":"5.4.2-L1","text":"Ich kann Multiplikationsaufgaben berechnen."}]},{"id":"5.4.3","titel":"Rechenvorteile","extra":false,"lernziele":[{"id":"5.4.3-L1","text":"Ich kann Rechengesetze anwenden und somit Rechenvorteile nutzen."}]},{"id":"5.4.4","titel":"Potenzen","extra":false,"lernziele":[{"id":"5.4.4-L1","text":"Ich kann Potenzen berechnen."}]},{"id":"5.4.5","titel":"Dividieren","extra":false,"lernziele":[{"id":"5.4.5-D1","text":"Ich kann die Fachbegriffe Dividend, Divisor und Quotient verwenden."},{"id":"5.4.5-D2","text":"Ich kann schriftlich durch einstellige Zahlen dividieren."},{"id":"5.4.5-D3","text":"Ich kann schriftlich durch zweistellige Zahlen dividieren."},{"id":"5.4.5-D4","text":"Ich kann Divisionen mit Rest berechnen und den Rest deuten."},{"id":"5.4.5-D5","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen."},{"id":"5.4.5-D6","text":"Ich kann Sachaufgaben zur Division lösen."}],"merkzettel":{"regeln":["Dividend : Divisor = Quotient. Bei 48 : 6 = 8 ist 48 der Dividend, 6 der Divisor, 8 der Wert des Quotienten.","Schriftlich dividieren: Beginne links. Teile, multipliziere zurück, ziehe ab und hole die nächste Ziffer herunter.","Bleibt am Ende etwas übrig, ist das der Rest. Der Rest ist immer kleiner als der Divisor.","Probe: Quotient · Divisor, dazu der Rest, ergibt den Dividenden.","Durch 0 kann man nicht dividieren."],"beispiel":"952 : 4: 9 : 4 = 2 Rest 1. Dann 15 : 4 = 3 Rest 3. Dann 32 : 4 = 8. Ergebnis 238. Probe: 238 · 4 = 952.","heft":"Rechne schriftliche Divisionen im Heft und schreibe die Probe dazu."},"wortspeicher":[{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen : vor. 12 : 3 heißt: 12 geteilt durch 3."},{"wort":"teilen","ab":"F","erklaerung":"Gerecht verteilen oder gleich große Gruppen bilden."},{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen · vor. Mal ist das Gegenteil von geteilt."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"Probe","ab":"F","erklaerung":"Du prüfst dein Ergebnis mit der Mal-Aufgabe. Zu 12 : 3 = 4 gehört 4 · 3 = 12."},{"wort":"Rest","ab":"F","erklaerung":"Was beim Teilen übrig bleibt. 14 : 4 = 3 Rest 2."},{"wort":"Quotient","ab":"G","erklaerung":"Das Ergebnis einer Geteilt-Aufgabe. Bei 12 : 3 = 4 ist 4 der Quotient."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"schriftlich dividieren","ab":"G","erklaerung":"Schritt für Schritt teilen: teilen, malnehmen, abziehen, nächste Ziffer herunterholen."},{"wort":"Dividend","ab":"M","erklaerung":"Die Zahl, die geteilt wird. Bei 12 : 3 ist 12 der Dividend."},{"wort":"Divisor","ab":"M","erklaerung":"Die Zahl, durch die geteilt wird. Bei 12 : 3 ist 3 der Divisor."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Division gehört die Multiplikation."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel (12 + 8) : 4."},{"wort":"Wert","ab":"E","erklaerung":"Die Zahl, die herauskommt, wenn man einen Term ausrechnet."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 7 teilbar, wenn beim Dividieren durch 7 kein Rest bleibt."},{"wort":"Vielfaches","ab":"E","erklaerung":"Die Vielfachen von 7 sind 7, 14, 21, 28 und so weiter."}]},{"id":"5.4.6","titel":"Punkt vor Strich, Klammern zuerst","extra":false,"lernziele":[{"id":"5.4.6-L1","text":"Ich kann die Rechenregeln „Punkt vor Strich“ und „Klammern zuerst“ anwenden."}]},{"id":"5.4.7","titel":"Verteilungsgesetz","extra":false,"lernziele":[{"id":"5.4.7-L1","text":"Ich kann das Verteilungsgesetz anwenden, indem ich ausklammere und ausmultipliziere."}]},{"id":"5.4.X1","titel":"Zahlenmuster","extra":true,"lernziele":[{"id":"5.4.X1-L1", ie groß kann ein Rest bei Division durch 15 höchstens sein?"}},{"id":"5.4.5-D3-E-06","lernziel":"5.4.5-D3","niveau":"E","afb":3,"format":"auswahl","text":"Eine Zahl ist ohne Rest durch 18 teilbar. Welche Aussage gilt dann immer?","mehrfach":false,"optionen":[{"text":"Sie ist größer als 100.","richtig":false},{"text":"Sie ist auch durch 2 und durch 9 teilbar.","richtig":true},{"text":"Sie ist auch durch 12 teilbar.","richtig":false,"fehlvorstellung":"teilbar-summe"},{"text":"Sie ist auch durch 36 teilbar.","richtig":false,"fehlvorstellung":"teilbar-summe"}],"hilfen":{"tipp":"Prüfe jede Aussage an der Zahl 18 selbst."}},{"id":"5.4.5-D4-F-01","lernziel":"5.4.5-D4","niveau":"F","afb":1,"format":"zahl","text":"Du hast 5 Plättchen.\nDu legst immer 2 zusammen.\nWie viele Plättchen bleiben übrig?","loesung":1,"einheit":"Plättchen","typischeFehler":[{"wert":2,"fehlvorstellung":"div-rest-vergessen"},{"wert":0,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Nimm 5 Wendeplättchen. Lege 2er-Häufchen. Was nicht mehr für ein Häufchen reicht, bleibt übrig.","beispiel":"14 Plättchen, immer 4 zusammen: 3 Häufchen sind 12 Plättchen. 2 bleiben übrig.","loesungsschritt":"2 Häufchen sind 2 · 2 = 4 Plättchen. Wie viele fehlen bis 5?"}},{"id":"5.4.5-D4-F-02","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"zahl","text":"Welche Zahl fehlt?\n▢ : 3 = 6 Rest 2","loesung":20,"typischeFehler":[{"wert":18,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Rechne rückwärts: erst mal, dann den Rest dazu.","beispiel":"▢ : 3 = 4 Rest 1. Rechne 4 · 3 = 12. Dann 12 + 1 = 13.","loesungsschritt":"Rechne 6 · 3 = 18. Zähle dann den Rest 2 dazu."}},{"id":"5.4.5-D4-F-03","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"zahl","text":"13 Kinder bilden 2er-Gruppen.\nWie viele Kinder bleiben übrig?","loesung":1,"einheit":"Kinder","typischeFehler":[{"wert":6,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Zeichne 13 Kreise auf dein Schmierblatt. Kreise immer 2 ein.","beispiel":"13 Kinder, 4er-Gruppen: 3 Gruppen sind 12 Kinder. 1 Kind bleibt übrig.","loesungsschritt":"6 Gruppen sind 12 Kinder. Wie viele Kinder sind noch nicht in einer Gruppe?"}},{"id":"5.4.5-D4-F-04","lernziel":"5.4.5-D4","niveau":"F","afb":1,"format":"luecken","text":"5 : 2 = {{q}} Rest {{r}}","hilfen":{"tipp":"Suche in der 2er-Reihe die größte Zahl, die noch in die 5 passt.","beispiel":"17 : 5: 3 · 5 = 15 passt. Bis 17 fehlen 2. Also 3 Rest 2.","loesungsschritt":"2 · 2 = 4. Das passt in die 5. Wie viel bleibt übrig?"},"luecken":{"q":{"loesung":2,"typischeFehler":[{"wert":3,"fehlvorstellung":"div-einmaleins"}]},"r":{"loesung":1,"typischeFehler":[{"wert":3,"fehlvorstellung":"div-rest-zu-gross"}]}}},{"id":"5.4.5-D4-F-05","lernziel":"5.4.5-D4","niveau":"F","afb":2,"format":"auswahl","text":"Bei welcher Aufgabe bleibt ein Rest?","mehrfach":false,"optionen":[{"text":"13 : 4","richtig":true},{"text":"20 : 4","richtig":false},{"text":"16 : 4","richtig":false},{"text":"12 : 4","richtig":false}],"hilfen":{"tipp":"Sage die 4er-Reihe auf. Welche Zahl kommt in der Reihe nicht vor?","beispiel":"Die 3er-Reihe: 3, 6, 9, 12. Die 10 kommt nicht vor. Bei 10 : 3 bleibt ein Rest.","loesungsschritt":"Die 4er-Reihe: 4, 8, 12, 16, 20, 24, 28, 32."}},{"id":"5.4.5-D4-F-06","lernziel":"5.4.5-D4","niveau":"F","afb":3,"format":"auswahl","text":"Paul rechnet: 11 : 2 = 4 Rest 3.\nWas stimmt?","mehrfach":false,"optionen":[{"text":"Falsch.\nBeim Teilen gibt es nie einen Rest.","richtig":false,"fehlvorstellung":"div-rest-vergessen"},{"text":"Richtig.\n4 · 2 + 3 = 11.","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"Falsch.\nRichtig ist 6 Rest 1.","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"Falsch.\nDer Rest 3 ist zu groß.\nDie 2 passt noch 1-mal hinein.\nRichtig ist 5 Rest 1.","richtig":true}],"hilfen":{"tipp":"Der Rest muss kleiner sein als die Zahl, durch die du teilst.","beispiel":"14 : 4 = 2 Rest 6? Der Rest 6 ist größer als 4. Es passt noch ein Häufchen. Richtig ist 3 Rest 2.","loesungsschritt":"Paul hat 3 Plättchen übrig. Kann er daraus noch ein 2er-Häufchen legen?"}},{"id":"5.4.5-D4-G-01","lernziel":"5.4.5-D4","niveau":"G","afb":1,"format":"luecken","text":"55 : 7 = {{q}} Rest {{r}}","hilfen":{"tipp":"Suche in der 7er-Reihe die größte Zahl, die noch in die 55 passt.","beispiel":"47 : 6: 7 · 6 = 42 passt. Bis 47 fehlen 5. Also 7 Rest 5.","loesungsschritt":"7 · 7 = 49. Rechne 55 − 49."},"luecken":{"q":{"loesung":7,"typischeFehler":[{"wert":8,"fehlvorstellung":"div-einmaleins"}]},"r":{"loesung":6,"typischeFehler":[{"wert":13,"fehlvorstellung":"div-rest-zu-gross"}]}}},{"id":"5.4.5-D4-G-02","lernziel":"5.4.5-D4","niveau":"G","afb":2,"format":"zahl","text":"Welche Zahl fehlt?\n▢ : 9 = 6 Rest 4","loesung":58,"typischeFehler":[{"wert":54,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Mache die Probe: Ergebnis mal Teiler, dann den Rest dazu.","beispiel":"▢ : 6 = 7 Rest 5. Rechne 7 · 6 = 42. Dann 42 + 5 = 47.","loesungsschritt":"Rechne 6 · 9 = 54. Zähle den Rest 4 dazu."}},{"id":"5.4.5-D4-G-03","lernziel":"5.4.5-D4","niveau":"G","afb":2,"format":"zahl","text":"Es gibt 23 Eier.\nIn 1 Karton passen 3 Eier.\nWie viele Kartons werden ganz voll?","loesung":7,"typischeFehler":[{"wert":8,"fehlvorstellung":"div-rest-nicht-gedeutet"},{"wert":2,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Teile 23 durch 3. Nur volle Kartons zählen.","beispiel":"50 Eier, 6 in einem Karton: 50 : 6 = 8 Rest 2. 8 Kartons werden voll. 2 Eier bleiben übrig.","loesungsschritt":"Rechne 23 : 3 = 7 Rest 2. Der Rest füllt nichts ganz."}},{"id":"5.4.5-D4-G-04","lernziel":"5.4.5-D4","niveau":"G","afb":1,"format":"luecken","text":"33 : 4 = {{q}} Rest {{r}}","hilfen":{"tipp":"Suche in der 4er-Reihe die größte Zahl, die noch in die 33 passt.","beispiel":"47 : 6: 7 · 6 = 42 passt. Bis 47 fehlen 5. Also 7 Rest 5.","loesungsschritt":"8 · 4 = 32. Rechne 33 − 32."},"luecken":{"q":{"loesung":8,"typischeFehler":[{"wert":9,"fehlvorstellung":"div-einmaleins"}]},"r":{"loesung":1,"typischeFehler":[{"wert":5,"fehlvorstellung":"div-rest-zu-gross"}]}}},{"id":"5.4.5-D4-G-05","lernziel":"5.4.5-D4","niveau":"G","afb":2,"format":"auswahl","text":"Du teilst durch 4.\nWelcher Rest ist nicht möglich?","mehrfach":false,"optionen":[{"text":"2","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"3","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"1","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"4","richtig":true}],"hilfen":{"tipp":"Der Rest ist immer kleiner als die Zahl, durch die du teilst.","beispiel":"Bleiben beim Teilen durch 4 noch 4 übrig, passt die 4 noch einmal hinein. Dann ist der Rest 0.","loesungsschritt":"Kann beim Teilen durch 4 genau 4 übrig bleiben?"}},{"id":"5.4.5-D4-G-06","lernziel":"5.4.5-D4","niveau":"G","afb":3,"format":"auswahl","text":"Nina rechnet: 14 : 3 = 3 Rest 5.\nWas stimmt?","mehrfach":false,"optionen":[{"text":"Richtig.\nDer Rest darf beliebig groß sein.","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"Richtig.\nDie Probe stimmt: 3 · 3 + 5 = 14.","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"Falsch.\nRichtig ist 5 Rest 2.","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"Falsch.\nDer Rest 5 ist größer als 3.\nRichtig ist 4 Rest 2.","richtig":true}],"hilfen":{"tipp":"Vergleiche den Rest mit der Zahl, durch die geteilt wird.","beispiel":"58 : 7 = 7 Rest 9? Der Rest 9 ist größer als 7. Richtig ist 8 Rest 2.","loesungsschritt":"Der Rest ist 5. Passt die 3 noch einmal hinein?"}},{"id":"5.4.5-D4-M-01","lernziel":"5.4.5-D4","niveau":"M","afb":1,"format":"luecken","text":"113 : 8 = {{q}} Rest {{r}}","hilfen":{"tipp":"Der Rest ist das, was nach dem letzten Abziehen übrig bleibt. Er ist kleiner als der Divisor.","loesungsschritt":"Beginne links. Wie oft passt die 8 in die 11? 1-mal, denn 1 · 8 = 8. Rechne 11 − 8 = 3. Hole die nächste Ziffer herunter."},"luecken":{"q":{"loesung":14,"typischeFehler":[{"wert":15,"fehlvorstellung":"div-rest-nicht-gedeutet"}]},"r":{"loesung":1,"typischeFehler":[{"wert":0,"fehlvorstellung":"div-rest-vergessen"}]}}},{"id":"5.4.5-D4-M-02","lernziel":"5.4.5-D4","niveau":"M","afb":2,"format":"sachaufgabe","text":"877 Muffins sollen in Schachteln verpackt werden. In jede Schachtel passen genau 19 Muffins.","teile":[{"format":"zahl","text":"Wie viele Schachteln werden vollständig gefüllt?","loesung":46,"einheit":"Schachteln","typischeFehler":[{"wert":47,"fehlvorstellung":"div-rest-nicht-gedeutet"}]},{"format":"zahl","text":"Wie viele Muffins bleiben übrig?","loesung":3,"einheit":"Muffins","typischeFehler":[{"wert":0,"fehlvorstellung":"div-rest-vergessen"}]}],"hilfen":{"tipp":"Dividiere mit Rest. Der Quotient und der Rest beantworten je eine Frage.","loesungsschritt":"Rechne 877 : 19. Der Quotient ist 46."}},{"id":"5.4.5-D4-M-03","lernziel":"5.4.5-D4","niveau":"M","afb":2,"format":"zahl","text":"281 Kinder fahren mit Kleinbussen ins Schullandheim. In jeden Kleinbus passen 13 Kinder. Wie viele Kleinbusse werden insgesamt gebraucht?","loesung":22,"einheit":"Kleinbusse","typischeFehler":[{"wert":21,"fehlvorstellung":"div-rest-nicht-gedeutet"},{"wert":8,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Rechne zuerst mit Rest. Überlege dann: Was geschieht mit dem Rest?","loesungsschritt":"281 : 13 = 21 Rest 8. Der Rest braucht auch noch Platz."}},{"id":"5.4.5-D4-M-04","lernziel":"5.4.5-D4","niveau":"M","afb":1,"format":"luecken","text":"582 : 12 = {{q}} Rest {{r}}","hilfen":{"tipp":"Der Rest ist das, was nach dem letzten Abziehen übrig bleibt. Er ist kleiner als der Divisor.","loesungsschritt":"Beginne links. Wie oft passt die 12 in die 58? 4-mal, denn 4 · 12 = 48. Rechne 58 − 48 = 10. Hole die nächste Ziffer herunter."},"luecken":{"q":{"loesung":48,"typischeFehler":[{"wert":49,"fehlvorstellung":"div-rest-nicht-gedeutet"}]},"r":{"loesung":6,"typischeFehler":[{"wert":0,"fehlvorstellung":"div-rest-vergessen"}]}}},{"id":"5.4.5-D4-M-05","lernziel":"5.4.5-D4","niveau":"M","afb":2,"format":"zahl","text":"Eine Eintrittskarte kostet 16 €. Die Klassenkasse enthält 646 €. Wie viele Karten kann die Klasse höchstens kaufen?","loesung":40,"einheit":"Karten","typischeFehler":[{"wert":41,"fehlvorstellung":"div-rest-nicht-gedeutet"},{"wert":6,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Rechne zuerst mit Rest. Überlege dann: Reicht der Rest für ein weiteres Stück?","loesungsschritt":"646 : 16 = 40 Rest 6. Der Rest reicht nicht für ein weiteres Stück."}},{"id":"5.4.5-D4-M-06","lernziel":"5.4.5-D4","niveau":"M","afb":3,"format":"auswahl","text":"232 Kinder fahren mit Bussen zum Wandertag. Ein Bus hat 40 Plätze. Lars rechnet 232 : 40 = 5 Rest 32 und bestellt 5 Busse. Beurteile seine Entscheidung.","mehrfach":false,"optionen":[{"text":"Falsch: Es werden 32 Busse gebraucht.","richtig":false,"fehlvorstellung":"div-rest-vergessen"},{"text":"Falsch: 32 Kinder hätten keinen Platz. Es werden 6 Busse gebraucht.","richtig":true},{"text":"Richtig: 5 Busse sind voll, das genügt.","richtig":false,"fehlvorstellung":"div-rest-nicht-gedeutet"},{"text":"Richtig: Bei Sachaufgaben lässt man den Rest weg.","richtig":false,"fehlvorstellung":"div-rest-nicht-gedeutet"}],"hilfen":{"tipp":"Was bedeutet der Rest in dieser Situation? Wer oder was ist das?","loesungsschritt":"Der Rest 32 steht für 32 Kinder, die in den 5 Bussen keinen Platz finden."}},{"id":"5.4.5-D4-E-01","lernziel":"5.4.5-D4","niveau":"E","afb":1,"format":"luecken","text":"5685 : 17 = {{q}} Rest {{r}}","hilfen":{"tipp":"Wie kannst du dein Ergebnis mit einer Probe sichern?"},"luecken":{"q":{"loesung":334,"typischeFehler":[]},"r":{"loesung":7,"typischeFehler":[{"wert":0,"fehlvorstellung":"div-rest-vergessen"}]}}},{"id":"5.4.5-D4-E-02","lernziel":"5.4.5-D4","niveau":"E","afb":2,"format":"zahl","text":"Bestimme die größte dreistellige Zahl, die bei Division durch 6 den Rest 4 lässt.","loesung":994,"typischeFehler":[{"wert":996,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Suche zuerst das größte dreistellige Vielfache von 6. Was musst du noch beachten?"}},{"id":"5.4.5-D4-E-03","lernziel":"5.4.5-D4","niveau":"E","afb":2,"format":"zahl","text":"Eine Zahl lässt bei Division durch 7 den Rest 4. Welchen Rest lässt das Dreifache dieser Zahl bei Division durch 7?","loesung":5,"typischeFehler":[{"wert":12,"fehlvorstellung":"div-rest-zu-gross"},{"wert":4,"fehlvorstellung":"teilbar-summe"}],"hilfen":{"tipp":"Schreibe die Zahl als „Vielfaches von 7 plus 4“. Was geschieht mit beiden Teilen?"}},{"id":"5.4.5-D4-E-04","lernziel":"5.4.5-D4","niveau":"E","afb":1,"format":"luecken","text":"6213 : 27 = {{q}} Rest {{r}}","hilfen":{"tipp":"Wie kannst du dein Ergebnis mit einer Probe sichern?"},"luecken":{"q":{"loesung":230,"typischeFehler":[]},"r":{"loesung":3,"typischeFehler":[{"wert":0,"fehlvorstellung":"div-rest-vergessen"}]}}},{"id":"5.4.5-D4-E-05","lernziel":"5.4.5-D4","niveau":"E","afb":2,"format":"zahl","text":"Wie viele natürliche Zahlen von 1 bis 80 lassen bei Division durch 8 den Rest 4?","loesung":10,"typischeFehler":[],"hilfen":{"tipp":"Die kleinste solche Zahl ist 4. In welchen Abständen folgen die nächsten?"}},{"id":"5.4.5-D4-E-06","lernziel":"5.4.5-D4","niveau":"E","afb":3,"format":"auswahl","text":"Eine Zahl lässt bei Division durch 6 den Rest 3. Jonas addiert 18 zu dieser Zahl. Welche Aussage über den neuen Rest bei Division durch 6 stimmt?","mehrfach":false,"optionen":[{"text":"Der Rest bleibt 3, weil 18 ein Vielfaches von 6 ist.","richtig":true},{"text":"Der Rest wird 0, weil 18 durch 6 teilbar ist.","richtig":false,"fehlvorstellung":"teilbar-summe"},{"text":"Der Rest wird 21.","richtig":false,"fehlvorstellung":"div-rest-zu-gross"},{"text":"Das hängt von der Ausgangszahl ab.","richtig":false,"fehlvorstellung":"teilbar-summe"}],"hilfen":{"tipp":"Stell dir 6er-Päckchen und 3 einzelne Teile vor. Was kommt durch die 18 hinzu?"}},{"id":"5.4.5-D5-F-01","lernziel":"5.4.5-D5","niveau":"F","afb":1,"format":"auswahl","text":"16 : 8 = 2\nWelche Mal-Aufgabe ist die Probe?","mehrfach":false,"optionen":[{"text":"16 · 8 = 2","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"2 · 8 = 16","richtig":true},{"text":"2 + 8 = 10","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"16 · 2 = 8","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Zu jeder Geteilt-Aufgabe gehört eine Mal-Aufgabe: Ergebnis mal zweite Zahl.","beispiel":"28 : 4 = 7. Die Probe ist 7 · 4 = 28.","loesungsschritt":"Die Probe beginnt mit dem Ergebnis 2. Rechne 2 · 8."}},{"id":"5.4.5-D5-F-02","lernziel":"5.4.5-D5","niveau":"F","afb":2,"format":"auswahl","text":"Die Probe ist 3 · 4 = 12.\nWelche Geteilt-Aufgabe wurde geprüft?","mehrfach":false,"optionen":[{"text":"3 : 4 = 12","richtig":false,"fehlvorstellung":"div-vertauscht"},{"text":"12 : 4 = 12","richtig":false},{"text":"12 : 4 = 3","richtig":true},{"text":"4 : 12 = 3","richtig":false,"fehlvorstellung":"div-vertauscht"}],"hilfen":{"tipp":"Bei der Geteilt-Aufgabe steht die größte Zahl vorn.","beispiel":"Probe 8 · 3 = 24. Geprüft wurde 24 : 3 = 8.","loesungsschritt":"Die größte Zahl ist 12. Sie wird geteilt."}},{"id":"5.4.5-D5-F-03","lernziel":"5.4.5-D5","niveau":"F","afb":2,"format":"auswahl","text":"Welche Rechnung ist richtig?\nPrüfe mit der Mal-Aufgabe.","mehrfach":false,"optionen":[{"text":"63 : 7 = 8","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"63 : 7 = 11","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"63 : 7 = 9","richtig":true},{"text":"63 : 7 = 10","richtig":false,"fehlvorstellung":"div-einmaleins"}],"hilfen":{"tipp":"Rechne zu jeder Antwort die Mal-Aufgabe: Ergebnis mal zweite Zahl.","beispiel":"42 : 6 = 7? Probe: 7 · 6 = 42. Das stimmt.","loesungsschritt":"Bei der richtigen Antwort ergibt Ergebnis mal 7 genau 63."}},{"id":"5.4.5-D5-F-04","lernziel":"5.4.5-D5","niveau":"F","afb":1,"format":"zahl","text":"Mache die Probe.\n28 : 4 = 7\n7 · 4 = ▢","loesung":28,"typischeFehler":[{"wert":11,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Zu jeder Geteilt-Aufgabe gehört eine Mal-Aufgabe: Ergebnis mal zweite Zahl.","beispiel":"28 : 4 = 7. Die Probe ist 7 · 4 = 28.","loesungsschritt":"Die Probe beginnt mit dem Ergebnis 7. Rechne 7 · 4."}},{"id":"5.4.5-D5-F-05","lernziel":"5.4.5-D5","niveau":"F","afb":2,"format":"auswahl","text":"12 : 4\nIst das Ergebnis größer oder kleiner als 10?\nÜberlege mit der Mal-Aufgabe.","mehrfach":false,"optionen":[{"text":"größer als 10","richtig":false},{"text":"genau 10","richtig":false},{"text":"kleiner als 10","richtig":true}],"hilfen":{"tipp":"Rechne 10 · 4. Vergleiche mit 12.","beispiel":"80 : 4: 10 · 4 = 40. 80 ist mehr als 40. Das Ergebnis ist größer als 10.","loesungsschritt":"10 · 4 = 40. Ist 12 mehr oder weniger?"}},{"id":"5.4.5-D5-F-06","lernziel":"5.4.5-D5","niveau":"F","afb":3,"format":"auswahl","text":"Lena rechnet: 24 : 6 = 3.\nSie macht die Probe: 3 · 6 = 18.\nWas zeigt die Probe?","mehrfach":false,"optionen":[{"text":"Die Probe ist falsch gerechnet.\n3 · 6 = 24.","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"18 ist nicht 24.\nDas Ergebnis 3 ist falsch.\nRichtig ist 4.","richtig":true},{"text":"Die Probe passt.\n3 ist richtig.","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"Mit einer Mal-Aufgabe kann man nicht prüfen.","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Bei der Probe muss wieder die erste Zahl herauskommen.","beispiel":"45 : 5 = 8? Probe: 8 · 5 = 40. Das ist nicht 45. Also stimmt 8 nicht.","loesungsschritt":"Vergleiche 18 mit 24. Sind die Zahlen gleich?"}},{"id":"5.4.5-D5-G-01","lernziel":"5.4.5-D5","niveau":"G","afb":1,"format":"zahl","text":"Mache die Probe.\n835 : 5 = 167\n167 · 5 = ▢","loesung":835,"typischeFehler":[{"wert":172,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Die Probe ist die Mal-Aufgabe: Ergebnis mal Teiler.","beispiel":"96 : 4 = 24. Probe: 24 · 4 = 96.","loesungsschritt":"Rechne 160 · 5 = 800. Rechne dann 7 · 5 dazu."}},{"id":"5.4.5-D5-G-02","lernziel":"5.4.5-D5","niveau":"G","afb":2,"format":"auswahl","text":"Welcher Überschlag passt zu 804 : 2?","mehrfach":false,"optionen":[{"text":"800 : 2 = 400","richtig":true},{"text":"80 : 2 = 40","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"800 : 10 = 80","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Runde nur die erste Zahl. Sie soll nahe bei der echten Zahl bleiben.","beispiel":"Zu 594 : 6 passt 600 : 6 = 100. Denn 594 liegt nahe bei 600.","loesungsschritt":"Welche runde Zahl liegt nahe bei 804 und lässt sich gut durch 2 teilen?"}},{"id":"5.4.5-D5-G-03","lernziel":"5.4.5-D5","niveau":"G","afb":2,"format":"auswahl","text":"316 : 2\nWelches Ergebnis stimmt?\nPrüfe mit der Mal-Aufgabe.","mehrfach":false,"optionen":[{"text":"158","richtig":true},{"text":"159","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"168","richtig":false,"fehlvorstellung":"div-einmaleins"},{"text":"148","richtig":false,"fehlvorstellung":"div-einmaleins"}],"hilfen":{"tipp":"Rechne zu jeder Antwort: Antwort mal Teiler.","beispiel":"252 : 7 = 36? Probe: 36 · 7 = 252. Das stimmt.","loesungsschritt":"Bei der richtigen Antwort ergibt Antwort mal 2 genau 316."}},{"id":"5.4.5-D5-G-04","lernziel":"5.4.5-D5","niveau":"G","afb":1,"format":"zahl","text":"Überschlage.\n460 : 5\nRechne mit 500 : 5.","loesung":100,"typischeFehler":[{"wert":92,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"wert":10,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Beim Überschlag rechnest du mit einer runden Zahl. Das geht im Kopf.","beispiel":"Überschlag zu 418 : 4: Rechne 400 : 4 = 100.","loesungsschritt":"5 Hunderter geteilt durch 5 sind 1 Hunderter."}},{"id":"5.4.5-D5-G-05","lernziel":"5.4.5-D5","niveau":"G","afb":2,"format":"auswahl","text":"Die Probe ist 123 · 8 = 984.\nWelche Geteilt-Aufgabe wurde geprüft?","mehrfach":false,"optionen":[{"text":"123 : 8 = 984","richtig":false,"fehlvorstellung":"div-vertauscht"},{"text":"8 : 123 = 984","richtig":false,"fehlvorstellung":"div-vertauscht"},{"text":"984 : 8 = 123","richtig":true},{"text":"984 : 123 = 984","richtig":false}],"hilfen":{"tipp":"Bei der Geteilt-Aufgabe steht die größte Zahl vorn.","beispiel":"Probe 23 · 6 = 138. Geprüft wurde 138 : 6 = 23.","loesungsschritt":"Die größte Zahl ist 984. Sie wird geteilt."}},{"id":"5.4.5-D5-G-06","lernziel":"5.4.5-D5","niveau":"G","afb":3,"format":"auswahl","text":"Tom rechnet: 318 : 3 = 16.\nSein Überschlag ist 300 : 3 = 100.\nWas zeigt der Überschlag?","mehrfach":false,"optionen":[{"text":"16 ist zu groß.","richtig":false},{"text":"Der Überschlag ist falsch.\n300 : 3 = 10.","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"16 passt zum Überschlag.","richtig":false,"fehlvorstellung":"div-null-vergessen"},{"text":"16 ist viel zu klein.\nDas Ergebnis muss nahe bei 100 liegen.\nRichtig ist 106.","richtig":true}],"hilfen":{"tipp":"Vergleiche das Ergebnis mit dem Überschlag. Die Zahlen müssen nahe beieinander liegen.","beispiel":"824 : 4 = 26? Der Überschlag ist 800 : 4 = 200. 26 ist viel kleiner als 200. Richtig ist 206.","loesungsschritt":"Liegt 16 nahe bei 100?"}},{"id":"5.4.5-D5-M-01","lernziel":"5.4.5-D5","niveau":"M","afb":1,"format":"zahl","text":"Überschlage: Runde den Dividenden auf Tausender und rechne dann. 14 053 : 7 ≈ ?","loesung":2000,"typischeFehler":[{"wert":200,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Runde so, dass du die Division im Kopf lösen kannst.","loesungsschritt":"Der Dividend wird zu 14 000."}},{"id":"5.4.5-D5-M-02","lernziel":"5.4.5-D5","niveau":"M","afb":2,"format":"auswahl","text":"Nur ein Ergebnis kann stimmen. Entscheide mit einem Überschlag: 2864 : 4","mehrfach":false,"optionen":[{"text":"716","richtig":true},{"text":"1716","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"7160","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"71","richtig":false,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Überschlage zuerst, wie groß der Quotient ungefähr sein muss.","loesungsschritt":"Überschlag: 2800 : 4 = 700."}},{"id":"5.4.5-D5-M-03","lernziel":"5.4.5-D5","niveau":"M","afb":2,"format":"zahl","text":"Bei einer Division durch 16 ist der Quotient 20 und der Rest 15. Bestimme mit der Probe den Dividenden.","loesung":335,"typischeFehler":[{"wert":320,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Probe bei einer Division mit Rest: Quotient · Divisor, dann den Rest addieren.","loesungsschritt":"Rechne 20 · 16 = 320."}},{"id":"5.4.5-D5-M-04","lernziel":"5.4.5-D5","niveau":"M","afb":1,"format":"auswahl","text":"Welche Rechnung ist die Probe zu 8820 : 21 = 420?","mehrfach":false,"optionen":[{"text":"420 : 21 = 8820","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"420 · 21 = 8820","richtig":true},{"text":"8820 · 21 = 420","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"8820 − 420 = 21","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Die Probe ist die Umkehraufgabe. Sie führt zurück zum Dividenden.","loesungsschritt":"Quotient · Divisor = Dividend."}},{"id":"5.4.5-D5-M-05","lernziel":"5.4.5-D5","niveau":"M","afb":2,"format":"auswahl","text":"Zwischen welchen Zahlen liegt 2847 : 39? Entscheide mit einem Überschlag.","mehrfach":false,"optionen":[{"text":"zwischen 70 und 80","richtig":true},{"text":"zwischen 90 und 100","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"zwischen 700 und 800","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"zwischen 7 und 8","richtig":false,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Multipliziere die Grenzen mit dem Divisor und vergleiche mit dem Dividenden.","loesungsschritt":"70 · 39 = 2730 und 80 · 39 = 3120."}},{"id":"5.4.5-D5-M-06","lernziel":"5.4.5-D5","niveau":"M","afb":3,"format":"auswahl","text":"Mona rechnet 10 972 : 26 = 422. Ihre Probe 422 · 26 = 10 972 stimmt. Ihr Überschlag 10 000 : 30 = 333 weicht aber deutlich ab. Was folgt daraus?","mehrfach":false,"optionen":[{"text":"Das Ergebnis 422 stimmt. Der Überschlag ist nur grob, weil stark gerundet wurde.","richtig":true},{"text":"Die Probe muss falsch sein.","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"Das Ergebnis ist falsch, weil der Überschlag 333 ergibt.","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"Man nimmt den Mittelwert aus Ergebnis und Überschlag.","richtig":false}],"hilfen":{"tipp":"Welche Prüfung ist genau, welche nur ungefähr?","loesungsschritt":"Die Probe rechnet genau zurück. Der Überschlag zeigt nur die Größenordnung."}},{"id":"5.4.5-D5-E-01","lernziel":"5.4.5-D5","niveau":"E","afb":1,"format":"zahl","text":"Überschlage sinnvoll: 70 256 : 71 ≈ ? Runde den Divisor auf Zehner und den Dividenden auf Tausender.","loesung":1000,"typischeFehler":[{"wert":10000,"fehlvorstellung":"div-stellenwert"},{"wert":100,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Auf welche glatten Zahlen kannst du runden, sodass die Division im Kopf aufgeht?"}},{"id":"5.4.5-D5-E-02","lernziel":"5.4.5-D5","niveau":"E","afb":2,"format":"auswahl","text":"Entscheide ohne schriftliche Rechnung: Welcher Quotient ist größer als 100?","mehrfach":false,"optionen":[{"text":"8362 : 91","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"7362 : 81","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"8362 : 81","richtig":true},{"text":"8019 : 81","richtig":false,"fehlvorstellung":"div-stellenwert"}],"hilfen":{"tipp":"Wie groß wäre der Dividend, wenn der Quotient genau 100 wäre?"}},{"id":"5.4.5-D5-E-03","lernziel":"5.4.5-D5","niveau":"E","afb":2,"format":"zahl","text":"Bei einer Division durch 42 ist der Quotient 263 und der Rest 36. Bestimme den Dividenden.","loesung":11082,"typischeFehler":[{"wert":11046,"fehlvorstellung":"div-rest-vergessen"}],"hilfen":{"tipp":"Wie lautet die Probe bei einer Division mit Rest?"}},{"id":"5.4.5-D5-E-04","lernziel":"5.4.5-D5","niveau":"E","afb":1,"format":"auswahl","text":"Welche Rechnung ist die Probe zu 6244 : 42 = 148 Rest 28?","mehrfach":false,"optionen":[{"text":"148 · 42 + 28 = 6244","richtig":true},{"text":"148 · 42 − 28 = 6244","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"148 · 28 + 42 = 6244","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"},{"text":"(148 + 28) · 42 = 6244","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Wo steckt der Rest: im Vielfachen des Divisors oder daneben?"}},{"id":"5.4.5-D5-E-05","lernziel":"5.4.5-D5","niveau":"E","afb":2,"format":"auswahl","text":"Der Überschlag zu einer Division lautet 20 000 : 40 = 500. Welche Aufgabe wurde überschlagen?","mehrfach":false,"optionen":[{"text":"2010 : 38","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"200 950 : 38","richtig":false,"fehlvorstellung":"div-stellenwert"},{"text":"20 095 : 38","richtig":true},{"text":"20 095 : 98","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Runde bei jeder Aufgabe Dividend und Divisor. Bei welcher entstehen genau diese glatten Zahlen?"}},{"id":"5.4.5-D5-E-06","lernziel":"5.4.5-D5","niveau":"E","afb":3,"format":"auswahl","text":"Paula rundet bei einem Überschlag zur Division sowohl den Dividenden als auch den Divisor auf. Welche Aussage über ihren Überschlag gilt?","mehrfach":false,"optionen":[{"text":"Er stimmt dann immer genau.","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"Er kann zu groß oder zu klein sein, weil die beiden Rundungen in entgegengesetzte Richtungen wirken.","richtig":true},{"text":"Er ist dann immer zu klein.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Er ist dann immer zu groß.","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Was bewirkt ein größerer Dividend, was ein größerer Divisor? Probiere 100 : 20, 120 : 20 und 100 : 25."}},{"id":"5.4.5-D6-F-01","lernziel":"5.4.5-D6","niveau":"F","afb":1,"format":"zahl","text":"Herr Keller legt 24 Kekse in Dosen.\nIn jede Dose kommen 4 Kekse.\nWie viele Dosen werden voll?","loesung":6,"einheit":"Dosen","typischeFehler":[{"wert":20,"fehlvorstellung":"div-falsche-rechenart"},{"wert":28,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Nimm 24 Wendeplättchen. Lege immer 4 Plättchen zusammen. Zähle die Häufchen.","beispiel":"24 Äpfel, immer 4 in eine Tüte: 24 : 4 = 6. Es werden 6 Tüten.","loesungsschritt":"Nutze die 4er-Reihe: 1 · 4 = 4, 2 · 4 = 8, … ▢ · 4 = 24."}},{"id":"5.4.5-D6-F-02","lernziel":"5.4.5-D6","niveau":"F","afb":2,"format":"auswahl","text":"6 Kekse.\nImmer 2 kommen in eine Dose.\nWie viele Dosen sind es?\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"6 : 2","richtig":true},{"text":"6 · 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"6 − 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"6 + 2","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Hier wird in gleiche Gruppen aufgeteilt. Dazu passt geteilt.","beispiel":"12 Kekse, immer 3 in eine Dose. Die Rechnung ist 12 : 3.","loesungsschritt":"Du legst immer 2 zusammen, bis alle 6 verteilt sind. Das ist Teilen."}},{"id":"5.4.5-D6-F-03","lernziel":"5.4.5-D6","niveau":"F","afb":2,"format":"auswahl","text":"Die Rechnung ist 10 : 2 = 5.\nWelche Geschichte passt?","mehrfach":false,"optionen":[{"text":"Zu 10 Keksen kommen 2 Kekse dazu.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"10 Kekse werden an 2 Kinder gerecht verteilt.","richtig":true},{"text":"Von 10 Keksen werden 2 gegessen.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"},{"text":"2 Kinder haben jedes 10 Kekse.","richtig":false,"fehlvorstellung":"div-falsche-rechenart"}],"hilfen":{"tipp":"Geteilt bedeutet: gerecht verteilen.","beispiel":"10 : 2 = 5 passt zu: 10 Äpfel werden an 2 Kinder verteilt.","loesungsschritt":"Suche die Geschichte, in der etwas gerecht verteilt wird."}},{"id":"5.4.5-D6-F-04","lernziel":"5.4.5- <script>(()=>{var Ze=`#mathekingdom-lehrer, #mk-druck {
  --nacht: #1d2b4f; --gold: #d4a419; --papier: #f4f1ea; --karte: #ffffff; --tinte: #1f2533; --grau: #5d6679;
  --rand: #d9d4c7; --gut: #1a7f4b; --gut-hell: #e3f4ea; --schlecht: #b3372f; --schlecht-hell: #fbe9e7; --hell: #fff8e1;
  font: 15.5px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--tinte);
}
body { margin: 0; background: #f4f1ea; }
#mathekingdom-lehrer { min-height: 100vh; background: var(--papier); }
#mathekingdom-lehrer *, #mk-druck * { box-sizing: border-box; }
#mathekingdom-lehrer main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
#mathekingdom-lehrer h1, #mk-druck h1 { font-size: 1.5rem; margin: 0 0 6px; color: var(--nacht); }
#mathekingdom-lehrer h2, #mk-druck h2 { font-size: 1.1rem; margin: 0 0 10px; color: var(--nacht); }
#mathekingdom-lehrer h3, #mk-druck h3 { font-size: .98rem; margin: 18px 0 8px; color: var(--nacht); }
#mathekingdom-lehrer p, #mk-druck p { margin: 0 0 10px; }
#mathekingdom-lehrer .klein, #mk-druck .klein { font-size: .86rem; color: var(--grau); }
#mathekingdom-lehrer .fehlertext { color: var(--schlecht); font-weight: 600; }

#mathekingdom-lehrer button, #mathekingdom-lehrer input, #mathekingdom-lehrer select, #mathekingdom-lehrer textarea { font: inherit; color: inherit; }
#mathekingdom-lehrer button { cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 7px 14px; white-space: nowrap; }
#mathekingdom-lehrer :is(button, input, select, textarea):focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#mathekingdom-lehrer .haupt { background: var(--nacht); color: #fff; font-weight: 600; }
#mathekingdom-lehrer .haupt:hover { background: #2a3d6e; }
#mathekingdom-lehrer .schlicht { background: #fff; border-color: #b9bfcc; color: var(--nacht); }
#mathekingdom-lehrer .schlicht:hover { background: #ece8dd; }
#mathekingdom-lehrer .schlicht.hell { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
#mathekingdom-lehrer .link { background: none; border: 0; padding: 0; color: var(--nacht); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
#mathekingdom-lehrer input[type=text], #mathekingdom-lehrer select, #mathekingdom-lehrer textarea { border: 1.5px solid #b9bfcc; border-radius: 8px; padding: 6px 10px; background: #fff; }
#mathekingdom-lehrer textarea { width: 100%; max-width: 520px; display: block; margin-bottom: 10px; }

#mathekingdom-lehrer .kopf { background: var(--nacht); color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 18px; border-bottom: 4px solid var(--gold); flex-wrap: wrap; }
#mathekingdom-lehrer .kopf strong { font-size: 1.1rem; }
#mathekingdom-lehrer .kopf > span { color: #c9d1e8; }
#mathekingdom-lehrer .kopf .demo { color: #ffe08a; font-weight: 600; }
#mathekingdom-lehrer .kopf button { margin-left: auto; }

#mathekingdom-lehrer .meldung { display: flex; gap: 14px; align-items: center; padding: 10px 16px; border-radius: 10px; margin: 0 0 14px; border: 1px solid; }
#mathekingdom-lehrer .meldung ul { margin: 0; padding-left: 18px; flex: 1; }
#mathekingdom-lehrer .meldung.warnung { background: var(--hell); border-color: #ecd58a; }
#mathekingdom-lehrer .meldung.fehler { background: var(--schlecht-hell); border-color: #e7b3ad; color: var(--schlecht); font-weight: 600; border-radius: 0; margin: 0; justify-content: center; }

#mathekingdom-lehrer .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(29,43,79,.06); }
#mathekingdom-lehrer .karte.schmal { max-width: 620px; margin: 6vh auto 0; }
#mathekingdom-lehrer .karte.schmal h2 { margin-top: 22px; }
#mathekingdom-lehrer .karte.schmal > .schlicht { margin-top: 14px; }
#mathekingdom-lehrer .reihe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#mathekingdom-lehrer .klassenliste { list-style: none; padding: 0; margin: 0; }
#mathekingdom-lehrer .klassenliste li { display: flex; gap: 14px; align-items: center; padding: 8px 0; border-top: 1px solid #ece8dd; }
#mathekingdom-lehrer .klassenliste li span { flex: 1; color: var(--grau); }
#mathekingdom-lehrer .klassenliste b { font-size: 1.2rem; min-width: 3ch; }

#mathekingdom-lehrer .leiste { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
#mathekingdom-lehrer .leiste h1 { margin: 0; }
#mathekingdom-lehrer .leiste .rechts { margin-left: auto; display: flex; gap: 8px; }
#mathekingdom-lehrer .schalter { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
#mathekingdom-lehrer .schalter input { width: 18px; height: 18px; accent-color: var(--nacht); }
#mathekingdom-lehrer .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--rand); margin-bottom: 14px; flex-wrap: wrap; }
#mathekingdom-lehrer .tabs button { background: transparent; border-radius: 8px 8px 0 0; color: var(--grau); padding: 8px 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; }
#mathekingdom-lehrer .tabs button.aktiv { color: var(--nacht); font-weight: 700; border-bottom-color: var(--gold); background: #fff; }

#mathekingdom-lehrer .schlange { list-style: none; counter-reset: platz; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
#mathekingdom-lehrer .schlange li { counter-increment: platz; border: 2px solid #ecd58a; background: var(--hell); border-radius: 10px; padding: 10px 12px 10px 46px; position: relative; display: grid; gap: 6px; }
#mathekingdom-lehrer .schlange li::before { content: counter(platz); position: absolute; left: 10px; top: 10px; width: 26px; height: 26px; border-radius: 50%; background: var(--nacht); color: #fff; display: grid; place-items: center; font-weight: 700; }
#mathekingdom-lehrer .schlange li.unterwegs { border-color: #a9dcbf; background: var(--gut-hell); }

#mathekingdom-lehrer .marke { display: inline-block; font-size: .78rem; font-weight: 600; border-radius: 99px; padding: 1px 9px; margin: 1px 4px 1px 0; border: 1px solid; white-space: nowrap; }
#mathekingdom-lehrer .marke.warn { background: var(--hell); color: #7a5b00; border-color: #ecd58a; }
#mathekingdom-lehrer .marke.gut { background: var(--gut-hell); color: var(--gut); border-color: #a9dcbf; }
#mathekingdom-lehrer .marke.schlecht { background: var(--schlecht-hell); color: var(--schlecht); border-color: #e7b3ad; }
.chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-weight: 700; font-size: .78rem; margin-right: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

#mathekingdom-lehrer .rollbar { overflow-x: auto; }
.tabelle { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.tabelle th { text-align: left; font-size: .8rem; font-weight: 600; color: #5d6679; padding: 6px 10px; border-bottom: 2px solid #d9d4c7; vertical-align: bottom; }
.tabelle td { padding: 6px 10px; border-bottom: 1px solid #ece8dd; vertical-align: top; }
.tabelle td.zahl { text-align: right; white-space: nowrap; }
.tabelle td.code { font-family: Consolas, ui-monospace, monospace; font-weight: 700; letter-spacing: .05em; }
#mathekingdom-lehrer .tabelle tbody tr:hover { background: #faf8f2; }

.balken { position: relative; display: inline-block; width: 120px; height: 18px; background: #ece8dd; border-radius: 4px; overflow: hidden; vertical-align: middle; }
.balken i { position: absolute; inset: 0 auto 0 0; background: #7f9bd1; border-radius: 0 4px 4px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.balken b { position: relative; font-size: .78rem; padding-left: 6px; line-height: 18px; color: #1f2533; }

.matrix th.gruppe { text-align: center; border-left: 2px solid #fff; background: #ece8dd; color: #1d2b4f; }
.matrix th.kurz { text-align: center; cursor: help; }
.matrix td.zelle { text-align: center; width: 46px; border-left: 2px solid #fff; font-size: .82rem; cursor: help; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.matrix td.zelle.erreicht { background: #f5c518; color: #4a3a00; font-weight: 700; }
.matrix td.zelle.begonnen { background: #fff8e1; color: #7a5b00; }
.matrix td.zelle.offen { color: #9aa3b5; }

#mathekingdom-lehrer .liste { margin: 0 0 10px; padding-left: 18px; }
#mathekingdom-lehrer .liste li { margin-bottom: 4px; }
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 14px 0; }
.kachel { border: 1px solid #d9d4c7; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; }
.kachel span { font-size: .8rem; color: #5d6679; }
.kachel b { font-size: 1.25rem; color: #1d2b4f; font-variant-numeric: tabular-nums; }
.verlauf { line-height: 1.9; }

@media print {
  body > *:not(#mk-druck) { display: none !important; }
  body { background: #fff; }
  #mk-druck { font-size: 10pt; }
  #mk-druck .rollbar { overflow: visible; }
  #mk-druck .tabelle th, #mk-druck .tabelle td { padding: 3px 6px; }
  #mk-druck tr { break-inside: avoid; }
  #mk-druck h2 { margin-top: 18px; }
  #mk-druck ul.klein { list-style: none; padding: 0; margin-top: 10px; }
  #mk-druck .kaertchen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  #mk-druck .kaertchen > div { border: 1px dashed #777; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; break-inside: avoid; }
  #mk-druck .kaertchen b { font: 700 20pt Consolas, ui-monospace, monospace; letter-spacing: .08em; }
  #mk-druck .kaertchen small { color: #555; }
}
@media screen { #mk-druck { display: none; } }

/* Bedienung mit dem Finger */
#mathekingdom-lehrer button, #mathekingdom-lehrer select { min-height: 40px; }
#mathekingdom-lehrer .link { min-height: 0; }

/* Klassenraum */
#mathekingdom-lehrer .karte > .reihe:first-child { margin-bottom: 10px; }
#mathekingdom-lehrer .karte > .reihe:first-child h2 { margin: 0; }
#mathekingdom-lehrer .reihe .rechts, #mathekingdom-lehrer .rechts { margin-left: auto; }
#mathekingdom-lehrer .legende { display: flex; gap: 12px; flex-wrap: wrap; font-size: .86rem; color: var(--grau); }
#mathekingdom-lehrer .punkt { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#mathekingdom-lehrer .punkt i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-style: normal; font-weight: 700; font-size: .75rem; color: #fff; background: #8d97ad; }
#mathekingdom-lehrer .punkt.flow i { background: var(--gut); }
#mathekingdom-lehrer .punkt.arbeitet i { background: #7f9bd1; }
#mathekingdom-lehrer .punkt.beobachten i, #mathekingdom-lehrer .punkt.hilfe i { background: #c98a00; }
#mathekingdom-lehrer .punkt.blockiert i { background: var(--schlecht); }
#mathekingdom-lehrer .sitzplan { display: grid; gap: 8px; }
#mathekingdom-lehrer .platz { min-height: 92px; border-radius: 10px; border: 2px solid var(--rand); background: #fff; padding: 8px 10px; text-align: left; white-space: normal;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-content: start; position: relative; overflow: hidden; }
#mathekingdom-lehrer .platz b { grid-column: 1; font-size: .95rem; line-height: 1.2; overflow-wrap: break-word; hyphens: auto; min-width: 0; }
@media (max-width: 900px) { #mathekingdom-lehrer .platz { padding: 6px; } #mathekingdom-lehrer .platz b { font-size: .84rem; } #mathekingdom-lehrer .platz .zeichen { width: 20px; height: 20px; font-size: .75rem; } }
#mathekingdom-lehrer .platz .zeichen { grid-column: 2; grid-row: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: #8d97ad; }
#mathekingdom-lehrer .platz .was { grid-column: 1 / -1; font-size: .8rem; color: var(--grau); }
#mathekingdom-lehrer .platz .unten { grid-column: 1 / -1; font-size: .8rem; display: flex; align-items: center; gap: 2px; margin-top: 2px; }
#mathekingdom-lehrer .platz .chip { width: 18px; height: 18px; font-size: .68rem; }
#mathekingdom-lehrer .platz.leer { border: 0; background: transparent; }
#mathekingdom-lehrer .sitzplan.bearbeiten .platz.leer { border: 2px dashed #b9bfcc; }
#mathekingdom-lehrer .platz.gewaehlt { outline: 4px solid var(--gold); outline-offset: 1px; }
#mathekingdom-lehrer .platz.flow { background: var(--gut-hell); border-color: var(--gut); }
#mathekingdom-lehrer .platz.flow .zeichen { background: var(--gut); }
#mathekingdom-lehrer .platz.arbeitet .zeichen { background: #7f9bd1; }
#mathekingdom-lehrer .platz.beobachten, #mathekingdom-lehrer .platz.hilfe { background: #fff1c2; border-color: #c98a00; }
#mathekingdom-lehrer .platz.beobachten .zeichen, #mathekingdom-lehrer .platz.hilfe .zeichen { background: #c98a00; }
#mathekingdom-lehrer .platz.hilfe { box-shadow: 0 0 0 3px #c98a00; }
#mathekingdom-lehrer .platz.hilfe .was, #mathekingdom-lehrer .platz.blockiert .was { color: var(--tinte); font-weight: 600; }
#mathekingdom-lehrer .platz.blockiert { background: #f9d2cd; border-color: var(--schlecht); }
#mathekingdom-lehrer .platz.blockiert .zeichen { background: var(--schlecht); }
#mathekingdom-lehrer .platz.inaktiv { background: #ebe8e0; }
#mathekingdom-lehrer .platz.fehlt { background: transparent; border-style: dashed; color: var(--grau); }

/* Akut-Zone und Impulse */
#mathekingdom-lehrer .schlange li.blockiert { border-color: #e7b3ad; background: var(--schlecht-hell); }
#mathekingdom-lehrer .schlange li .marke { margin-left: 8px; }
#mathekingdom-lehrer .nachricht summary { cursor: pointer; color: var(--nacht); font-weight: 600; padding: 6px 0; }
#mathekingdom-lehrer .nachricht .reihe { margin-top: 6px; }
#mathekingdom-lehrer .nachricht .schlicht { white-space: normal; text-align: left; }
#mathekingdom-lehrer .nachricht input { flex: 1 1 160px; min-height: 40px; }
#mathekingdom-lehrer .impulse { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
#mathekingdom-lehrer .impulse li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 1px solid #ecd58a; background: var(--hell); border-radius: 10px; padding: 8px 12px; }
#mathekingdom-lehrer .impulse li > span { flex: 1 1 320px; }
#mathekingdom-lehrer .impulse li.gut { border-color: #a9dcbf; background: var(--gut-hell); }

/* Detailansicht */
#mathekingdom-lehrer .overlay { position: fixed; inset: 0; background: rgba(29,43,79,.55); display: grid; place-items: center; padding: 16px; z-index: 10; }
#mathekingdom-lehrer .overlay-inhalt { background: #fff; border-radius: 14px; width: min(980px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
#mathekingdom-lehrer .overlay-kopf { position: sticky; top: -18px; background: #fff; padding: 10px 0; margin-top: -10px; z-index: 1; border-bottom: 1px solid var(--rand); }
#mathekingdom-lehrer .overlay-kopf h2 { margin: 0; font-size: 1.3rem; }
.zweispaltig { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 24px; }

/* Lernpfad */
#mathekingdom-lehrer .pfad th { vertical-align: top; min-width: 150px; }
#mathekingdom-lehrer .pfad th select { margin-top: 4px; font-weight: 400; max-width: 190px; }
#mathekingdom-lehrer .sperre { width: 100%; background: #fff; border-color: #b9bfcc; color: var(--nacht); }
#mathekingdom-lehrer .sperre.erreicht { background: #f5c518; border-color: #a67c00; color: #4a3a00; font-weight: 600; }
#mathekingdom-lehrer .sperre.begonnen { background: var(--hell); border-color: #ecd58a; }
#mathekingdom-lehrer .sperre.zu { background: #5d6679; border-color: #5d6679; color: #fff; font-weight: 600; }

@media print {
  #mk-druck .kacheln { grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0; }
  #mk-druck .kachel { padding: 4px 8px; }
  #mk-druck h3 { margin: 10px 0 4px; }
  #mk-druck .zweispaltig { grid-template-columns: 1fr 1fr; }
}
@media print { #mk-druck .kaertchen b.pin { font-size: 16pt; letter-spacing: .25em; } #mk-druck .kaertchen span { margin-top: 6px; font-size: 9pt; color: #555; } }

/* Aufgaben-Auswertung */
.filter { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-bottom: 12px; }
.filter label { display: flex; flex-direction: column; gap: 2px; }
.filter select { min-height: 40px; }
.tabelle.gruppen td:first-child { font-weight: 600; white-space: nowrap; }
