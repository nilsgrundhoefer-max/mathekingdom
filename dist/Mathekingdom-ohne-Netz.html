#mathekingdom .kaertchen { display: grid; gap: 10px; }
#mathekingdom .kaertchen-zu { white-space: normal; text-align: left; background: var(--karte); border: 2px dashed #bfae8f; border-radius: 4px 14px 4px 14px; display: flex; flex-direction: column; gap: 2px; padding: 12px; }
#mathekingdom .kaertchen-zu span { font-size: .84rem; color: var(--grau); }
#mathekingdom .kaertchen-zu:hover:not(:disabled) { border-color: var(--gold); background: var(--hell); }
/* Ein aufgedecktes Hilfek\xE4rtchen sieht aus wie eine kleine Schriftrolle. */
#mathekingdom .kaertchen-offen { background: linear-gradient(#f8efd6, #f8efd6) padding-box; border: 2px solid #d9c48d; border-left-width: 8px; border-right-width: 8px; border-radius: 10px; padding: 12px 14px; box-shadow: inset 0 6px 0 -3px #efe1b8, inset 0 -6px 0 -3px #efe1b8; }
#mathekingdom .kaertchen-offen p { margin: 4px 0 0; }
#mathekingdom .hilferuf { white-space: normal; margin-top: 14px; width: 100%; justify-content: center; }

/* Wappen und Spiel */
#mathekingdom .werkbank { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; padding: 16px 24px; }
#mathekingdom .teile-liste { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
#mathekingdom .teil { background: var(--karte); border: 2px solid var(--rand); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
#mathekingdom .teil.an { border-color: var(--nacht); }
#mathekingdom .farbfeld { width: 44px; height: 50px; border-radius: 4px 4px 22px 22px; border: 2px solid var(--nacht); }
#mathekingdom .vorschau { line-height: 0; }
#mathekingdom .spiel { max-width: 520px; margin: 6vh auto 0; text-align: center; }
#mathekingdom .spiel form { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
#mathekingdom .gross { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
#mathekingdom .spiel input { font-size: 2rem; width: 5ch; text-align: center; }
#mathekingdom .uhr { font-variant-numeric: tabular-nums; }

@media (max-width: 820px) {
  #mathekingdom .aufgabe { grid-template-columns: 1fr; }
  #mathekingdom .lernziele li { grid-template-columns: auto 1fr auto; }
  #mathekingdom .lernziele .punkte { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  #mathekingdom .ergebnis { animation: mk-auf .25s ease-out; }
  @keyframes mk-auf { from { opacity: 0; transform: translateY(6px); } }
}
#mathekingdom .anmeldung input#pin { letter-spacing: .4em; }
#mathekingdom .hilfebanner.nachricht { background: #e9eef0; border-bottom-color: #c3cdd1; }

/* Bilder in Aufgaben */
#mathekingdom .mitbild { display: flex; flex-direction: column; gap: 12px; align-self: stretch; align-items: flex-start; }
#mathekingdom .bildrahmen { align-self: stretch; overflow-x: auto; }
#mathekingdom svg.zahlenstrahl { display: block; width: 100%; min-width: 560px; max-width: 760px; height: auto; }
#mathekingdom .zahlenstrahl .achse { stroke: var(--tinte); stroke-width: 2.5; }
#mathekingdom .zahlenstrahl .spitze { fill: var(--tinte); }
#mathekingdom .zahlenstrahl .strich line { stroke: var(--tinte); stroke-width: 1.5; }
#mathekingdom .zahlenstrahl .strich.gross line { stroke-width: 2.5; }
#mathekingdom .zahlenstrahl text { font-size: 15px; fill: var(--tinte); font-variant-numeric: tabular-nums; }
#mathekingdom .zahlenstrahl .treffer { fill: transparent; cursor: pointer; }
#mathekingdom .zahlenstrahl .strich[role=button]:hover .treffer { fill: rgba(212,164,25,.22); }
#mathekingdom .zahlenstrahl .strich[role=button]:focus-visible { outline: none; }
#mathekingdom .zahlenstrahl .strich[role=button]:focus-visible .treffer { fill: rgba(212,164,25,.22); stroke: var(--gold); stroke-width: 2; }
#mathekingdom .zahlenstrahl .marke { fill: var(--gold); stroke: var(--nacht); stroke-width: 2.5; }
#mathekingdom .zahlenstrahl .start { fill: var(--nacht); stroke: #fff; stroke-width: 2; }
#mathekingdom .zahlenstrahl .startwort { font-size: 13px; font-weight: 700; fill: var(--nacht); }
#mathekingdom .zahlenstrahl .sprung { fill: none; stroke: #0072b2; stroke-width: 2.5; }
#mathekingdom .zahlenstrahl .sprungspitze { fill: #0072b2; }
#mathekingdom .zahlenstrahl .sprungtext { font-weight: 700; fill: #005a8c; }
#mathekingdom .zahlenstrahl .frage { font-size: 20px; font-weight: 700; fill: var(--schlecht); }
#mathekingdom .zahlenstrahl .fragepfeil { fill: var(--schlecht); }
#mathekingdom svg.diagramm { display: block; width: 100%; min-width: 420px; max-width: 580px; height: auto; }
#mathekingdom .diagramm .titel { font-size: 15px; font-weight: 700; fill: var(--nacht); }
#mathekingdom .diagramm .einheit, #mathekingdom .diagramm .achsenzahl { font-size: 13px; fill: var(--grau); font-variant-numeric: tabular-nums; }
#mathekingdom .diagramm .gitter { stroke: #ddd8cb; stroke-width: 1; }
#mathekingdom .diagramm .gitter.fein { stroke-dasharray: 3 4; }
#mathekingdom .diagramm .grund { stroke: var(--tinte); stroke-width: 1.5; }
#mathekingdom .diagramm .saeule { fill: #3b6fb5; }
#mathekingdom .diagramm .name { font-size: 14px; fill: var(--tinte); }
#mathekingdom .diagramm .wert { font-size: 14px; font-weight: 700; fill: var(--tinte); }
#mathekingdom .aufgabentabelle { border-collapse: collapse; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
#mathekingdom .aufgabentabelle th, #mathekingdom .aufgabentabelle td { border: 1.5px solid #9aa3b5; padding: 8px 14px; text-align: right; }
#mathekingdom .aufgabentabelle thead th, #mathekingdom .aufgabentabelle tbody th { background: #f1e7cf; color: var(--nacht); }
#mathekingdom .aufgabentabelle tbody th { text-align: left; }
#mathekingdom .aufgabentabelle td .zahlfeld input { width: 7ch; font-size: 1.1rem; }
#mathekingdom .teile.einzeln { list-style: none; }

/* Bilder zu Aufgaben (ADR 0015): schematisch, in jeder Breite ganz sichtbar */
#mathekingdom .bildrahmen.zumtext { margin-bottom: 18px; }
#mathekingdom svg.aufgabenbild { display: block; max-width: 100%; height: auto; }
#mathekingdom .aufgabenbild .bildzahl { font-size: 20px; font-weight: 700; fill: var(--nacht); font-variant-numeric: tabular-nums; }
#mathekingdom .aufgabenbild .bildzahl.klein { font-size: 17px; }
#mathekingdom .aufgabenbild .bildfrage { font-size: 24px; font-weight: 800; fill: #8a5a00; }
#mathekingdom .aufgabenbild .bildkopf { font-size: 17px; font-weight: 700; fill: var(--nacht); }
#mathekingdom .aufgabenbild .bildname { font-size: 16px; fill: var(--tinte); }
/* Grundlagen-Schleife (ADR 0015) */
#mathekingdom .marke.grundlagenmarke { background: #e7eef8; color: #2f4f7f; border: 1.5px solid #2f4f7f; }
#mathekingdom .ergebnis p.grundlage { border-left: 6px solid #2f4f7f; background: #eef3fa; padding: 10px 14px; border-radius: 6px; }
/* Rechenraster und Ziffernr\xE4tsel: ein K\xE4stchen je Ziffer */
#mathekingdom input.ziffer { width: 1.9ch; padding: 4px 2px; margin: 0 2px; text-align: center; font: inherit; font-weight: 700; border: 2px solid var(--nacht); border-radius: 6px; background: #fffdf6; box-sizing: content-box; }
#mathekingdom input.ziffer[size="2"] { width: 2.9ch; }
#mathekingdom .aufgabentabelle.raster { font-size: 1.5rem; background-image: linear-gradient(#d9e2f0 1px, transparent 1px), linear-gradient(90deg, #d9e2f0 1px, transparent 1px); background-size: 12px 12px; background-color: #fff; }
#mathekingdom .aufgabentabelle.raster th, #mathekingdom .aufgabentabelle.raster td { border: none; text-align: center; padding: 6px 12px; min-width: 2.2ch; }
#mathekingdom .aufgabentabelle.raster thead th { background: #f1e7cf; border-bottom: 1.5px solid #9aa3b5; }
#mathekingdom .aufgabentabelle.raster tbody th { background: none; font-size: 1rem; font-weight: 600; color: var(--grau); text-align: right; }
#mathekingdom .aufgabentabelle.raster tbody tr:last-child th, #mathekingdom .aufgabentabelle.raster tbody tr:last-child td { border-top: 3px solid var(--nacht); }

/* Startseite: Etappe */
#mathekingdom .etappe { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 8px solid var(--gold); margin-bottom: 22px; }
#mathekingdom .etappe h2 { margin: 2px 0 10px; font-size: 1.3rem; }
#mathekingdom .etappe .klein { text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; font-weight: 700; color: var(--grau); }
#mathekingdom .etappe-text { flex: 1 1 320px; min-width: 0; }
#mathekingdom .etappe .balken { display: flex; gap: 5px; max-width: 420px; }
#mathekingdom .etappe .balken i { flex: 1; height: 12px; border-radius: 6px; background: #e8dcc2; border: 1px solid var(--rand); }
#mathekingdom .etappe .balken i.voll { background: var(--gut); border-color: var(--gut); }
#mathekingdom .etappe-stand { display: block; margin-top: 6px; font-size: .9rem; color: var(--grau); }
#mathekingdom .etappe .haupt { font-size: 1.15rem; padding: 14px 26px; }

/* Merkzettel */
#mathekingdom .merkzettel { background: #f1f2e4; border: 1px solid #cfd2b4; border-radius: 12px; padding: 0 14px; margin-bottom: 14px; }
#mathekingdom .tafel .merkzettel { margin: 16px 0 0; }
#mathekingdom .merkzettel summary { cursor: pointer; font-weight: 700; color: var(--nacht); padding: 12px 0; min-height: 44px; }
#mathekingdom .merkzettel ul { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 6px; }
#mathekingdom .merkzettel p { margin: 0 0 10px; font-variant-numeric: tabular-nums; }
#mathekingdom .merkzettel .heft { color: var(--grau); }
#mathekingdom .hilfen .merkzettel { font-size: .93rem; }

/* Wortspeicher */
#mathekingdom .wortspeicher { background: #edf0ea; border: 1px solid #c8cfbf; border-radius: 12px; padding: 0 14px; margin-bottom: 14px; font-size: .95rem; }
#mathekingdom .wortspeicher summary { cursor: pointer; font-weight: 700; color: var(--nacht); padding: 12px 0; min-height: 44px; }
#mathekingdom .wortspeicher dl { margin: 0 0 12px; display: grid; gap: 2px; }
#mathekingdom .wortspeicher dt { font-weight: 700; margin-top: 6px; }
#mathekingdom .wortspeicher dd { margin: 0; }
#mathekingdom .option span { white-space: pre-line; }

/* Gr\xF6\xDFere Tippfl\xE4chen auf Touch-Bildschirmen */
@media (pointer: coarse) {
  #mathekingdom button { min-height: 44px; }
  #mathekingdom .regionskarte .meilensteinname { font-size: 16px; }
}
@media (max-width: 560px) {
  #mathekingdom .kopf { gap: 10px; padding: 8px 12px; }
  #mathekingdom .kopf nav { flex-basis: 100%; }
  #mathekingdom .kopf nav button { flex: 1; }
}

/* Kronen (ADR 0012) */
#mathekingdom .kronenwert { display: inline-flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; }
#mathekingdom .kronenwert .je { display: inline-flex; align-items: center; gap: 2px; }
#mathekingdom .kronenwert .je.null { opacity: .4; }
#mathekingdom .kronenwahl { margin: 12px 0; }
#mathekingdom .kronenwahl .wahl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
#mathekingdom .kronenwahl button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 6px 10px; border: 1.5px solid var(--rand); border-radius: 8px; background: #fbf6ea; color: var(--tinte); font: inherit; cursor: pointer; }
#mathekingdom .kronenwahl button[aria-pressed="true"] { border: 3px solid var(--nacht); background: #efe3c6; font-weight: 700; }
#mathekingdom .kronenwahl .ziel { font-size: .75rem; color: var(--grau); font-weight: 700; }
#mathekingdom .meinekrone { display: flex; align-items: center; gap: 8px; margin: 6px 0; }

/* R\xFCckblick und Expedition (ADR 0014) */
#mathekingdom .karte.rueckblick { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 6px solid #2f4f7f; }
#mathekingdom .karte.rueckblick h2, #mathekingdom .karte.expedition h2 { margin: .1rem 0 .3rem; }
#mathekingdom .karte.rueckblick p { margin: 0; }
#mathekingdom .marke.rueckblickmarke { background: #e3eaf4; color: #2f4f7f; border-color: #b7c7de; }
#mathekingdom .karte.expedition { border-left: 6px solid #9a6a1f; }
#mathekingdom .karte.expedition.geschafft { border-left-color: #3e6b3a; }
#mathekingdom .expeditionsbalken { height: 16px; border-radius: 8px; background: #ece3cf; border: 1px solid #c9b994; overflow: hidden; margin: .4rem 0; }
#mathekingdom .expeditionsbalken i { display: block; height: 100%; background: linear-gradient(90deg, #b9783e, #dcb24a); }
#mathekingdom .karte.expedition.geschafft .expeditionsbalken i { background: #3e6b3a; }
#mathekingdom .karte.expedition p { margin: .2rem 0; }

/* Sicherheitsangabe und Heftcheck (ADR 0014) */
#mathekingdom .sicherwahl { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .6rem; }
#mathekingdom button.haupt.hell { background: #f3ead6; color: var(--tinte); border: 2px solid #5b4632; }
#mathekingdom .hinweis.ueberraschung { border-left: 5px solid #7b2d43; font-weight: 600; }
#mathekingdom .heftcode { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
#mathekingdom .heftcode .code { font: 700 1.1rem var(--schrift-titel); border: 2px solid #5b4632; border-radius: 6px; padding: .1rem .5rem; background: #fffaf0; }
#mathekingdom .heftwahl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; margin-top: .8rem; }
#mathekingdom .heftwahl button { font-size: 1.15rem; padding: .8rem; }
#mathekingdom .karte.heftcheck { border-left: 6px solid #5b4632; }
#mathekingdom .karte.heftcheck.richtig { border-left-color: #3e6b3a; }
#mathekingdom .karte.heftcheck.falsch { border-left-color: #a3302a; }

/* Einstiegscheck und Br\xFCcke (ADR 0014) */
#mathekingdom .karte.einstieg, #mathekingdom .karte.bruecke { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 6px solid #6b4f9e; }
#mathekingdom .karte.bruecke { border-left-color: #2e7d6b; }
#mathekingdom .karte.einstieg h2, #mathekingdom .karte.bruecke h2 { margin: .1rem 0 .3rem; }
#mathekingdom .karte.einstieg p, #mathekingdom .karte.bruecke p { margin: 0; max-width: 60ch; }
#mathekingdom .karte.einstieg .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }
#mathekingdom .marke.einstiegmarke { background: #ece6f5; color: #4b3675; border-color: #cbbde3; }
#mathekingdom .marke.brueckenmarke { background: #e2f1ec; color: #1f5a4c; border-color: #b4d9cd; }
#mathekingdom .ergebnis.neutral { background: var(--hell); border-left: 5px solid #6b4f9e; }
#mathekingdom .vorschlag.bruecke { border-left: 5px solid #2e7d6b; margin-top: 10px; }
