,{"wort":"Rechenvorteil","ab":"M","erklaerung":"Ein geschickter Weg, der das Rechnen leichter macht."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zu 52 − 4 = 48 gehört 48 + 4 = 52."},{"wort":"Summand","ab":"E","erklaerung":"Eine Zahl, die addiert wird. Bei 34 + 12 sind 34 und 12 die Summanden."}]},{"id":"5.3.2","titel":"Addieren","extra":false,"lernziele":[{"id":"5.3.2-A1","text":"Ich kann die Fachbegriffe Summand und Summe verwenden.","voraussetzungen":["5.3.1-K1"],"grundlage":"Plus als „zusammen“ und „dazu“: Aufgabe und Bild zuordnen"},{"id":"5.3.2-A2","text":"Ich kann schriftlich addieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K1"],"grundlage":"Bündeln: 10 Einer sind 1 Zehner, dann Rechnen im Stellenraster"},{"id":"5.3.2-A3","text":"Ich kann mehrere Zahlen schriftlich addieren.","voraussetzungen":["5.3.2-A2"],"grundlage":"Drei Zahlen im Raster ohne Übertrag, passende Zehner zuerst"},{"id":"5.3.2-A4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.2-A2","5.3.1-K1"],"grundlage":"Nachbarzehner finden, Plus mit Minus rückgängig machen"},{"id":"5.3.2-A5","text":"Ich kann Sachaufgaben zur Addition lösen, auch mit Tabellen und Diagrammen.","voraussetzungen":["5.3.2-A2"],"grundlage":"Dazukommen und Zusammenlegen am Bild, Rechnung zuordnen"}],"merkzettel":{"regeln":["Summand + Summand = Summe. Bei 34 + 12 = 46 sind 34 und 12 die Summanden, 46 ist der Wert der Summe.","Schriftlich addieren: Schreibe stellengerecht untereinander, Einer unter Einer. Addiere von rechts nach links.","Ist das Ergebnis einer Spalte 10 oder größer, schreibst du den Übertrag klein in die nächste Spalte und rechnest ihn dort mit.","Überschlage vorher mit gerundeten Zahlen. Prüfe danach mit der Probe: Summe − Summand = anderer Summand."],"beispiel":"467 + 285: Einer 7 + 5 = 12, schreibe 2, Übertrag 1. Zehner 6 + 8 + 1 = 15, schreibe 5, Übertrag 1. Hunderter 4 + 2 + 1 = 7. Ergebnis 752.","heft":"Rechne schriftliche Aufgaben im Heft, ein Kästchen pro Ziffer."},"wortspeicher":[{"wort":"plus","ab":"F","erklaerung":"So liest du das Zeichen +. Es kommt etwas dazu."},{"wort":"zusammen","ab":"F","erklaerung":"Alles wird zusammengezählt."},{"wort":"Zehner","ab":"F","erklaerung":"Zehn Einer sind ein Zehner. Die Zahl 34 hat 3 Zehner und 4 Einer."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"addieren","ab":"G","erklaerung":"Plus rechnen."},{"wort":"Summand","ab":"G","erklaerung":"Eine Zahl, die addiert wird. Bei 34 + 12 sind 34 und 12 die Summanden."},{"wort":"Summe","ab":"G","erklaerung":"Das Ergebnis einer Plus-Aufgabe. Bei 34 + 12 = 46 ist 46 die Summe."},{"wort":"schriftlich addieren","ab":"G","erklaerung":"Die Zahlen stehen untereinander. Du rechnest Stelle für Stelle von rechts nach links."},{"wort":"Übertrag","ab":"G","erklaerung":"Der Zehner, den du in die nächste Spalte mitnimmst."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"runden","ab":"G","erklaerung":"Eine Zahl durch eine glatte Zahl in der Nähe ersetzen. Aus 48 wird 50."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst dein Ergebnis mit der Minus-Aufgabe. Zu 34 + 12 = 46 gehört 46 − 12 = 34."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Addition gehört die Subtraktion."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 34 + 12."}]},{"id":"5.3.3","titel":"Subtrahieren","extra":false,"lernziele":[{"id":"5.3.3-S1","text":"Ich kann die Fachbegriffe Minuend, Subtrahend und Differenz verwenden.","voraussetzungen":["5.3.1-K2"],"grundlage":"Minus als „wegnehmen“: Aufgabe und Bild zuordnen"},{"id":"5.3.3-S2","text":"Ich kann schriftlich subtrahieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K2","5.3.2-A2"],"grundlage":"Entbündeln: 1 Zehner sind 10 Einer, dann Rechnen im Stellenraster"},{"id":"5.3.3-S3","text":"Ich kann mehrere Zahlen schriftlich subtrahieren.","voraussetzungen":["5.3.3-S2"],"grundlage":"Zweimal nacheinander wegnehmen"},{"id":"5.3.3-S4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.3-S2","5.3.2-A4"],"grundlage":"Minus mit Plus rückgängig machen, Nachbarzehner"},{"id":"5.3.3-S5","text":"Ich kann Sachaufgaben zur Subtraktion lösen.","voraussetzungen":["5.3.3-S2"],"grundlage":"Wegnehmen am Bild, Rechnung und Geschichte zuordnen"}],"merkzettel":{"regeln":["Minuend − Subtrahend = Differenz. Bei 46 − 12 = 34 ist 46 der Minuend, 12 der Subtrahend, 34 der Wert der Differenz.","Schriftlich subtrahieren: Schreibe stellengerecht untereinander und beginne bei den Einern.","Ist die obere Ziffer zu klein, rechnest du mit 10 mehr und merkst dir den Übertrag 1 für die nächste Spalte.","Mehrere Subtrahenden kannst du zuerst addieren und ihre Summe dann abziehen.","Probe: Differenz + Subtrahend = Minuend."],"beispiel":"532 − 218: Einer 12 − 8 = 4, Übertrag 1. Zehner 3 − 1 − 1 = 1. Hunderter 5 − 2 = 3. Ergebnis 314. Probe: 314 + 218 = 532.","heft":"Rechne schriftliche Aufgaben im Heft und schreibe den Übertrag immer mit."},"wortspeicher":[{"wort":"minus","ab":"F","erklaerung":"So liest du das Zeichen −. Es geht etwas weg."},{"wort":"wegnehmen","ab":"F","erklaerung":"Etwas geht weg. Danach ist es weniger."},{"wort":"tauschen","ab":"F","erklaerung":"Du wechselst 1 Zehner in 10 Einer. Der Wert bleibt gleich."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"subtrahieren","ab":"G","erklaerung":"Minus rechnen."},{"wort":"Minuend","ab":"G","erklaerung":"Die Zahl, von der abgezogen wird. Bei 46 − 12 ist 46 der Minuend."},{"wort":"Subtrahend","ab":"G","erklaerung":"Die Zahl, die abgezogen wird. Bei 46 − 12 ist 12 der Subtrahend."},{"wort":"Differenz","ab":"G","erklaerung":"Das Ergebnis einer Minus-Aufgabe. Bei 46 − 12 = 34 ist 34 die Differenz."},{"wort":"schriftlich subtrahieren","ab":"G","erklaerung":"Die Zahlen stehen untereinander. Du rechnest Stelle für Stelle von rechts nach links."},{"wort":"Übertrag","ab":"G","erklaerung":"Die 1, die du dir für die nächste Spalte merkst."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst dein Ergebnis mit der Plus-Aufgabe. Zu 46 − 12 = 34 gehört 34 + 12 = 46."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Subtraktion gehört die Addition."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 46 − 12."}]},{"id":"5.3.4","titel":"Klammern","extra":false,"lernziele":[{"id":"5.3.4-B1","text":"Ich kann Rechenausdrücke mit Klammern berechnen.","voraussetzungen":["5.3.1-K1","5.3.1-K2"],"grundlage":"In zwei Schritten rechnen: erst zusammenfassen, dann weiter"},{"id":"5.3.4-B2","text":"Ich kann zu einem Text den passenden Rechenausdruck mit Klammern finden.","voraussetzungen":["5.3.4-B1"],"grundlage":"Geschichte mit zwei Schritten der passenden Rechnung zuordnen"}],"merkzettel":{"regeln":["Was in der Klammer steht, wird zuerst berechnet.","Ohne Klammern rechnest du bei Plus und Minus von links nach rechts.","Eine Klammer hinter einem Minus fasst zusammen, was insgesamt abgezogen wird."],"beispiel":"80 − (25 + 15) = 80 − 40 = 40. Ohne Klammer kommt etwas anderes heraus: 80 − 25 + 15 = 55 + 15 = 70.","heft":"Schreibe jeden Rechenschritt in eine neue Zeile und unterstreiche, was du als Nächstes rechnest."},"wortspeicher":[{"wort":"Klammer","ab":"F","erklaerung":"Die Zeichen ( und ). Was in der Klammer steht, rechnest du zuerst."},{"wort":"zuerst","ab":"F","erklaerung":"Das kommt als Erstes dran."},{"wort":"Rechenausdruck","ab":"G","erklaerung":"Eine Rechnung aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 20 − (5 + 3)."},{"wort":"Summe","ab":"G","erklaerung":"Das Ergebnis einer Plus-Aufgabe."},{"wort":"Differenz","ab":"G","erklaerung":"Das Ergebnis einer Minus-Aufgabe."},{"wort":"Minusklammer","ab":"M","erklaerung":"Eine Klammer hinter einem Minus. Alles in ihr wird zusammen abgezogen."},{"wort":"Term","ab":"E","erklaerung":"Ein anderes Wort für Rechenausdruck."}]},{"id":"5.3.5","titel":"Rechengesetze","extra":false,"lernziele":[{"id":"5.3.5-R1","text":"Ich kann das Vertauschungsgesetz und das Verbindungsgesetz erkennen.","voraussetzungen":["5.3.1-K1","5.3.2-A1"],"grundlage":"Tauschaufgaben wie 3 + 5 und 5 + 3"},{"id":"5.3.5-R2","text":"Ich kann mit den Rechengesetzen vorteilhaft rechnen.","voraussetzungen":["5.3.5-R1","5.3.1-K3"],"grundlage":"Passende Zehner suchen, zum Beispiel 7 + 5 + 3"}],"merkzettel":{"regeln":["Vertauschungsgesetz: Beim Addieren darfst du die Summanden vertauschen. 17 + 48 = 48 + 17.","Verbindungsgesetz: Beim Addieren darfst du Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52).","Beide Gesetze gelten nicht beim Subtrahieren: 9 − 4 ist nicht dasselbe wie 4 − 9.","Nutze die Gesetze, um zuerst die Zahlen zu addieren, die gut zusammenpassen."],"beispiel":"37 + 48 + 63 = 37 + 63 + 48 = 100 + 48 = 148.","heft":"Schreibe auf, wie du umgestellt hast, bevor du rechnest."},"wortspeicher":[{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 + 9 und 9 + 3 ergeben beide 12."},{"wort":"zusammen","ab":"F","erklaerung":"Alles wird zusammengezählt."},{"wort":"Vertauschungsgesetz","ab":"G","erklaerung":"Beim Addieren darfst du die Zahlen vertauschen. 17 + 48 = 48 + 17."},{"wort":"Verbindungsgesetz","ab":"G","erklaerung":"Beim Addieren darfst du die Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52)."},{"wort":"Rechenvorteil","ab":"M","erklaerung":"Ein geschickter Weg, der das Rechnen leichter macht."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern."}]}]},{"id":"5.4","titel":"Multiplizieren und Dividieren","unterkapitel":[{"id":"5.4.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.4.1-K1","text":"Ich kann die Aufgaben des kleinen Einmaleins sicher lösen.","voraussetzungen":[],"grundlage":"Mal-Aufgaben im Punktefeld sehen, Kernaufgaben mit 2, 5 und 10"},{"id":"5.4.1-K2","text":"Ich kann Geteilt-Aufgaben aus dem kleinen Einmaleins lösen.","voraussetzungen":["5.4.1-K1"],"grundlage":"Gerecht verteilen im Punktefeld, Mal-Aufgabe als Hilfe"},{"id":"5.4.1-K3","text":"Ich kann mit Stufenzahlen und Zehnerzahlen im Kopf multiplizieren und dividieren.","voraussetzungen":["5.4.1-K1","5.4.1-K2"],"grundlage":"Mal 10 und mal 100 am Zehnermaterial: aus Einern werden Zehner, aus Zehnern Hunderter"},{"id":"5.4.1-K4","text":"Ich kann im Kopf geschickt multiplizieren, zum Beispiel durch Zerlegen, Verdoppeln und Halbieren.","voraussetzungen":["5.4.1-K1","5.4.1-K3"],"grundlage":"Verdoppeln und Halbieren im Punktefeld, Kernaufgaben mit 2, 5 und 10"}],"merkzettel":{"regeln":["Kernaufgaben helfen: mal 1, mal 2, mal 5 und mal 10 kannst du schnell.","Schwere Aufgaben zerlegst du: 7 · 8 ist 5 · 8 und noch 2 · 8, also 40 + 16 = 56.","Nachbaraufgaben: Kennst du 6 · 8 = 48, dann ist 7 · 8 eine Acht mehr, also 56.","Tauschaufgaben haben dasselbe Ergebnis: 3 · 9 = 27 und 9 · 3 = 27.","Geteilt rechnest du mit der Mal-Aufgabe: 56 : 8 = 7, denn 7 · 8 = 56."],"beispiel":"63 : 9: Welche Zahl mal 9 ergibt 63? 5 · 9 = 45, 6 · 9 = 54, 7 · 9 = 63. Also 63 : 9 = 7.","heft":"Schreibe die Reihen, die du noch nicht sicher kannst, ins Heft und sage sie dir laut vor."},"wortspeicher":[{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen ·. 3 · 4 heißt: 3 Päckchen mit je 4."},{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen :. 12 : 3 heißt: 12 gerecht in 3 Teile."},{"wort":"Kernaufgabe","ab":"F","erklaerung":"Eine leichte Aufgabe mit 1, 2, 5 oder 10. Von ihr aus rechnest du weiter."},{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 · 4 und 4 · 3 ergeben beide 12."},{"wort":"Nachbaraufgabe","ab":"G","erklaerung":"Eine Reihe mehr oder weniger. Zu 6 · 7 gehören 5 · 7 und 7 · 7."},{"wort":"Produkt","ab":"G","erklaerung":"Das Ergebnis einer Mal-Aufgabe. Bei 4 · 5 = 20 ist 20 das Produkt."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst eine Geteilt-Aufgabe mit der Mal-Aufgabe."},{"wort":"zerlegen","ab":"F","erklaerung":"Eine schwere Aufgabe in zwei leichte teilen. 7 · 6 ist 5 · 6 und 2 · 6."},{"wort":"verdoppeln","ab":"F","erklaerung":"Mal 2 rechnen. Das Doppelte von 13 ist 26."},{"wort":"halbieren","ab":"F","erklaerung":"Durch 2 teilen. Die Hälfte von 26 ist 13."},{"wort":"Stufenzahl","ab":"G","erklaerung":"Die Zahlen 10, 100, 1000 und so weiter."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zu 56 : 8 gehört 7 · 8."},{"wort":"Quadratzahl","ab":"E","erklaerung":"Eine Zahl mal sich selbst. 6 · 6 = 36, also ist 36 eine Quadratzahl."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 6 teilbar, wenn beim Teilen durch 6 kein Rest bleibt."}]},{"id":"5.4.2","titel":"Multiplizieren","extra":false,"lernziele":[{"id":"5.4.2-M1","text":"Ich kann die Fachbegriffe Faktor und Produkt verwenden.","voraussetzungen":["5.4.1-K1"],"grundlage":"Mal-Aufgaben im Punktefeld: Reihen, Punkte in einer Reihe, alle Punkte"},{"id":"5.4.2-M2","text":"Ich kann schriftlich mit einer einstelligen Zahl multiplizieren.","voraussetzungen":["5.4.1-K1","5.3.2-A2"],"grundlage":"Malkreuz mit Zehnern und Einern, Einmaleins bis 12 · 12"},{"id":"5.4.2-M3","text":"Ich kann schriftlich mit einer mehrstelligen Zahl multiplizieren.","voraussetzungen":["5.4.2-M2","5.4.1-K3"],"grundlage":"Malkreuz mit Zehnern und Einern bei beiden Zahlen, kleine Zahlen"},{"id":"5.4.2-M4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.4.2-M2","5.4.1-K3"],"grundlage":"Mal mit Geteilt rückgängig machen, auf Zehner runden"},{"id":"5.4.2-M5","text":"Ich kann Sachaufgaben zur Multiplikation lösen.","voraussetzungen":["5.4.2-M2"],"grundlage":"Gleich große Gruppen im Bild, Mal-Geschichte und Rechnung zuordnen"}],"merkzettel":{"regeln":["Faktor · Faktor = Produkt. Bei 6 · 7 = 42 sind 6 und 7 die Faktoren, 42 ist der Wert des Produkts.","Im Malkreuz zerlegst du einen Faktor in Zehner und Einer: 4 · 23 = 4 · 20 + 4 · 3 = 80 + 12 = 92.","Schriftlich multiplizieren: Beginne bei den Einern. Den Zehner merkst du dir und rechnest ihn bei der nächsten Stelle dazu.","Bei einem zweistelligen Faktor rechnest du für jede Ziffer ein Teilprodukt. Jedes Teilprodukt endet unter seiner Ziffer. Dann addierst du.","Überschlag: Runde beide Faktoren und rechne im Kopf. Probe: Produkt : Faktor = anderer Faktor."],"beispiel":"418 · 54: 418 · 5 = 2090, darunter um eine Stelle nach rechts 418 · 4 = 1672. Zusammen 22 572. Überschlag: 400 · 50 = 20 000.","heft":"Schreibe schriftliche Multiplikationen im Heft so, dass jede Ziffer ein Kästchen hat."},"wortspeicher":[{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen ·. 4 · 23 heißt: 4-mal die 23."},{"wort":"Malkreuz","ab":"F","erklaerung":"Eine Tabelle zum Zerlegen. Oben und links stehen die Teile, in den Feldern die Teilergebnisse."},{"wort":"zerlegen","ab":"F","erklaerung":"Eine Zahl in Zehner und Einer teilen. 23 ist 20 und 3."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"Faktor","ab":"G","erklaerung":"Eine Zahl, die malgenommen wird. Bei 6 · 7 sind 6 und 7 die Faktoren."},{"wort":"Produkt","ab":"G","erklaerung":"Das Ergebnis einer Mal-Aufgabe. Bei 6 · 7 = 42 ist 42 das Produkt."},{"wort":"schriftlich multiplizieren","ab":"G","erklaerung":"Stelle für Stelle malnehmen, von rechts nach links, mit Übertrag."},{"wort":"Teilprodukt","ab":"G","erklaerung":"Das Ergebnis für eine Ziffer des zweiten Faktors. Bei 418 · 54 sind 2090 und 1672 die Teilprodukte."},{"wort":"Übertrag","ab":"G","erklaerung":"Der Zehner, den du dir merkst und bei der nächsten Stelle dazurechnest."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst dein Ergebnis mit der Geteilt-Aufgabe. Zu 6 · 7 = 42 gehört 42 : 7 = 6."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Multiplikation gehört die Division."}]},{"id":"5.4.3","titel":"Rechenvorteile","extra":false,"lernziele":[{"id":"5.4.3-R1","text":"Ich kann das Vertauschungsgesetz und das Verbindungsgesetz der Multiplikation erkennen.","voraussetzungen":["5.3.5-R1","5.4.1-K1"],"grundlage":"Tauschaufgaben im Punktefeld: Reihen und Spalten tauschen"},{"id":"5.4.3-R2","text":"Ich kann mit den Rechengesetzen vorteilhaft multiplizieren.","voraussetzungen":["5.4.3-R1","5.4.1-K3"],"grundlage":"Mal 2 und mal 5 zusammen ist mal 10"}],"merkzettel":{"regeln":["Vertauschungsgesetz: Beim Multiplizieren darfst du die Faktoren vertauschen. 4 · 9 = 9 · 4.","Verbindungsgesetz: Beim Multiplizieren darfst du die Klammern beliebig setzen. (7 · 5) · 2 = 7 · (5 · 2).","Beim Dividieren gelten beide Gesetze nicht: 12 : 4 ist nicht dasselbe wie 4 : 12.","Suche Faktoren, die zusammen eine Stufenzahl ergeben: 2 · 5 = 10, 4 · 25 = 100, 8 · 125 = 1000."],"beispiel":"4 · 17 · 25 = 17 · (4 · 25) = 17 · 100 = 1700.","heft":"Schreibe auf, wie du umgestellt hast, bevor du rechnest."},"wortspeicher":[{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 · 4 und 4 · 3 ergeben beide 12."},{"wort":"Faktor","ab":"G","erklaerung":"Eine Zahl, die malgenommen wird. Bei 6 · 7 sind 6 und 7 die Faktoren."},{"wort":"Vertauschungsgesetz","ab":"G","erklaerung":"Beim Multiplizieren darfst du die Faktoren vertauschen. 4 · 9 = 9 · 4."},{"wort":"Verbindungsgesetz","ab":"G","erklaerung":"Beim Multiplizieren darfst du die Klammern beliebig setzen. (7 · 5) · 2 = 7 · (5 · 2)."},{"wort":"Rechenvorteil","ab":"M","erklaerung":"Ein geschickter Weg, der das Rechnen leichter macht."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern."}]},{"id":"5.4.4","titel":"Potenzen","extra":false,"lernziele":[{"id":"5.4.4-P1","text":"Ich kann ein Produkt aus gleichen Faktoren als Potenz schreiben und Basis und Exponent benennen.","voraussetzungen":["5.4.1-K1"],"grundlage":"Gleiche Faktoren zählen: 3 · 3 · 3"},{"id":"5.4.4-P2","text":"Ich kann Potenzen berechnen, auch Quadratzahlen und Zehnerpotenzen.","voraussetzungen":["5.4.4-P1","5.4.2-M2"],"grundlage":"Quadrate aus Kästchen und Würfel aus Schichten abzählen"}],"merkzettel":{"regeln":["Ein Produkt aus gleichen Faktoren kannst du als Potenz schreiben: 3 · 3 · 3 · 3 = 3⁴.","Die Basis ist der Faktor, der Exponent sagt, wie oft er vorkommt. Bei 3⁴ ist 3 die Basis und 4 der Exponent.","Achtung: 3⁴ ist nicht 3 · 4. Es ist 3 · 3 · 3 · 3 = 81.","Zehnerpotenzen: 10² = 100, 10³ = 1000, 10⁶ = 1 000 000. Der Exponent sagt, wie viele Nullen die Zahl hat."],"beispiel":"2⁵ = 2 · 2 · 2 · 2 · 2 = 32. Quadratzahlen: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100.","heft":"Schreibe eine Potenz zuerst als Produkt aus und rechne dann Schritt für Schritt."},"wortspeicher":[{"wort":"hoch","ab":"F","erklaerung":"So liest du eine kleine Zahl oben rechts. 3² liest du: 3 hoch 2. Das heißt 3 · 3."},{"wort":"Quadrat","ab":"F","erklaerung":"Ein Viereck mit vier gleich langen Seiten. 3 Reihen mit je 3 Kästchen bilden ein Quadrat."},{"wort":"Potenz","ab":"G","erklaerung":"Eine kurze Schreibweise für ein Produkt aus gleichen Faktoren. 2 · 2 · 2 = 2³."},{"wort":"Basis","ab":"G","erklaerung":"Der Faktor, der malgenommen wird. Bei 2³ ist 2 die Basis."},{"wort":"Exponent","ab":"G","erklaerung":"Die kleine Zahl oben. Sie sagt, wie oft die Basis vorkommt. Bei 2³ ist 3 der Exponent."},{"wort":"Quadratzahl","ab":"G","erklaerung":"Eine Zahl mal sich selbst. 6 · 6 = 36, also ist 36 eine Quadratzahl."},{"wort":"Zehnerpotenz","ab":"G","erklaerung":"Eine Potenz mit der Basis 10. 10³ = 1000."},{"wort":"Zweierpotenz","ab":"M","erklaerung":"Eine Potenz mit der Basis 2. 2⁶ = 64."}]},{"id":"5.4.5","titel":"Dividieren","extra":false,"lernziele":[{"id":"5.4.5-D1","text":"Ich kann die Fachbegriffe Dividend, Divisor und Quotient verwenden.","voraussetzungen":["5.4.1-K2"],"grundlage":"Teilen als Verteilen und als Aufteilen in Gruppen"},{"id":"5.4.5-D2","text":"Ich kann schriftlich durch einstellige Zahlen dividieren.","voraussetzungen":["5.4.1-K2","5.4.5-D1","5.3.1-K2"],"grundlage":"Einmaleins rückwärts, dann mit Zehnerzahlen (12 : 3 und 120 : 3)"},{"id":"5.4.5-D3","text":"Ich kann schriftlich durch zweistellige Zahlen dividieren.","voraussetzungen":["5.4.5-D2","5.4.1-K1"],"grundlage":"Durch 10 teilen"},{"id":"5.4.5-D4","text":"Ich kann Divisionen mit Rest berechnen und den Rest deuten.","voraussetzungen":["5.4.5-D2","5.4.1-K2"],"grundlage":"Plättchen verteilen, einige bleiben übrig"},{"id":"5.4.5-D5","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.4.5-D2","5.3.2-A4"],"grundlage":"Geteilt mit Mal rückgängig machen"},{"id":"5.4.5-D6","text":"Ich kann Sachaufgaben zur Division lösen.","voraussetzungen":["5.4.5-D2","5.4.5-D4"],"grundlage":"Verteil- und Aufteil-Geschichten, Rechnung zuordnen"}],"merkzettel":{"regeln":["Dividend : Divisor = Quotient. Bei 48 : 6 = 8 ist 48 der Dividend, 6 der Divisor, 8 der Wert des Quotienten.","Schriftlich dividieren: Beginne links. Teile, multipliziere zurück, ziehe ab und hole die nächste Ziffer herunter.","Bleibt am Ende etwas übrig, ist das der Rest. Der Rest ist immer kleiner als der Divisor.","Probe: Quotient · Divisor, dazu der Rest, ergibt den Dividenden.","Durch 0 kann man nicht dividieren."],"beispiel":"952 : 4: 9 : 4 = 2 Rest 1. Dann 15 : 4 = 3 Rest 3. Dann 32 : 4 = 8. Ergebnis 238. Probe: 238 · 4 = 952.","heft":"Rechne schriftliche Divisionen im Heft und schreibe die Probe dazu."},"wortspeicher":[{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen : vor. 12 : 3 heißt: 12 geteilt durch 3."},{"wort":"teilen","ab":"F","erklaerung":"Gerecht verteilen oder gleich große Gruppen bilden."},{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen · vor. Mal ist das Gegenteil von geteilt."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"Probe","ab":"F","erklaerung":"Du prüfst dein Ergebnis mit der Mal-Aufgabe. Zu 12 : 3 = 4 gehört 4 · 3 = 12."},{"wort":"Rest","ab":"F","erklaerung":"Was beim Teilen übrig bleibt. 14 : 4 = 3 Rest 2."},{"wort":"Quotient","ab":"G","erklaerung":"Das Ergebnis einer Geteilt-Aufgabe. Bei 12 : 3 = 4 ist 4 der Quotient."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"schriftlich dividieren","ab":"G","erklaerung":"Schritt für Schritt teilen: teilen, malnehmen, abziehen, nächste Ziffer herunterholen."},{"wort":"Dividend","ab":"G","erklaerung":"Die Zahl, die geteilt wird. Bei 12 : 3 ist 12 der Dividend."},{"wort":"Divisor","ab":"G","erklaerung":"Die Zahl, durch die geteilt wird. Bei 12 : 3 ist 3 der Divisor."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Division gehört die Multiplikation."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel (12 + 8) : 4."},{"wort":"Wert","ab":"E","erklaerung":"Die Zahl, die herauskommt, wenn man einen Term ausrechnet."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 7 teilbar, wenn beim Dividieren durch 7 kein Rest bleibt."},{"wort":"Vielfaches","ab":"E","erklaerung":"Die Vielfachen von 7 sind 7, 14, 21, 28 und so weiter."}]},{"id":"5.4.6","titel":"Punkt vor Strich, Klammern zuerst","extra":false,"lernziele":[{"id":"5.4.6-T1","text":"Ich kann die Regel „Punkt vor Strich“ anwenden.","voraussetzungen":["5.4.1-K1","5.3.4-B1"],"grundlage":"Päckchenbilder: einzelne Plättchen und volle Päckchen"},{"id":"5.4.6-T2","text":"Ich kann Rechenausdrücke mit Klammern berechnen, auch mit einer Klammer in der Klammer.","voraussetzungen":["5.4.6-T1","5.3.4-B1"],"grundlage":"Erst die Klammer, dann der Rest: in zwei Schritten rechnen"},{"id":"5.4.6-T3","text":"Ich kann zu einem Text den passenden Rechenausdruck aufstellen.","voraussetzungen":["5.4.6-T1","5.3.4-B2"],"grundlage":"Geschichte mit Päckchen der passenden Rechnung zuordnen"}],"merkzettel":{"regeln":["Klammern zuerst: Was in der Klammer steht, rechnest du als Erstes. Bei einer Klammer in der Klammer beginnst du innen.","Punkt vor Strich: Mal und geteilt rechnest du vor plus und minus.","Sonst rechnest du von links nach rechts."],"beispiel":"3 + 4 · 5 = 3 + 20 = 23. Mit Klammer: (3 + 4) · 5 = 7 · 5 = 35. Innen zuerst: 2 · (20 − (4 + 6)) = 2 · (20 − 10) = 2 · 10 = 20.","heft":"Unterstreiche, was du zuerst rechnest, und schreibe jeden Schritt in eine neue Zeile."},"wortspeicher":[{"wort":"Punkt vor Strich","ab":"F","erklaerung":"Mal und geteilt rechnest du vor plus und minus."},{"wort":"Klammer","ab":"F","erklaerung":"Die Zeichen ( und ). Was in der Klammer steht, rechnest du zuerst."},{"wort":"zuerst","ab":"F","erklaerung":"Das kommt als Erstes dran."},{"wort":"Päckchen","ab":"F","erklaerung":"Ein Päckchen enthält immer gleich viele Plättchen."},{"wort":"Rechenausdruck","ab":"G","erklaerung":"Eine Rechnung aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 3 + 4 · 5."},{"wort":"Punktrechnung","ab":"G","erklaerung":"Mal und geteilt. Ihre Zeichen sind Punkte."},{"wort":"Strichrechnung","ab":"G","erklaerung":"Plus und minus. Ihre Zeichen sind Striche."},{"wort":"Vorrangregel","ab":"M","erklaerung":"Sie sagt, was zuerst kommt: Klammer zuerst, dann Punkt vor Strich, sonst von links nach rechts."},{"wort":"Term","ab":"E","erklaerung":"Ein anderes Wort für Rechenausdruck."}]},{"id":"5.4.7","titel":"Verteilungsgesetz","extra":false,"lernziele":[{"id":"5.4.7-V1","text":"Ich kann ausmultiplizieren.","voraussetzungen":["5.4.1-K4","5.4.6-T2"],"grundlage":"Geteiltes Punktefeld: zwei Teile zusammen ergeben das ganze Feld"},{"id":"5.4.7-V2","text":"Ich kann ausklammern.","voraussetzungen":["5.4.7-V1"],"grundlage":"Zwei Punktefelder mit gleich vielen Reihen zusammenschieben"},{"id":"5.4.7-V3","text":"Ich kann mit dem Verteilungsgesetz geschickt rechnen.","voraussetzungen":["5.4.7-V1","5.4.1-K3"],"grundlage":"Malkreuz mit glatten Zehnern"}],"merkzettel":{"regeln":["Verteilungsgesetz: Eine Zahl mal eine Summe ist gleich der Summe der beiden Produkte. 4 · (20 + 3) = 4 · 20 + 4 · 3.","Ausmultiplizieren: Du nimmst jeden Summanden in der Klammer mit der Zahl vor der Klammer mal.","Ausklammern: Kommt derselbe Faktor in beiden Produkten vor, schreibst du ihn einmal vor die Klammer. 7 · 8 + 7 · 2 = 7 · (8 + 2).","Das Gesetz gilt auch mit minus: 6 · (10 − 1) = 6 · 10 − 6 · 1."],"beispiel":"7 · 98 = 7 · (100 − 2) = 700 − 14 = 686. Und 13 · 6 + 13 · 4 = 13 · (6 + 4) = 13 · 10 = 130.","heft":"Schreibe die Klammer mit der Zerlegung auf, bevor du ausrechnest."},"wortspeicher":[{"wort":"Malkreuz","ab":"F","erklaerung":"Eine Tabelle zum Zerlegen. Oben und links stehen die Teile, in den Feldern die Teilergebnisse."},{"wort":"zerlegen","ab":"F","erklaerung":"Eine Zahl in zwei Teile teilen. 12 ist 10 und 2."},{"wort":"Klammer","ab":"F","erklaerung":"Die Zeichen ( und ). Was in der Klammer steht, rechnest du zuerst."},{"wort":"Summe","ab":"G","erklaerung":"Das Ergebnis einer Plus-Aufgabe. Bei 20 + 3 = 23 ist 23 die Summe."},{"wort":"Produkt","ab":"G","erklaerung":"Das Ergebnis einer Mal-Aufgabe."},{"wort":"Verteilungsgesetz","ab":"G","erklaerung":"Eine Zahl mal eine Summe ist die Summe der beiden Produkte. 4 · (20 + 3) = 4 · 20 + 4 · 3."},{"wort":"ausmultiplizieren","ab":"M","erklaerung":"Die Klammer auflösen: Jeder Teil in der Klammer wird mit der Zahl davor malgenommen."},{"wort":"ausklammern","ab":"M","erklaerung":"Den gleichen Faktor vor eine Klammer schreiben. 7 · 8 + 7 · 2 = 7 · (8 + 2)."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern."}]},{"id":"5.4.X1","titel":"Zahlenmuster","extra":true,"lernziele":[{"id":"5.4.X1-Z1","text":"Ich kann Zahlenmuster fortsetzen.","voraussetzungen":["5.4.1-K1","5.3.1-K1"],"grundlage":"Zahlenfolgen mit gleichen Sprüngen am Zahlenstrahl"},{"id":"5.4.X1-Z2","text":"Ich kann die Regel eines Zahlenmusters beschreiben.","voraussetzungen":["5.4.X1-Z1"],"grundlage":"Sprünge zwischen Nachbarzahlen bestimmen"}],"merkzettel":{"regeln":["Bei einem Zahlenmuster kommt von Zahl zu Zahl immer dasselbe dazu, oder es wird immer mit derselben Zahl malgenommen.","Schau dir die Unterschiede zwischen Nachbarzahlen an. Manchmal werden auch die Unterschiede immer größer.","In einer Mal-Mauer ist jeder Stein das Produkt der beiden Steine darunter."],"beispiel":"3, 6, 12, 24: Jede Zahl ist das Doppelte der Zahl davor. Die nächste Zahl ist 48. Bei 1, 4, 9, 16 werden die Unterschiede 3, 5, 7 immer um 2 größer.","heft":"Schreibe die Unterschiede klein über die Zahlen."},"wortspeicher":[{"wort":"Muster","ab":"F","erklaerung":"Etwas, das sich immer gleich wiederholt."},{"wort":"Regel","ab":"F","erklaerung":"Sie sagt, wie du von einer Zahl zur nächsten kommst."},{"wort":"Zahlenmauer","ab":"F","erklaerung":"Jeder Stein ist die Summe der beiden Steine darunter."},{"wort":"Mal-Mauer","ab":"G","erklaerung":"Jeder Stein ist das Produkt der beiden Steine darunter."},{"wort":"Zahlenfolge","ab":"G","erklaerung":"Zahlen in einer Reihe, die nach einer Regel weitergehen."},{"wort":"Unterschied","ab":"G","erklaerung":"Wie viel eine Zahl größer ist als die Zahl davor."},{"wort":"Quadratzahl","ab":"G","erklaerung":"Eine Zahl mal sich selbst. 4 · 4 = 16, also ist 16 eine Quadratzahl."},{"wort":"Vielfaches","ab":"M","erklaerung":"Eine Zahl aus der Mal-Reihe einer Zahl. 12 ist ein Vielfaches von 3."}]}]},{"id":"5.5","titel":"Geometrische Grundbegriffe und ebene Figuren","unterkapitel":[{"id":"5.5.1","titel":"Strecke und Gerade","extra":false,"lernziele":[{"id":"5.5.1-L1","text":"Ich kann die Begriffe Strecke und Gerade anwenden.","voraussetzungen":[]}]},{"id":"5.5.2","titel":"Senkrechten","extra":false,"lernziele":[{"id":"5.5.2-L1","text":"Ich kann Senkrechten erkennen und zeichnen.","voraussetzungen":["5.5.1-L1"]}]},{"id":"5.5.3","titel":"Parallelen","extra":false,"lernziele":[{"id":"5.5.3-L1","text":"Ich kann Parallelen erkennen und zeichnen.","voraussetzungen":["5.5.2-L1"]}]},{"id":"5.5.4","titel":"Koordinatensystem","extra":false,"lernziele":[{"id":"5.5.4-L1","text":"Ich kann Punkte im Koordinatensystem ablesen und darstellen.","voraussetzungen":["5.2.1-L1","5.5.1-L1"]}]},{"id":"5.5.5","titel":"Entfernung und Abstand","extra":false,"lernziele":[{"id":"5.5.5-L1","text":"Ich kann die Begriffe Entfernung und Abstand richtig anwenden.","voraussetzungen":["5.5.2-L1"]}]},{"id":"5.5.6","titel":"Symmetrie","extra":false,"lernziele":[{"id":"5.5.6-L1","text":"Ich kann symmetrische Figuren erkennen und zeichnen.","voraussetzungen":["5.5.2-L1"]}]},{"id":"5.5.7","titel":"Rechteck und Quadrat","extra":false,"lernziele":[{"id":"5.5.7-L1","text":"Ich kann Rechteck und Quadrat erkennen, unterscheiden und zeichnen.","voraussetzungen":["5.5.2-L1","5.5.3-L1"]}]},{"id":"5.5.8","titel":"Parallelogramm und Raute","extra":false,"lernziele":[{"id":"5.5.8-L1","text":"Ich kann Parallelogramm und Raute erkennen, unterscheiden und zeichnen.","voraussetzungen":["5.5.3-L1","5.5.7-L1"]}]},{"id":"5.5.9","titel":"Drachen und Trapez","extra":false,"lernziele":[{"id":"5.5.9-L1","text":"Ich kann Drachen und Trapez erkennen, unterscheiden und zeichnen.","voraussetzungen":["5.5.6-L1","5.5.8-L1"]}]}]},{"id":"5.6","titel":"Größen und Sachaufgaben","unterkapitel":[{"id":"5.6.1","titel":"Größen schätzen","extra":false,"lernziele":[{"id":"5.6.1-L1","text":"Ich kann Größen schätzen.","voraussetzungen":["5.2.4-L1"]}]},{"id":"5.6.2","titel":"Geld","extra":false,"lernziele":[{"id":"5.6.2-L1","text":"Ich kann mit Geldbeträgen und Geldeinheiten rechnen.","voraussetzungen":["5.3.2-A2","5.3.3-S2"]}]},{"id":"5.6.3" olisch"],"format":"zahl","text":"Berechne: 7000 − 2994 − 1961 − 360","loesung":1685,"typischeFehler":[{"wert":2045,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":2405,"fehlvorstellung":"sub-klammerfehler"}],"hilfen":{"tipp":"Addiere zuerst alle Subtrahenden."},"nachweis":["7000 − 2994 − 1961 − 360 = 1685"]},{"id":"5.3.3-S3-E-02","lernziel":"5.3.3-S3","niveau":"E","afb":2,"kompetenz":["symbolisch"],"format":"zahl","text":"Von einer Zahl werden nacheinander 165, 400 und 115 subtrahiert. Es bleibt 800. Bestimme die Zahl.","loesung":1480,"typischeFehler":[{"wert":120,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Rechne rückwärts: Mache jede Subtraktion rückgängig."},"nachweis":["800 + 165 + 400 + 115 = 1480","1480 − 165 − 400 − 115 = 800"]},{"id":"5.3.3-S3-E-03","lernziel":"5.3.3-S3","niveau":"E","afb":2,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welcher Term hat denselben Wert wie 2300 − 650 − 350 − 250?","mehrfach":false,"optionen":[{"text":"2300 − 650 + 350 + 250","richtig":false,"fehlvorstellung":"sub-klammerfehler"},{"text":"(2300 − 650) + (350 − 250)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"2300 − (650 + 350 + 250)","richtig":true},{"text":"2300 − (650 + 350) + 250","richtig":false,"fehlvorstellung":"sub-klammerfehler"},{"text":"2300 − (650 − 350) − 250","richtig":false,"fehlvorstellung":"sub-klammerfehler"}],"hilfen":{"tipp":"Alle drei Zahlen werden abgezogen. Fasse zusammen, was insgesamt abgezogen wird."},"nachweis":["2300 − 650 − 350 − 250 = 1050","2300 − (650 + 350 + 250) = 1050"]},{"id":"5.3.3-S3-E-04","lernziel":"5.3.3-S3","niveau":"E","afb":3,"kompetenz":["symbolisch"],"format":"luecken","text":"Von 100 werden fünf aufeinanderfolgende Zahlen subtrahiert: 100 − 10 − 11 − 12 − 13 − 14 = 40. Stelle die Regel auf: Insgesamt wird {{a}} · die mittlere Zahl subtrahiert. Bei welcher mittleren Zahl ist das Ergebnis 0? {{b}}","luecken":{"a":{"loesung":5,"typischeFehler":[]},"b":{"loesung":20,"typischeFehler richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"70 − 40","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Runde beide Zahlen auf den nächsten Zehner.","beispiel":"68 − 31: 68 ist fast 70, 31 ist fast 30. Der Überschlag ist 70 − 30.","loesungsschritt":"78 liegt am nächsten bei 80."},"bild":{"art":"zahlenstrahl","von":70,"bis":80,"schritt":1,"beschriftung":5,"start":78},"nachweis":["78 ≈ 80","41 ≈ 40","80 − 40 = 40"]},{"id":"5.3.3-S4-G-02","lernziel":"5.3.3-S4","niveau":"G","afb":1,"kompetenz":["symbolisch"],"format":"luecken","text":"Mache die Probe.\n77 − 21 = 56\nProbe: 56 + {{a}} = {{b}}","luecken":{"a":{"loesung":21,"typischeFehler":[{"wert":77,"fehlvorstellung":"probe-falsche-umkehr"}]},"b":{"loesung":77,"typischeFehler":[]}},"hilfen":{"tipp":"Bei der Probe rechnest du zurück: Ergebnis plus die abgezogene Zahl.","beispiel":"85 − 32 = 53. Probe: 53 + 32 = 85.","loesungsschritt":"Abgezogen wurde 21. Rechne 56 + 21."},"nachweis":["77 − 21 = 56","56 + 21 = 77"]},{"id":"5.3.3-S4-G-03","lernziel":"5.3.3-S4","niveau":"G","afb":2,"kompetenz":["symbolisch"],"format":"luecken","text":"Überschlage zuerst.\n892 − 389\nRunde beide Zahlen auf Hunderter.\n{{a}} − {{b}} = {{c}}","luecken":{"a":{"loesung":900,"typischeFehler":[]},"b":{"loesung":400,"typischeFehler":[]},"c":{"loesung":500,"typischeFehler":[]}},"hilfen":{"tipp":"Hunderter sind Zahlen wie 100, 200, 300. Suche den Hunderter in der Nähe.","beispiel":"592 − 208: 592 ist fast 600, 208 ist fast 200. Überschlag: 600 − 200 = 400.","loesungsschritt":"892 liegt nahe bei 900."},"nachweis":["892 ≈ 900","389 ≈ 400","900 − 400 = 500"]},{"id":"5.3.3-S4-G-04","lernziel":"5.3.3-S4","niveau":"G","afb":1,"kompetenz":["symbolisch"],"format":"zahl","text":"Überschlage: 61 − 21\nRechne mit den Zehnern in der Nähe.","loesung":40,"typischeFehler":[],"hilfen":{"tipp":"Beim Überschlag rechnest du mit runden Zahlen.","beispiel":"79 − 42: 80 − 40 = 40.","loesungsschritt":"61 ist fast 60. 21 ist fast 20."}, zt"},{"text":"(80 − 40) − 20 + 10","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"80 − (40 + 20) + 10","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"80 − (40 − 20) + 10","richtig":true},{"text":"80 − (40 − 20 + 10)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Der Wert wird groß, wenn insgesamt möglichst wenig subtrahiert wird."},"nachweis":[{"art":"extrem","was":"groesstes"},"80 − (40 − 20) + 10 = 70"]},{"id":"5.3.4-B1-E-03","lernziel":"5.3.4-B1","niveau":"E","afb":2,"kompetenz":["symbolisch"],"format":"luecken","text":"Bestimme die fehlende Zahl: 300 − ({{a}} + 40) = 180","luecken":{"a":{"loesung":80,"typischeFehler":[{"wert":120,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":160,"fehlvorstellung":"klammer-ignoriert"}]}},"hilfen":{"tipp":"Bestimme zuerst den Wert der ganzen Klammer."},"nachweis":["300 − 180 = 120","120 − 40 = 80","300 − (80 + 40) = 180"]},{"id":"5.3.4-B1-E-04","lernziel":"5.3.4-B1","niveau":"E","afb":3,"kompetenz":["symbolisch"],"format":"auswahl","text":"50 − (20 − 5) = 35 und 50 − 20 + 5 = 35. Ebenso 90 − (40 − 10) = 60 und 90 − 40 + 10 = 60. Stelle die Regel für a − (b − c) auf.","mehrfach":false,"optionen":[{"text":"a − (b − c) = a − b − c: Die Klammer darf man einfach weglassen.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"a − (b − c) = a − b + c: Es wird um c weniger abgezogen, also kommt c wieder dazu.","richtig":true},{"text":"a − (b − c) = (a − b) − c: Die Klammer darf man verschieben.","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"Es gibt keine Regel. Jedes Beispiel muss einzeln berechnet werden.","richtig":false},{"text":"a − (b − c) = a + b − c: Das Minus vor der Klammer wird zu einem Plus.","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Vergleiche in beiden Beispielen die Rechenzeichen vor der letzten Zahl."},"nachweis":["50 − (20 − 5) = 35","50 − 20 + 5 = 35","90 − (40 − 10) = 60"," .4-B2","niveau":"G","afb":1,"kompetenz":["modellieren"],"format":"auswahl","text":"Mara hat 50 Euro.\nMara kauft ein Buch für 11 Euro.\nMara kauft ein Spiel für 20 Euro.\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"50 − (11 + 20)","richtig":true},{"text":"(50 + 11) − 20","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"50 − 11 + 20","richtig":false,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Beide Preise gehen weg. In der Klammer steht, was zusammen weggeht.","beispiel":"30 Euro. Ein Heft für 4 Euro, ein Ball für 6 Euro: 30 − (4 + 6).","loesungsschritt":"Zusammen gehen 11 + 20 Euro weg."},"bild":{"art":"streifen","ganz":50,"teile":[11,20,{"wert":19,"frage":true}]},"nachweis":["50 − (11 + 20) = 19"]},{"id":"5.3.4-B2-G-02","lernziel":"5.3.4-B2","niveau":"G","afb":1,"kompetenz":["modellieren"],"format":"zahl","text":"Noah hat 40 Euro.\nNoah kauft einen Ball für 16 Euro.\nNoah kauft ein Heft für 10 Euro.\nWie viel Euro bleiben?","loesung":14,"typischeFehler":[{"wert":34,"fehlvorstellung":"klammer-ignoriert"},{"wert":24,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Rechne erst aus, was beides zusammen kostet.","beispiel":"30 Euro. Zusammen 4 + 6 = 10 Euro ausgegeben. Es bleiben 20 Euro.","loesungsschritt":"16 + 10 = 26. Ziehe das von 40 ab."},"einheit":"Euro","bild":{"art":"streifen","ganz":40,"teile":[16,10,{"wert":14,"frage":true}]},"nachweis":["40 − (16 + 10) = 14"]},{"id":"5.3.4-B2-G-03","lernziel":"5.3.4-B2","niveau":"G","afb":2,"kompetenz":["modellieren"],"format":"luecken","text":"Die Rechnung ist 50 − (15 + 5).\nWie viel wird zusammen abgezogen? {{a}}\nWas ist das Ergebnis? {{b}}","luecken":{"a":{"loesung":20,"typischeFehler":[]},"b":{"loesung":30,"typischeFehler":[{"wert":40,"fehlvorstellung":"klammer-ignoriert"}]}},"hilfen":{"tipp":"In der Klammer steht, was zusammen abgezogen wird.","beispiel":"40 − (15 + 5): Zusammen werden 20 abgezogen. Ergebnis 20.","loesungsschritt":"15 + 5 = 20."},"bild" "},{"text":"Falsch.\nBeide Beträge gehen weg.\nRichtig ist 80 − (25 + 10).","richtig":true},{"text":"Falsch.\nRichtig ist 80 + 25 + 10.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Ausgeben heißt minus. Hier wird 2-mal Geld ausgegeben.","beispiel":"50 Euro, 10 Euro und 5 Euro ausgegeben: 50 − (10 + 5).","loesungsschritt":"Zusammen gehen 25 + 10 = 35 Euro weg."},"nachweis":[{"art":"urteil","stimmt":false},"80 − (25 + 10) = 45","80 − 25 + 10 = 65"]},{"id":"5.3.4-B2-M-01","lernziel":"5.3.4-B2","niveau":"M","afb":1,"kompetenz":["modellieren"],"format":"auswahl","text":"Welcher Rechenausdruck passt? „Subtrahiere die Summe von 65 und 30 von 200.“","mehrfach":false,"optionen":[{"text":"200 − 65 + 30","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"(65 + 30) − 200","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"200 − (65 + 30)","richtig":true},{"text":"(200 − 65) + 30","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"„Von“ nennt den Minuenden. Die Summe wird als Ganzes abgezogen und steht deshalb in der Klammer.","loesungsschritt":"Der Minuend ist 200. Abgezogen wird 65 + 30."},"nachweis":["200 − (65 + 30) = 105"]},{"id":"5.3.4-B2-M-02","lernziel":"5.3.4-B2","niveau":"M","afb":2,"kompetenz":["modellieren"],"format":"zahl","text":"Subtrahiere von 500 die Differenz der Zahlen 310 und 130. Stelle den Rechenausdruck auf und berechne.","loesung":320,"typischeFehler":[{"wert":60,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Die Differenz wird als Ganzes subtrahiert. Sie steht in einer Klammer.","loesungsschritt":"Rechenausdruck: 500 − (310 − 130). Klammer: 310 − 130 = 180."},"nachweis":["500 − (310 − 130) = 320"]},{"id":"5.3.4-B2-M-03","lernziel":"5.3.4-B2","niveau":"M","afb":2,"kompetenz":["modellieren"],"format":"zuordnen","text":"Ordne jedem Text den passenden Rechenausdruck zu.","paare":[{"links":"Subtrahiere die Summe von 30 und 15 von 80.","rechts":"80 − (30 + 15)"},{"links":"Subtrahiere 30 von 80 und addiere 15.","rechts":"(80 − 30) + 15"},{"links":"Subtrahiere die Differenz von 30 und 15 von 80.","rechts":"80 − (30 − 15)"}],"hilfen":{"tipp":"Achte darauf, was als Ganzes abgezogen wird. Das steht in der Klammer.","loesungsschritt":"„Die Summe von 30 und 15“ ist der Ausdruck 30 + 15."},"nachweis":["80 − (30 + 15) = 35","(80 − 30) + 15 = 65","80 − (30 − 15) = 65"]},{"id":"5.3.4-B2-M-04","lernziel":"5.3.4-B2","niveau":"M","afb":1,"kompetenz":["modellieren"],"format":"auswahl","text":"Welcher Rechenausdruck passt? „Addiere zur Differenz von 90 und 45 die Zahl 25.“","mehrfach":false,"optionen":[{"text":"90 − (45 + 25)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"(90 − 45) + 25","richtig":true},{"text":"25 − (90 − 45)","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"(90 + 45) − 25","richtig":false,"fehlvorstellung":"begriffe-verwechselt"}],"hilfen":{"tipp":"Bilde zuerst die Differenz. Danach wird addiert.","loesungsschritt":"Die Differenz von 90 und 45 ist 90 − 45."},"nachweis":["(90 − 45) + 25 = 70"]},{"id":"5.3.4-B2-M-05","lernziel":"5.3.4-B2","niveau":"M","afb":2,"kompetenz":["modellieren"],"format":"sachaufgabe","text":"Sara hat 80 € gespart und kauft einen Rucksack für 35 € und eine Trinkflasche für 18 €. Zur Situation passt der Rechenausdruck 80 − (35 + 18).","teile":[{"format":"zahl","text":"Berechne den Wert der Klammer. Er gibt an, wie viel zusammen ausgegeben wird.","loesung":53,"einheit":"€","typischeFehler":[]},{"format":"zahl","text":"Berechne das Restgeld.","loesung":27,"einheit":"€","typischeFehler":[{"wert":63,"fehlvorstellung":"klammer-ignoriert"}]}],"hilfen":{"tipp":"Die Klammer fasst beide Preise zusammen.","loesungsschritt":"35 + 18 = 53."},"nachweis":["35 + 18 = 53","80 − (35 + 18) = 27"]},{"id":"5.3.4-B2-M-06","lernziel":"5.3.4-B2","niveau":"M","afb":3,"kompetenz":["argumentieren","modellieren"],"format":"auswahl","text":"Von 80 € werden erst 33 € und dann 18 € ausgegeben. Ida schreibt 80 − 33 − 18, Ben schreibt 80 − (33 + 18). Beurteile die beiden Rechenausdrücke.","mehrfach":false,"optionen":[{"text":"Beide passen. Sie haben denselben Wert 29: Einmal werden die Beträge nacheinander abgezogen, einmal zusammen.","richtig":true},{"text":"Nur der Ausdruck von Ida passt. Eine Klammer verändert das Ergebnis.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur der Ausdruck von Ben passt. Ohne Klammer wird 18 addiert.","richtig":false,"fehlvorstellung":"sub-klammerfehler"},{"text":"Keiner von beiden passt. Hier muss addiert werden.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Berechne beide Rechenausdrücke und vergleiche.","loesungsschritt":"80 − 33 − 18 = 29."},"nachweis":["80 − 33 − 18 = 29","80 − (33 + 18) = 29"]},{"id":"5.3.4-B2-E-01","lernziel":"5.3.4-B2","niveau":"E","afb":1,"kompetenz":["modellieren"],"format":"auswahl","text":"Welcher Term passt? „Subtrahiere von 1000 die Summe aus 250 und der Differenz von 400 und 160.“","mehrfach":false,"optionen":[{"text":"1000 − 250 + (400 − 160)","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"(1000 − 250) + 400 − 160","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"1000 − [(250 + 400) − 160]","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"1000 − [250 + (400 − 160)]","richtig":true},{"text":"[1000 − (250 + 400)] − 160","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Baue den Term von innen nach außen: zuerst die Differenz, dann die Summe, dann die Subtraktion von 1000."},"nachweis":["1000 − [250 + (400 − 160)] = 510"]},{"id":"5.3.4-B2-E-02","lernziel":"5.3.4-B2","niveau":"E","afb":2,"kompetenz":["modellieren"],"format":"zahl","text":"Eine Klasse hat 30 Plätze im Bus reserviert. Angemeldet sind 28 Kinder. 3 Kinder sind krank, 3 Begleitpersonen kommen dazu. Stelle einen Term auf und berechne, wie viele Plätze frei bleiben.","loesung":2,"typischeFehler":[{"wert":5,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne zuerst in einer Klammer, wie viele Personen tatsächlich mitfahren."},"nachweis":["28 − 3 + 3 = 28","30 − (28 − 3 + 3) = 2"]},{"id":"5.3.4-B2-E-03","lernziel":"5.3.4-B2","niveau":"E","afb":2,"kompetenz":["modellieren"],"format":"auswahl","text":"Welcher Text passt zum Term 300 − (130 − 20)?","mehrfach":false,"optionen":[{"text":"In einem Saal sitzen 300 Gäste. Erst gehen 130, dann gehen 20. Gesucht sind die übrigen Gäste.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Ein Saal hat 300 Plätze. Erst kommen 130 Gäste, dann noch 20. Gesucht sind die freien Plätze.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Ein Saal hat 300 Plätze. 130 Karten wurden verkauft, 20 davon wurden zurückgegeben. Gesucht sind die freien Plätze.","richtig":true},{"text":"In einem Saal sitzen 130 Gäste. 20 gehen, 300 kommen dazu. Gesucht sind alle Gäste.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"Ein Saal hat 300 Plätze. 130 Gäste kommen, 20 Stühle werden weggeräumt. Gesucht sind die freien Plätze.","richtig":false,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Die Klammer beschreibt, wie viele Plätze tatsächlich besetzt sind."},"nachweis":["300 − (130 − 20) = 190"]},{"id":"5.3.4-B2-E-04","lernziel":"5.3.4-B2","niveau":"E","afb":3,"kompetenz":["modellieren"],"format":"auswahl","text":"Für welche Zahlen im Kästchen haben die Terme 100 − (▢ + 20) und 100 − ▢ − 20 denselben Wert? Stelle die Regel auf.","mehrfach":false,"optionen":[{"text":"Nur für die Zahl 0.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur für die Zahl 20.","richtig":false},{"text":"Für keine Zahl: Eine Klammer verändert immer den Wert.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur für gerade Zahlen.","richtig":false},{"text":"Für jede Zahl von 0 bis 80: Beide Terme subtrahieren insgesamt die Zahl und 20.","richtig":true}],"hilfen":{"tipp":"Setze mehrere Zahlen ein, zum Beispiel 10, 35 und 80, und vergleiche die Werte."},"nachweis":["100 − (10 + 20) = 70","100 − 10 − 20 = 70","100 − (35 + 20) = 45","100 − 35 − 20 = 45","100 − (80 + 20) = 0","100 − 80 − 20 = 0"]},{"id":"5.3.4-B2-E-05","lernziel":"5.3.4-B2","niveau":"E","afb":2,"kompetenz":["modellieren"],"format":"zahl","text":"Mia ist 12 Jahre alt und hat 50 €. Mia kauft 3 Hefte für je 5 € und einen Füller für 9 €. Stelle einen Term auf und berechne das Restgeld.","loesung":26,"typischeFehler":[{"wert":36,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":14,"fehlvorstellung":"sach-unnoetige-angabe"}],"hilfen":{"tipp":"Nicht jede Angabe wird gebraucht. Die Klammer fasst alle Ausgaben zusammen."},"einheit":"€","nachweis":[{"zahl":12,"grund":"überflüssige Angabe"},"3 · 5 + 9 = 24","50 − (3 · 5 + 9) = 26"]},{"id":"5.3.4-B2-E-06","lernziel":"5.3.4-B2","niveau":"E","afb":3,"kompetenz":["modellieren"],"format":"auswahl","text":"In 60 − 20 − 10 + 5 soll genau ein Klammerpaar gesetzt werden, sodass der Wert 45 herauskommt. Welcher Term erfüllt das?","mehrfach":false,"optionen":[{"text":"(60 − 20) − 10 + 5","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"60 − (20 − 10 + 5)","richtig":true},{"text":"60 − (20 + 10) + 5","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"60 − 20 − (10 + 5)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"60 − (20 − 10) + 5","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Berechne jeden Term. Achte auf die Rechenzeichen innerhalb der Klammer."},"nachweis":[{"art":"wert","wert":45},"60 − (20 − 10 + 5) = 45"]},{"id":"5.3.5-R1-F-01","lernziel":"5.3.5-R1","niveau":"F","afb":1,"kompetenz":["symbolisch"],"format":"luecken","text":"3 + 8 = 11\nTausche die Zahlen.\n8 + 3 = {{a}}","luecken":{"a":{"loesung":11,"typischeFehler":[]}},"hilfen":{"tipp":"Beim Plus-Rechnen darfst du die Zahlen tauschen. Das Ergebnis bleibt gleich.","beispiel":"2 + 7 1-F-05","lernziel":"5.3.5-R1","niveau":"F","afb":2,"kompetenz":["probleme-loesen"],"format":"auswahl","text":"Welche 2 Aufgaben haben dasselbe Ergebnis?","mehrfach":false,"optionen":[{"text":"8 + 2 und 8 − 2","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"8 + 2 und 2 + 8","richtig":true},{"text":"8 + 2 und 8 + 8","richtig":false}],"hilfen":{"tipp":"Tauschaufgaben haben dasselbe Ergebnis.","beispiel":"5 + 3 und 3 + 5 haben beide das Ergebnis 8.","loesungsschritt":"Suche die Aufgabe mit denselben Zahlen und einem Plus."},"bild":{"art":"mengenbild","anzahl":8,"dazu":2},"nachweis":[{"art":"gleicheWerte"},"8 + 2 = 10","2 + 8 = 10","8 − 2 = 6","8 + 8 = 16"]},{"id":"5.3.5-R1-F-06","lernziel":"5.3.5-R1","niveau":"F","afb":1,"kompetenz":["symbolisch"],"format":"zahl","text":"30 + 40 = 70\nWie viel ist 40 + 30?","loesung":70,"typischeFehler":[{"wert":10,"fehlvorstellung":"add-subtrahiert"}],"hilfen":{"tipp":"Das ist die Tauschaufgabe. Das Ergebnis bleibt gleich.","beispiel":"10 + 40 = 50. Also ist auch 40 + 10 = 50.","loesungsschritt":"Die Sprünge im Bild sind dieselben. Du landest bei 70."},"bild":{"art":"zahlenstrahl","von":0,"bis":100,"schritt":10,"beschriftung":10,"start":0,"spruenge":[{"von":0,"nach":40,"text":"+ 40"},{"von":40,"nach":70,"text":"+ 30"}]},"nachweis":["30 + 40 = 70","40 + 30 = 70"]},{"id":"5.3.5-R1-G-01","lernziel":"5.3.5-R1","niveau":"G","afb":1,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welches Gesetz siehst du?\n15 + 46 = 46 + 15","mehrfach":false,"optionen":[{"text":"Vertauschungsgesetz","richtig":true},{"text":"Verbindungsgesetz","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Kein Gesetz.\nDie Rechnung ist falsch.","richtig":false}],"hilfen":{"tipp":"Schau genau: Haben die Zahlen den Platz getauscht?","beispiel":"5 + 9 = 9 + 5: Die Zahlen sind vertauscht. Das ist das Vertauschungsgesetz.","loesungsschritt":"15 und 46 haben den Platz getauscht."},"nachweis":["15 + 46 = 61","46 + 15 = 61"]},{"id":"5.3.5-R1-G-02","lernziel":"5.3.5-R1","niveau":"G","afb":1,"kompetenz":["symbolisch"],"format":"luecken","text":"Die Klammer wandert.\nDie Zahlen bleiben gleich.\n(14 + 21) + 4 = 14 + (21 + {{a}})","luecken":{"a":{"loesung":4,"typischeFehler":[]}},"hilfen":{"tipp":"Beim Verbindungsgesetz bleibt die Reihenfolge der Zahlen gleich.","beispiel":"(4 + 7) + 3 = 4 + (7 + 3).","loesungsschritt":"Links stehen 14, 21 und 4. Rechts fehlt die letzte Zahl."},"bild":{"art":"streifen","ganz":{"wert":39,"frage":true},"teile":[14,21,4]},"nachweis":["(14 + 21) + 4 = 39","14 + (21 + 4) = 39"]},{"id":"5.3.5-R1-G-03","lernziel":"5.3.5-R1","niveau":"G","afb":2,"kompetenz":["symbolisch"],"format":"luecken","text":"Rechne auf 2 Wegen.\n(11 + 3) + 7 = {{a}}\n11 + (3 + 7) = {{b}}","luecken":{"a":{"loesung":21,"typischeFehler":[]},"b":{"loesung":21,"typischeFehler":[]}},"hilfen":{"tipp":"Rechne immer zuerst die Klammer aus.","beispiel":"(12 + 9) + 1 = 21 + 1 = 22. Und 12 + (9 + 1) = 12 + 10 = 22.","loesungsschritt":"Zweiter Weg: 3 + 7 = 10. Dann 11 + 10."},"bild":{"art":"streifen","ganz":{"wert":21,"frage":true},"teile":[11,3,7]},"nachweis":["(11 + 3) + 7 = 21","11 + (3 + 7) = 21"]},{"id":"5.3.5-R1-G-04","lernziel":"5.3.5-R1","niveau":"G","afb":1,"kompetenz":["symbolisch"],"format":"auswahl","text":"Wo darfst du die Zahlen tauschen?","mehrfach":false,"optionen":[{"text":"Bei beiden Aufgaben","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Bei 40 − 23","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Bei 40 + 23","richtig":true}],"hilfen":{"tipp":"Das Vertauschungsgesetz gilt nur beim Addieren.","beispiel":"8 + 3 = 3 + 8. Aber 8 − 3 ist nicht 3 − 8.","loesungsschritt":"Suche die Aufgabe mit dem Plus."}},{"id":"5.3.5-R1-G-05","lernziel":"5.3.5-R1","niveau":"G","afb":2,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welche Rechnung hat dasselbe Ergebnis?\n34 + (16 + 5)","mehrfach":false,"optionen":[{"text":"34 − (16 + 5)","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"(34 + 16) − 5","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"(34 + 16) + 5","richtig":true}],"hilfen":{"tipp":"Beim Addieren darfst du die Klammer versetzen.","beispiel":"5 + (4 + 6) = (5 + 4) + 6.","loesungsschritt":"Suche die Rechnung mit denselben Zahlen und 2-mal Plus."},"bild":{"art":"streifen","ganz":{"wert":55,"frage":true},"teile":[34,16,5]},"nachweis":[{"art":"wert","wert":55},"34 + (16 + 5) = 55","(34 + 16) + 5 = 55"]},{"id":"5.3.5-R1-G-06","lernziel":"5.3.5-R1","niveau":"G","afb":3,"kompetenz":["argumentieren"],"format":"auswahl","text":"Lena sagt:\n20 − 9 − 3 ist dasselbe wie 20 − (9 − 3).\nStimmt das?","mehrfach":false,"optionen":[{"text":"Stimmt.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch.\nLinks kommt 8 heraus.\nRechts kommt 14 heraus.","richtig":true},{"text":"Falsch.\nLinks kommt 14 heraus.\nRechts kommt 8 heraus.","richtig":false,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Rechne beide Seiten aus. Die Klammer kommt zuerst.","beispiel":"10 − 4 − 2 = 4. Aber 10 − (4 − 2) = 10 − 2 = 8.","loesungsschritt":"Rechts: Klammer 9 − 3 = 6. Dann 20 − 6."},"nachweis":[{"art":"urteil","stimmt":false},"20 − 9 − 3 = 8","20 − (9 − 3) = 14"]},{"id":"5.3.5-R1-M-01","lernziel":"5.3.5-R1","niveau":"M","afb":1,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welches Rechengesetz wurde angewendet? (132 + 72) + 28 = 132 + (72 + 28)","mehrfach":false,"optionen":[{"text":"Verbindungsgesetz","richtig":true},{"text":"Vertauschungsgesetz","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Vertauschungsgesetz und Verbindungsgesetz zugleich","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Kein Rechengesetz. Die Gleichung ist falsch.","richtig":false}],"hilfen":{"tipp":"Vergleiche beide Seiten: Hat sich die Reihenfolge der Zahlen geändert oder nur die Klammer?","loesungsschritt":"Die Reihenfolge der Zahlen ist gleich geblieben. Nur die Klammer steht an einer anderen Stelle."},"nachweis":["(132 + 72) + 28 = 232","132 + (72 + 28) = 232"]},{"id":"5.3.5-R1-M-02","lernziel":"5.3.5-R1","niveau":"M","afb":2,"kompetenz":["probleme-loesen"],"format":"auswahl","text":"Welche Gleichungen stimmen? Wähle alle richtigen aus.","mehrfach":true,"optionen":[{"text":"42 + 57 = 57 + 42","richtig":true},{"text":"42 + 57 = 42 + 75","richtig":false,"fehlvorstellung":"stellenwert"},{"text":"(42 + 57) + 43 = 42 + (57 + 43)","richtig":true},{"text":"(90 − 40) − 10 = 90 − (40 − 10)","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Bei der Addition darfst du vertauschen und Klammern versetzen. Prüfe die übrigen Gleichungen durch Ausrechnen.","loesungsschritt":"(90 − 40) − 10 = 40, aber 90 − (40 − 10) = 60."},"nachweis":[{"art":"gleichungen"},"(90 − 40) − 10 = 40","90 − (40 − 10) = 60"]},{"id":"5.3.5-R1-M-03","lernziel":"5.3.5-R1","niveau":"M","afb":2,"kompetenz":["symbolisch"],"format":"luecken","text":"Nutze das Verbindungsgesetz und fülle die Lücken: (41 + 83) + 17 = 41 + (83 + {{a}}) = 41 + {{b}} = {{c}}","luecken":{"a":{"loesung":17,"typischeFehler":[]},"b":{"loesung":100,"typischeFehler":[]},"c":{"loesung":141,"typischeFehler":[]}},"hilfen":{"tipp":"Die Klammer wandert zu den beiden Zahlen, die sich zu 100 ergänzen.","loesungsschritt":"83 + 17 = 100."},"nachweis":["83 + 17 = 100","41 + 100 = 141","(41 + 83) + 17 = 141"]},{"id":"5.3.5-R1-M-04","lernziel":"5.3.5-R1","niveau":"M","afb":1,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welche Gleichung zeigt das Vertauschungsgesetz?","mehrfach":false,"optionen":[{"text":"(61 + 31) + 5 = 61 + (31 + 5)","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"61 + 31 = 31 + 61","richtig":true},{"text":"61 + 31 = 92","richtig":false},{"text":"61 − 31 = 31 − 61","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Beim Vertauschungsgesetz tauschen die Summanden den Platz.","loesungsschritt":"Suche die Gleichung, in der auf beiden Seiten dieselben zwei Summanden in getauschter Reihenfolge stehen."},"nachweis":["61 + 31 = 31 + 61"]},{"id":"5.3.5-R1-M-05","lernziel":"5.3.5-R1","niveau":"M","afb":2,"kompetenz":["symbolisch"],"format":"luecken","text":"Zeige mit einem Beispiel, dass das Verbindungsgesetz für die Subtraktion nicht gilt. (70 − 20) − 15 = {{a}} und 70 − (20 − 15) = {{b}}","luecken":{"a":{"loesung":35,"typischeFehler":[{"wert":65,"fehlvorstellung":"klammer-ignoriert"}]},"b":{"loesung":65,"typischeFehler":[{"wert":35,"fehlvorstellung":"klammer-ignoriert"}]}},"hilfen":{"tipp":"Berechne in beiden Rechenausdrücken zuerst die Klammer.","loesungsschritt":"70 − 20 = 50 und 20 − 15 = 5."},"nachweis":["(70 − 20) − 15 = 35","70 − (20 − 15) = 65"]},{"id":"5.3.5-R1-M-06","lernziel":"5.3.5-R1","niveau":"M","afb":3,"kompetenz":["argumentieren"],"format":"auswahl","text":"Mara behauptet: „Das Vertauschungsgesetz gilt auch für die Subtraktion.“ Welche Begründung ist richtig?","mehrfach":false,"optionen":[{"text":"Richtig. Die Rechengesetze gelten für alle Rechenarten.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch. Ein Gegenbeispiel genügt: 12 − 6 = 6, aber 6 − 12 ist keine natürliche Zahl.","richtig":true},{"text":"Richtig, denn 12 − 6 und 6 − 12 haben dasselbe Ergebnis.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch. Das Vertauschungsgesetz gilt für keine Rechenart.","richtig":false}],"hilfen":{"tipp":"Prüfe die Behauptung an einem Beispiel: Vertausche Minuend und Subtrahend.","loesungsschritt":"12 − 6 = 6. Bei 6 − 12 ist der Subtrahend größer als der Minuend."},"nachweis":[{"art":"urteil","stimmt":false},"12 − 6 = 6"]},{"id":"5.3.5-R1-E-01","lernziel":"5.3.5-R1","niveau":"E","afb":1,"kompetenz":["symbolisch"],"format":"auswahl","text":"Welche Gleichung beschreibt das Verbindungsgesetz der Addition allgemein?","mehrfach":false,"optionen":[{"text":"a + (b + c) = (a + b) · c","richtig":false},{"text":"a + b = b + a","richtig":false,"f   /* Pergament als Fl\xE4che, Tinte f\xFCr Wege und Schrift (ADR 0010). --nacht ist die dunkle Tinte f\xFCr Kn\xF6pfe und \xDCberschriften. */
  --nacht: #3a3029; --gold: #b8892b; --papier: #efe6d2; --karte: #fbf7ec; --tinte: #2e2822; --grau: #6b5f50;
  --rand: #d8cbb0; --gut: #3e6b3a; --gut-hell: #e6eedb; --schlecht: #9e2f28; --schlecht-hell: #f6e2dc; --hell: #f8efd6; --siegel: #a3302a;
  --schrift-titel: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  font: 17px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--tinte);
  background: var(--papier); min-height: 100vh;
}
body { margin: 0; background: #efe6d2; }
#mathekingdom *, #mathekingdom *::before { box-sizing: border-box; }
#mathekingdom main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 60px; }
#mathekingdom h1 { font-family: var(--schrift-titel); font-size: 1.85rem; font-weight: 700; margin: 0 0 4px; color: var(--nacht); text-wrap: balance; }
#mathekingdom h2 { font-family: var(--schrift-titel); font-size: 1.22rem; margin: 22px 0 10px; color: var(--nacht); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#mathekingdom p { margin: 0 0 12px; }
#mathekingdom .unter { color: var(--grau); margin-bottom: 18px; }
#mathekingdom .klein { font-size: .88rem; color: var(--grau); }
#mathekingdom .fehler { color: var(--schlecht); font-weight: 600; }
#mathekingdom .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; padding: 20px; box-shadow: 0 1px 2px rgba(58,48,41,.08); }

#mathekingdom button, #mathekingdom input, #mathekingdom select { font: inherit; color: inherit; }
#mathekingdom button { white-space: nowrap; cursor: pointer; border-radius: 10px; border: 1px solid transparent; padding: 9px 16px; }
#mathekingdom button:disabled { cursor: not-allowed; opacity: .55; }
#mathekingdom button:focus-visible, #mathekingdom input:focus-visible, #mathekingdom select:focus-visible, #mathekingdom [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#mathekingdom .haupt { background: var(--nacht); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
#mathekingdom .haupt:hover:not(:disabled) { background: #54473c; }
#mathekingdom .schlicht { background: transparent; border-color: var(--rand); color: var(--nacht); display: inline-flex; align-items: center; gap: 4px; }
#mathekingdom .schlicht:hover:not(:disabled) { background: #f1e7cf; }
#mathekingdom input[type=text] { border: 2px solid #bfae8f; border-radius: 10px; padding: 8px 12px; background: #fff; font-variant-numeric: tabular-nums; }
#mathekingdom select { border: 2px solid #bfae8f; border-radius: 10px; padding: 8px 10px; background: #fff; }
#mathekingdom .marke { font-size: .78rem; font-weight: 600; background: var(--hell); color: #6e5110; border: 1px solid #e0c98c; border-radius: 99px; padding: 2px 10px; }
#mathekingdom .marke.gut { background: var(--gut-hell); color: var(--gut); border-color: #bccfa8; }

/* Kopf */
#mathekingdom .kopf { background: var(--karte); color: var(--tinte); display: flex; align-items: center; gap: 16px; padding: 8px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--rand); box-shadow: inset 0 -3px 0 #e3d6b8; }
#mathekingdom .wappenknopf { background: transparent; padding: 2px; border-radius: 8px; line-height: 0; }
#mathekingdom .wer { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; }
#mathekingdom .wer strong { font-family: var(--schrift-titel); font-size: 1.05rem; }
#mathekingdom .wer span { font-size: .85rem; color: var(--grau); }
#mathekingdom .konto { display: flex; gap: 10px; align-items: center; }
#mathekingdom .wert { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
#mathekingdom .siegelwert { background: #f6e2dc; color: #6e1c18; font-size: 1.05rem; }
#mathekingdom .siegelwert .wort { font-size: .82rem; }
#mathekingdom .klein-wert { font-size: .85rem; color: var(--grau); padding: 4px 6px; }
#mathekingdom .kopf nav { display: flex; gap: 6px; }
#mathekingdom .kopf nav button { background: transparent; color: var(--nacht); border-color: var(--rand); padding: 6px 14px; }
#mathekingdom .kopf nav button.aktiv { background: var(--nacht); color: #fff; }
#mathekingdom .speicher { flex-basis: 100%; font-size: .8rem; color: var(--grau); display: flex; gap: 12px; }
#mathekingdom .speicher.fehler { color: var(--schlecht); font-weight: 600; }
#mathekingdom .speicher .demo { color: #8a6a1c; }
#mathekingdom .hilfebanner, #mathekingdom .meldung { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: var(--hell); border-bottom: 1px solid #e0c98c; }

/* Anmeldung */
#mathekingdom .anmeldung { max-width: 460px; margin: 8vh auto 0; display: flex; flex-direction: column; gap: 10px; }
#mathekingdom .anmeldung label { font-weight: 600; }
#mathekingdom .anmeldung input { font-size: 1.4rem; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
#mathekingdom .anmeldung .haupt { justify-content: center; padding: 12px; }
#mathekingdom .anmeldung .schlicht { justify-content: center; border: 0; text-decoration: underline; }

/* Schlossgarten */
#mathekingdom .schlosskopf { text-align: center; margin: 4px 0 18px; }
#mathekingdom .schlossbild { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto 4px; }
#mathekingdom .schlosskopf .unter { max-width: 40em; margin: 0 auto 6px; }
#mathekingdom .regionen { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
#mathekingdom .region { white-space: normal; width: 100%; height: 100%; text-align: left; background: var(--karte); border: 1px solid var(--rand); border-radius: 12px; padding: 12px 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; min-height: 92px; }
#mathekingdom .region:hover:not(:disabled) { border-color: var(--nacht); background: #fffaf0; }
#mathekingdom .region .gartentor { grid-row: span 4; }
#mathekingdom .region .nummer { font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--grau); }
#mathekingdom .region .titel { font-family: var(--schrift-titel); font-weight: 700; font-size: 1.08rem; color: var(--nacht); }
#mathekingdom .region .marke { justify-self: start; }
#mathekingdom .region .stand { font-size: .88rem; color: var(--grau); }
/* Neu ge\xF6ffnetes Tor (ADR 0022): einmal ank\xFCndigen, kurz leuchten lassen. */
#mathekingdom .neues-tor { border-left: 5px solid #c79a2b; background: #fff6dc; }
#mathekingdom .region.neu { border-color: #c79a2b; box-shadow: 0 0 0 3px #f1dc9c; animation: torleuchten 1.6s ease-in-out 2; }
@keyframes torleuchten { 50% { box-shadow: 0 0 0 7px #f6e7b6; } }
@media (prefers-reduced-motion: reduce) { #mathekingdom .region.neu { animation: none; } }
#mathekingdom .weitere-tore { text-align: center; color: var(--grau); margin-top: 14px; font-style: italic; }

/* Regionskarte */
#mathekingdom .pfad { margin-bottom: 8px; }
#mathekingdom .kartenrahmen { background: #f6efdf; border: 1px solid var(--rand); border-radius: 10px; overflow: auto; padding: 6px 10px; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; }
#mathekingdom .regionskarte { display: block; margin: 0 auto; }
#mathekingdom .regionskarte .kartenrand { fill: none; stroke: #c9b994; stroke-width: 1.5; stroke-dasharray: 1 0; }
#mathekingdom .regionskarte .windrose { fill: #c9b994; stroke: #b3a27c; stroke-width: 1; opacity: .7; }
#mathekingdom .regionskarte .windrose circle { fill: none; }

  #mathekingdom .kopf { gap: 10px; padding: 8px 12px; }
  #mathekingdom .kopf nav { flex-basis: 100%; }
  #mathekingdom .kopf nav button { flex: 1; }
}

/* Kronen (ADR 0012) */
#mathekingdom .kronenwert { display: inline-flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; }
#mathekingdom .kronenwert .je { display: inline-flex; align-items: center; gap: 2px; }
#mathekingdom .kronenwert .je.null { opacity: .4; }
#mathekingdom .kronenwahl { margin: 12px 0; }
#mathekingdom .kronenwahl .wahl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
#mathekingdom .kronenwahl button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 6px 10px; border: 1.5px solid var(--rand); border-radius: 8px; background: #fbf6ea; color: var(--tinte); font: inherit; cursor: pointer; }
#mathekingdom .kronenwahl button[aria-pressed="true"] { border: 3px solid var(--nacht); background: #efe3c6; font-weight: 700; }
#mathekingdom .kronenwahl .ziel { font-size: .75rem; color: var(--grau); font-weight: 700; }
#mathekingdom .meinekrone { display: flex; align-items: center; gap: 8px; margin: 6px 0; }

/* R\xFCckblick und Expedition (ADR 0014) */
#mathekingdom .karte.rueckblick { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 6px solid #2f4f7f; }
#mathekingdom .karte.rueckblick h2, #mathekingdom .karte.expedition h2 { margin: .1rem 0 .3rem; }
#mathekingdom .karte.rueckblick p { margin: 0; }
#mathekingdom .marke.rueckblickmarke { background: #e3eaf4; color: #2f4f7f; border-color: #b7c7de; }
#mathekingdom .karte.expedition { border-left: 6px solid #9a6a1f; }
#mathekingdom .karte.expedition.geschafft { border-left-color: #3e6b3a; }
#mathekingdom .expeditionsbalken { height: 16px; border-radius: 8px; background: #ece3cf; border: 1px solid #c9b994; overflow: hidden; margin: .4rem 0; }
#mathekingdom .expeditionsbalken i { display: block; height: 100%; background: linear-gradient(90deg, #b9783e, #dcb24a); }
#mathekingdom .karte.expedition.geschafft .expeditionsbalken i { background: #3e6b3a; }
#mathekingdom .karte.expedition p { margin: .2rem 0; }

/* Sicherheitsangabe und Heftcheck (ADR 0014) */
#mathekingdom .sicherwahl { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .6rem; }
#mathekingdom button.haupt.hell { background: #f3ead6; color: var(--tinte); border: 2px solid #5b4632; }
#mathekingdom .hinweis.ueberraschung { border-left: 5px solid #7b2d43; font-weight: 600; }
#mathekingdom .heftcode { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
#mathekingdom .heftcode .code { font: 700 1.1rem var(--schrift-titel); border: 2px solid #5b4632; border-radius: 6px; padding: .1rem .5rem; background: #fffaf0; }
#mathekingdom .heftwahl { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; margin-top: .8rem; }
#mathekingdom .heftwahl button { font-size: 1.15rem; padding: .8rem; }
#mathekingdom .karte.heftcheck { border-left: 6px solid #5b4632; }
#mathekingdom .karte.heftcheck.richtig { border-left-color: #3e6b3a; }
#mathekingdom .karte.heftcheck.falsch { border-left-color: #a3302a; }

/* Einstiegscheck und Br\xFCcke (ADR 0014) */
#mathekingdom .karte.einstieg, #mathekingdom .karte.bruecke { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 6px solid #6b4f9e; }
#mathekingdom .karte.bruecke { border-left-color: #2e7d6b; }
#mathekingdom .karte.einstieg h2, #mathekingdom .karte.bruecke h2 { margin: .1rem 0 .3rem; }
#mathekingdom .karte.einstieg p, #mathekingdom .karte.bruecke p { margin: 0; max-width: 60ch; }
#mathekingdom .karte.einstieg .knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }
#mathekingdom .marke.einstiegmarke { background: #ece6f5; color: #4b3675; border-color: #cbbde3; }
#mathekingdom .marke.brueckenmarke { background: #e2f1ec; color: #1f5a4c; border-color: #b4d9cd; }
#mathekingdom .ergebnis.neutral { background: var(--hell); border-left: 5px solid #6b4f9e; }
#mathekingdom .vorschlag.bruecke { border-left: 5px solid #2e7d6b; margin-top: 10px; }

/* Fokus-Modus und Wegst\xFCck (ADR 0016) */
#mathekingdom .kopf.fokus { padding: 6px 18px; gap: 18px; }
#mathekingdom .kopf.fokus .zurueck { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid transparent; border-radius: 10px; line-height: 1.2; color: var(--nacht); font-size: .92rem; }
#mathekingdom .kopf.fokus .zurueck:hover { border-color: var(--rand); background: #f1e7cf; }
#mathekingdom .kopf.fokus .speicher { flex-basis: auto; margin-left: auto; }
#mathekingdom .kopf.fokus .speicher:empty { display: none; }
#mathekingdom .wegstueck-anzeige { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; font-size: .9rem; color: var(--grau); font-variant-numeric: tabular-nums; }
#mathekingdom .wegpunkte { display: inline-flex; gap: 6px; }
#mathekingdom .wegpunkte i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #b9ab90; background: transparent; }
#mathekingdom .wegpunkte i.voll { background: var(--gut); border-color: var(--gut); }
#mathekingdom .wegpunkte i.daneben { background: #e3d6b8; border-color: #c8b893; }
#mathekingdom .wegpunkte i.jetzt { border-color: var(--nacht); box-shadow: 0 0 0 2px #fbf7ec, 0 0 0 4px #c8b893; }
#mathekingdom .wegpunkte.gross { margin: 6px 0 14px; gap: 10px; }
#mathekingdom .wegpunkte.gross i { width: 26px; height: 26px; border-width: 3px; }
#mathekingdom .aufgabe .karte > .kaertchen { margin-top: 18px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
#mathekingdom .aufgabe .karte > .kaertchen .kaertchen-offen { grid-column: 1 / -1; }
#mathekingdom .kaertchen-zu.spaeter { opacity: .6; padding: 8px 12px; }
#mathekingdom .ergebnis h2 .lohn { font-family: "Segoe UI", system-ui, sans-serif; font-size: 1.05rem; color: var(--tinte); font-weight: 400; margin-left: 6px; }
#mathekingdom .ergebnis .knoepfe { display: flex; gap: 10px; flex-wrap: wrap; }
#mathekingdom .so-geht-es { display: grid; gap: 10px; width: 100%; }
#mathekingdom .moment { display: flex; align-items: center; gap: 14px; background: #fffaf0; border: 2px solid #e0c98c; border-radius: 12px; padding: 10px 16px 10px 10px; width: 100%; }
#mathekingdom .moment b { font-family: var(--schrift-titel); font-size: 1.15rem; color: var(--nacht); }
#mathekingdom .moment p { margin: 2px 0 0; }
#mathekingdom .wegstueck-ende { max-width: 620px; margin: 4vh auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#mathekingdom .wegstueck-ende .knoepfe { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
#mathekingdom .rast { display: flex; gap: 16px; align-items: center; text-align: left; background: #eef3ec; border: 1px solid #c4d3bf; border-radius: 12px; padding: 14px 18px; margin-top: 10px; }
#mathekingdom .rast .sanduhr { font-size: 2.6rem; line-height: 1; }
#mathekingdom .rast p { margin: 4px 0 0; }
#mathekingdom .rast .uhr { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  #mathekingdom .wegpunkte i.neu, #mathekingdom .aufgabe:has(.ergebnis.richtig) .aufgabenkopf .punkte i.voll:last-of-type { animation: mk-plopp .45s ease-out; }
  #mathekingdom .ergebnis.richtig .plus { display: inline-block; animation: mk-huepf .5s ease-out; }
  #mathekingdom .moment > svg, #mathekingdom .moment > :first-child { animation: mk-stempel .5s cubic-bezier(.2, 1.4, .4, 1); }
  #mathekingdom .rast .sanduhr { animation: mk-drehe 4s ease-in-out infinite; }
  @keyframes mk-plopp { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes mk-huepf { 0% { transform: translateY(6px); opacity: 0; } 60% { transform: translateY(-4px); opacity: 1; } 100% { transform: none; } }
  @keyframes mk-stempel { 0% { transform: scale(1.8) rotate(-12deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes mk-drehe { 0%, 40% { transform: rotate(0); } 50%, 90% { transform: rotate(180deg); } 100% { transform: rotate(360deg); } }
}

/* Lernen sichtbar machen (ADR 0017) */
#mathekingdom .ergebnis h2 .lernsatz { display: block; flex-basis: 100%; font-family: "Segoe UI", system-ui, sans-serif; font-size: .95rem; font-weight: 600; color: #1f6b43; margin-top: 4px; }
#mathekingdom .lernziele .fest { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 99px; font-size: .78rem; font-weight: 700; color: #4a3a00; background: #f5d76e; vertical-align: 1px; }
#mathekingdom .aha-neu { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 99px; background: #f5d76e; color: #4a3a00; font-size: .78rem; font-weight: 700; }
#mathekingdom .aha { margin: 16px 0; }
#mathekingdom .aha-liste { list-style: none; margin: 0; padding: 0; }
#mathekingdom .aha-liste li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid #e8dcc2; }
#mathekingdom .aha-liste li:first-child { border-top: 0; }
#mathekingdom .aha-liste .funke { color: #b8860b; font-size: 1.1rem; }
#mathekingdom .aha-liste small { display: block; color: #6b6255; margin-top: 2px; }
#mathekingdom .aha-liste .marke-neu { font-size: .75rem; font-weight: 700; color: #1f6b43; }

/* Sonderauftrag (ADR 0021): ein versiegelter Brief des K\xF6nigs, der oben hereingleitet */
#mathekingdom .brief { display: flex; gap: 16px; align-items: flex-start; max-width: 640px; margin: 12px auto 0; padding: 16px 20px; background: #fbf3dc;
  border: 1px solid #d9bf7a; border-radius: 6px; box-shadow: 0 6px 18px rgba(58, 48, 41, .18); position: relative; }
#mathekingdom .brief::before { content: ""; position: absolute; inset: 6px; border: 1px dashed #d9bf7a; border-radius: 4px; pointer-events: none; }
#mathekingdom .brief .briefsiegel { flex: none; }
#mathekingdom .brief h2 { margin: 2px 0 6px; font-family: var(--schrift-titel); }
#mathekingdom .brief p { margin: 4px 0; }
#mathekingdom .brief .briefsatz { font-style: italic; }
#mathekingdom .brief .knoepfe { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; position: relative; }
#mathekingdom .hilfebanner.brief-klein { background: #fbf3dc; border-bottom-color: #d9bf7a; }
#mathekingdom .briefzeichen { font-size: 1.4em; color: var(--siegel); }
#mathekingdom .marke.sonderauftragmarke { background: #fbf3dc; border-color: #d9bf7a; color: var(--siegel); }
@media (prefers-reduced-motion: no-preference) {
  #mathekingdom .brief.einflug { animation: mk-brief .7s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes mk-brief { from { opacity: 0; transform: translateY(-140%) rotate(-6deg); } 60% { opacity: 1; } to { transform: none; } }
}
/* Hoftitel in der Kopfzeile (ADR 0023) */
#mathekingdom .hoftitel-kopf { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; font-weight: 600; color: #7a5a12; }
/* Aufgabenkennung unten links (ADR 0025) */
#mathekingdom .kennung { position: fixed; left: 10px; bottom: 6px; margin: 0; font-size: 0.72rem; color: #9a9389; font-family: ui-monospace, Consolas, monospace; letter-spacing: 0.02em; pointer-events: none; z-index: 5; }
@media print { #mathekingdom .kennung { display: none; } }
/* ADR 0026: Siegel als Knopf, Meilensteine im Nebel, Seite \u201EDas kannst du schon\u201C */

#mathekingdom button.siegelwert:hover, #mathekingdom button.siegelwert.aktiv { box-shadow: 0 0 0 2px #6e1c18; }
#mathekingdom .regionskarte .meilenstein.imnebel { opacity: .55; }

#mathekingdom .seitenblick-satz { flex-basis: 100%; font-size: .9rem; color: #5b5246; }
#mathekingdom .koennen-meilenstein h3 { display: flex; align-items: center; gap: 8px; font-size: 1.02rem; margin: 14px 0 6px; }
#mathekingdom .koennen .lernziele .datum { margin-left: auto; color: #6f665a; white-space: nowrap; }
