<script>window.MK_POOLS = {"5":{"version":3,"klassenstufe":5,"quelle":"Bildungsplan 2016 Baden-Württemberg, Kapitelfolge nach Schnittpunkt 5 (Klett)","fehlvorstellungen":{"begriffe-verwechselt":{"beschreibung":"Verwechselt die Fachbegriffe der Rechenart.","hinweis":"Schau dir die Fachbegriffe noch einmal an: Welche Zahl steht wo?"},"sub-kleiner-von-groesser":{"beschreibung":"Zieht in jeder Stelle die kleinere von der größeren Ziffer ab, statt zu tauschen.","hinweis":"Achte auf die Reihenfolge: Es wird immer die untere von der oberen Ziffer abgezogen. Geht das nicht, musst du tauschen."},"sub-uebertrag-vergessen":{"beschreibung":"Tauscht richtig, berücksichtigt den Übertrag in der nächsten Stelle aber nicht.","hinweis":"Schau dir deine Überträge noch einmal an. Hast du sie in der nächsten Stelle mitgerechnet?"},"sub-addiert":{"beschreibung":"Addiert, statt zu subtrahieren.","hinweis":"Schau auf das Rechenzeichen: Hier wird abgezogen."},"sub-klammerfehler":{"beschreibung":"Rechnet a − (b − c) statt a − b − c: Der zweite Subtrahend wird addiert.","hinweis":"Jede Zahl hinter einem Minus wird abgezogen. Prüfe, ob du eine davon addiert hast."},"add-uebertrag-vergessen":{"beschreibung":"Addiert stellenweise, berücksichtigt den Übertrag aber nicht.","hinweis":"Schau dir deine Überträge noch einmal an. Hast du sie in der nächsten Stelle mitgerechnet?"},"add-subtrahiert":{"beschreibung":"Subtrahiert, statt zu addieren.","hinweis":"Schau auf das Rechenzeichen: Hier wird addiert."},"stellenwert":{"beschreibung":"Verwechselt Stellenwerte (Einer, Zehner, Hunderter).","hinweis":"Prüfe die Stellen: Welche Ziffer steht bei den Einern, welche bei den Zehnern?"},"kopf-stellenwert":{"beschreibung":"Verrechnet sich beim Kopfrechnen um eine Stelle.","hinweis":"Prüfe die Stellen: Rechnest du mit Einern, Zehnern oder Hundertern?"},"ergaenzen-zu-viel":{"beschreibung":"Ergänzt jede Stelle einzeln bis zur vollen Zehn und erhält dadurch zu viel.","hinweis":"Nur die Einer werden bis 10 ergänzt. Alle anderen Stellen ergänzt du bis 9."},"geschickt-nicht-ausgeglichen":{"beschreibung":"Rechnet mit der glatten Nachbarzahl, gleicht danach aber nicht aus.","hinweis":"Du hast mit einer glatten Zahl gerechnet. Jetzt musst du noch ausgleichen."},"geschickt-falsch-ausgeglichen":{"beschreibung":"Gleicht nach dem Rechnen mit der glatten Nachbarzahl in die falsche Richtung aus.","hinweis":"Überlege: Hast du zu viel oder zu wenig gerechnet? In welche Richtung musst du ausgleichen?"},"ueberschlag-nicht-gerundet":{"beschreibung":"Rechnet genau, statt mit gerundeten Zahlen zu überschlagen.","hinweis":"Du hast genau gerechnet. Beim Überschlag rundest du zuerst und rechnest dann."},"falsch-gerundet":{"beschreibung":"Rundet immer ab, statt nach der Rundungsregel zu runden.","hinweis":"Prüfe dein Runden: Bei 5, 6, 7, 8 und 9 wird aufgerundet."},"probe-falsche-umkehr":{"beschreibung":"Wählt für die Probe nicht die Umkehraufgabe.","hinweis":"Die Probe macht die Rechnung rückgängig. Sie muss wieder zur ersten Zahl der Aufgabe führen."},"klammer-ignoriert":{"beschreibung":"Rechnet von links nach rechts und beachtet die Klammer nicht.","hinweis":"Was in der Klammer steht, wird zuerst berechnet."},"klammer-falsch-gesetzt":{"beschreibung":"Setzt die Klammer an die falsche Stelle.","hinweis":"Lies genau: Was soll zuerst zusammengefasst werden? Das gehört in die Klammer."},"gesetz-auf-subtraktion":{"beschreibung":"Überträgt das Vertauschungs- oder Verbindungsgesetz auf die Subtraktion.","hinweis":"Die beiden Gesetze gelten nur für die Addition. Rechne beide Seiten aus."},"div-null-vergessen":{"beschreibung":"Lässt eine Null im Quotienten aus.","hinweis":"Passt der Divisor einmal nicht hinein, gehört an diese Stelle eine 0 ins Ergebnis."},"div-stellenwert":{"beschreibung":"Irrt sich beim Stellenwert des Quotienten (eine Null zu viel oder zu wenig).","hinweis":"Prüfe mit einem Überschlag, wie viele Stellen dein Ergebnis haben muss."},"div-rest-nicht-gedeutet":{"beschreibung":"Berechnet den Quotienten richtig, deutet den Rest aber nicht im Sachzusammenhang.","hinweis":"Deine Rechnung stimmt. Überlege jetzt, was mit dem Rest in dieser Situation passiert."},"div-rest-vergessen":{"beschreibung":"Gibt den Rest nicht oder falsch an.","hinweis":"Prüfe den Rest: Was bleibt übrig, wenn du Ergebnis mal Divisor vom Dividenden abziehst?"},"div-vertauscht":{"beschreibung":"Vertauscht bei der Division die beiden Zahlen.","hinweis":"Beim Teilen darfst du die Zahlen nicht tauschen. Die erste Zahl wird geteilt."},"div-falsche-rechenart":{"beschreibung":"Wählt statt der Division eine andere Rechenart.","hinweis":"Überlege: Wird hier gerecht verteilt oder in gleiche Gruppen aufgeteilt? Dann wird geteilt."},"div-rest-zu-gross":{"beschreibung":"Lässt einen Rest stehen, der so groß wie der Divisor oder größer ist.","hinweis":"Der Rest muss kleiner sein als die Zahl, durch die du teilst. Passt sie noch einmal hinein?"},"div-einmaleins":{"beschreibung":"Irrt sich im kleinen Einmaleins.","hinweis":"Prüfe mit der Mal-Aufgabe: Ergebnis mal die zweite Zahl muss die erste Zahl ergeben."},"teilbar-summe":{"beschreibung":"Erkennt nicht, dass die Summe zweier Vielfacher wieder ein Vielfaches ist.","hinweis":"Zerlege in Päckchen: Was passiert, wenn du zu vollen Päckchen weitere volle Päckchen legst?"},"1x1-nachbar":{"beschreibung":"Irrt sich im Einmaleins um eine Reihe (Ergebnis der Nachbaraufgabe).","hinweis":"Geh von einer Kernaufgabe aus, zum Beispiel 5 mal. Rechne dann eine Reihe weiter."},"1x1-addiert":{"beschreibung":"Addiert, statt zu multiplizieren.","hinweis":"Schau auf das Zeichen ·. Hier wird mal gerechnet, nicht plus."},"1x1-null":{"beschreibung":"Meint, eine Zahl mal 0 ergibt die Zahl selbst.","hinweis":"Stell dir 0 Päckchen vor. Wie viel ist dann darin?"},"div-durch-sich-selbst":{"beschreibung":"Meint, eine Zahl geteilt durch sich selbst ergibt 0.","hinweis":"Verteile 4 Äpfel an 4 Kinder. Wie viele bekommt jedes Kind?"},"sach-falsche-rechnung":{"beschreibung":"Wählt eine Rechnung, die nicht zur Situation passt.","hinweis":"Lies die Frage noch einmal: Kommt etwas dazu, oder geht etwas weg?"},"sach-unnoetige-angabe":{"beschreibung":"Verrechnet eine Angabe, die für die Frage nicht gebraucht wird.","hinweis":"Nicht jede Zahl im Text wird gebraucht. Welche Angaben gehören wirklich zur Frage?"},"sach-schritt-vergessen":{"beschreibung":"Führt nur einen von mehreren nötigen Rechenschritten aus.","hinweis":"Du bist noch nicht fertig: Es fehlt noch ein Rechenschritt."}},"kapitel":[{"id":"5.1","titel":"Daten und Diagramme","unterkapitel":[{"id":"5.1.1","titel":"Strichlisten und Häufigkeitstabellen","extra":false,"lernziele":[{"id":"5.1.1-L1","text":"Ich kann mit Strichlisten und Häufigkeitstabellen umgehen."}]},{"id":"5.1.2","titel":"Diagramme lesen","extra":false,"lernziele":[{"id":"5.1.2-L1","text":"Ich kann Informationen aus Diagrammen ablesen."}]},{"id":"5.1.3","titel":"Diagramme zeichnen","extra":false,"lernziele":[{"id":"5.1.3-L1","text":"Ich kann Diagramme anfertigen."}]},{"id":"5.1.4","titel":"Daten vergleichen","extra":false,"lernziele":[{"id":"5.1.4-L1","text":"Ich kann Daten miteinander vergleichen."}]},{"id":"5.1.5","titel":"Daten erheben","extra":false,"lernziele":[{"id":"5.1.5-L1","text":"Ich kann Daten erheben."}]}]},{"id":"5.2","titel":"Natürliche Zahlen","unterkapitel":[{"id":"5.2.1","titel":"Natürliche Zahlen","extra":false,"lernziele":[{"id":"5.2.1-L1","text":"Ich kann mit natürlichen Zahlen umgehen."}]},{"id":"5.2.2","titel":"Große Zahlen","extra":false,"lernziele":[{"id":"5.2.2-L1","text":"Ich kann mit großen Zahlen umgehen."}]},{"id":"5.2.3","titel":"Runden","extra":false,"lernziele":[{"id":"5.2.3-L1","text":"Ich kann Zahlen runden."}]},{"id":"5.2.4","titel":"Schätzen","extra":false,"lernziele":[{"id":"5.2.4-L1","text":"Ich kann eine Anzahl auf Bildern schätzen."}]},{"id":"5.2.5","titel":"Zweiersystem","extra":false,"lernziele":[{"id":"5.2.5-L1","text":"Ich kann Zahlen im Zweiersystem verwenden."}]},{"id":"5.2.X1","titel":"Römische Zahlzeichen","extra":true,"lernziele":[{"id":"5.2.X1-L1","text":"Ich kann römische Zahlzeichen verwenden."}]}]},{"id":"5.3","titel":"Addieren und Subtrahieren","unterkapitel":[{"id":"5.3.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.3.1-K1","text":"Ich kann im Kopf addieren.","grundlage":"Zerlegen und bis zum Zehner ergänzen, Zahlenraum bis 100"},{"id":"5.3.1-K2","text":"Ich kann im Kopf subtrahieren.","grundlage":"Wegnehmen und Ergänzen in Schritten bis 100"},{"id":"5.3.1-K3","text":"Ich kann beim Kopfrechnen geschickt vorgehen.","grundlage":"Zahlen, die zusammen 10 oder 100 ergeben"}],"merkzettel":{"regeln":["Rechne in Schritten: erst bis zum nächsten Zehner oder Hunderter, dann den Rest.","Liegt eine Zahl knapp neben einem Hunderter, rechne mit dem Hunderter und gleiche danach aus.","Suche Zahlen, die zusammen einen glatten Zehner oder Hunderter ergeben."],"beispiel":"67 + 48 = 67 + 3 + 45 = 115 und 83 − 27 = 83 − 3 − 24 = 56. Geschickt: 298 + 137 = 300 + 137 − 2 = 435.","heft":"Schreibe bei schwierigen Aufgaben deine Zwischenschritte auf."},"wortspeicher":[{"wort":"plus","ab":"F","erklaerung":"So liest du das Zeichen +. Es kommt etwas dazu."},{"wort":"minus","ab":"F","erklaerung":"So liest du das Zeichen −. Es geht etwas weg."},{"wort":"Zehner","ab":"F","erklaerung":"Zehn Einer sind ein Zehner. Die Zahl 34 hat 3 Zehner und 4 Einer."},{"wort":"Nachbarzehner","ab":"F","erklaerung":"Die glatte Zehnerzahl davor oder danach. Die Nachbarzehner von 34 sind 30 und 40."},{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 + 9 und 9 + 3 ergeben beide 12."},{"wort":"addieren","ab":"G","erklaerung":"Plus rechnen."},{"wort":"subtrahieren","ab":"G","erklaerung":"Minus rechnen."},{"wort":"ergänzen","ab":"G","erklaerung":"Ausrechnen, wie viel bis zu einer Zahl noch fehlt."},{"wort":"Rechenvorteil","ab":"M","erklaerung":"Ein geschickter Weg, der das Rechnen leichter macht."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zu 52 − 4 = 48 gehört 48 + 4 = 52."},{"wort":"Summand","ab":"E","erklaerung":"Eine Zahl, die addiert wird. Bei 34 + 12 sind 34 und 12 die Summanden."}]},{"id":"5.3.2","titel":"Addieren","extra":false,"lernziele":[{"id":"5.3.2-A1","text":"Ich kann die Fachbegriffe Summand und Summe verwenden.","grundlage":"Plus als „zusammen“ und „dazu“: Aufgabe und Bild zuordnen"},{"id":"5.3.2-A2","text":"Ich kann schriftlich addieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K1"],"grundlage":"Bündeln: 10 Einer sind 1 Zehner, dann Rechnen im Stellenraster"},{"id":"5.3.2-A3","text":"Ich kann mehrere Zahlen schriftlich addieren.","voraussetzungen":["5.3.2-A2"],"grundlage":"Drei Zahlen im Raster ohne Übertrag, passende Zehner zuerst"},{"id":"5.3.2-A4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.2-A2","5.3.1-K1"],"grundlage":"Nachbarzehner finden, Plus mit Minus rückgängig machen"},{"id":"5.3.2-A5","text":"Ich kann Sachaufgaben zur Addition lösen, auch mit Tabellen und Diagrammen.","voraussetzungen":["5.3.2-A2"],"grundlage":"Dazukommen und Zusammenlegen am Bild, Rechnung zuordnen"}],"merkzettel":{"regeln":["Summand + Summand = Summe. Bei 34 + 12 = 46 sind 34 und 12 die Summanden, 46 ist der Wert der Summe.","Schriftlich addieren: Schreibe stellengerecht untereinander, Einer unter Einer. Addiere von rechts nach links.","Ist das Ergebnis einer Spalte 10 oder größer, schreibst du den Übertrag klein in die nächste Spalte und rechnest ihn dort mit.","Überschlage vorher mit gerundeten Zahlen. Prüfe danach mit der Probe: Summe − Summand = anderer Summand."],"beispiel":"467 + 285: Einer 7 + 5 = 12, schreibe 2, Übertrag 1. Zehner 6 + 8 + 1 = 15, schreibe 5, Übertrag 1. Hunderter 4 + 2 + 1 = 7. Ergebnis 752.","heft":"Rechne schriftliche Aufgaben im Heft, ein Kästchen pro Ziffer."},"wortspeicher":[{"wort":"plus","ab":"F","erklaerung":"So liest du das Zeichen +. Es kommt etwas dazu."},{"wort":"zusammen","ab":"F","erklaerung":"Alles wird zusammengezählt."},{"wort":"Zehner","ab":"F","erklaerung":"Zehn Einer sind ein Zehner. Die Zahl 34 hat 3 Zehner und 4 Einer."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"addieren","ab":"G","erklaerung":"Plus rechnen."},{"wort":"Summand","ab":"G","erklaerung":"Eine Zahl, die addiert wird. Bei 34 + 12 sind 34 und 12 die Summanden."},{"wort":"Summe","ab":"G","erklaerung":"Das Ergebnis einer Plus-Aufgabe. Bei 34 + 12 = 46 ist 46 die Summe."},{"wort":"schriftlich addieren","ab":"G","erklaerung":"Die Zahlen stehen untereinander. Du rechnest Stelle für Stelle von rechts nach links."},{"wort":"Übertrag","ab":"G","erklaerung":"Der Zehner, den du in die nächste Spalte mitnimmst."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"runden","ab":"G","erklaerung":"Eine Zahl durch eine glatte Zahl in der Nähe ersetzen. Aus 48 wird 50."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst dein Ergebnis mit der Minus-Aufgabe. Zu 34 + 12 = 46 gehört 46 − 12 = 34."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Addition gehört die Subtraktion."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 34 + 12."}]},{"id":"5.3.3","titel":"Subtrahieren","extra":false,"lernziele":[{"id":"5.3.3-S1","text":"Ich kann die Fachbegriffe Minuend, Subtrahend und Differenz verwenden.","grundlage":"Minus als „wegnehmen“: Aufgabe und Bild zuordnen"},{"id":"5.3.3-S2","text":"Ich kann schriftlich subtrahieren, auch mit Übertrag.","voraussetzungen":["5.3.1-K2","5.3.2-A2"],"grundlage":"Entbündeln: 1 Zehner sind 10 Einer, dann Rechnen im Stellenraster"},{"id":"5.3.3-S3","text":"Ich kann mehrere Zahlen schriftlich subtrahieren.","voraussetzungen":["5.3.3-S2"],"grundlage":"Zweimal nacheinander wegnehmen"},{"id":"5.3.3-S4","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.3.3-S2","5.3.2-A4"],"grundlage":"Minus mit Plus rückgängig machen, Nachbarzehner"},{"id":"5.3.3-S5","text":"Ich kann Sachaufgaben zur Subtraktion lösen.","voraussetzungen":["5.3.3-S2"],"grundlage":"Wegnehmen am Bild, Rechnung und Geschichte zuordnen"}],"merkzettel":{"regeln":["Minuend − Subtrahend = Differenz. Bei 46 − 12 = 34 ist 46 der Minuend, 12 der Subtrahend, 34 der Wert der Differenz.","Schriftlich subtrahieren: Schreibe stellengerecht untereinander und beginne bei den Einern.","Ist die obere Ziffer zu klein, rechnest du mit 10 mehr und merkst dir den Übertrag 1 für die nächste Spalte.","Mehrere Subtrahenden kannst du zuerst addieren und ihre Summe dann abziehen.","Probe: Differenz + Subtrahend = Minuend."],"beispiel":"532 − 218: Einer 12 − 8 = 4, Übertrag 1. Zehner 3 − 1 − 1 = 1. Hunderter 5 − 2 = 3. Ergebnis 314. Probe: 314 + 218 = 532.","heft":"Rechne schriftliche Aufgaben im Heft und schreibe den Übertrag immer mit."},"wortspeicher":[{"wort":"minus","ab":"F","erklaerung":"So liest du das Zeichen −. Es geht etwas weg."},{"wort":"wegnehmen","ab":"F","erklaerung":"Etwas geht weg. Danach ist es weniger."},{"wort":"tauschen","ab":"F","erklaerung":"Du wechselst 1 Zehner in 10 Einer. Der Wert bleibt gleich."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"subtrahieren","ab":"G","erklaerung":"Minus rechnen."},{"wort":"Minuend","ab":"G","erklaerung":"Die Zahl, von der abgezogen wird. Bei 46 − 12 ist 46 der Minuend."},{"wort":"Subtrahend","ab":"G","erklaerung":"Die Zahl, die abgezogen wird. Bei 46 − 12 ist 12 der Subtrahend."},{"wort":"Differenz","ab":"G","erklaerung":"Das Ergebnis einer Minus-Aufgabe. Bei 46 − 12 = 34 ist 34 die Differenz."},{"wort":"schriftlich subtrahieren","ab":"G","erklaerung":"Die Zahlen stehen untereinander. Du rechnest Stelle für Stelle von rechts nach links."},{"wort":"Übertrag","ab":"G","erklaerung":"Die 1, die du dir für die nächste Spalte merkst."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst dein Ergebnis mit der Plus-Aufgabe. Zu 46 − 12 = 34 gehört 34 + 12 = 46."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Subtraktion gehört die Addition."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 46 − 12."}]},{"id":"5.3.4","titel":"Klammern","extra":false,"lernziele":[{"id":"5.3.4-B1","text":"Ich kann Rechenausdrücke mit Klammern berechnen.","voraussetzungen":["5.3.1-K1","5.3.1-K2"],"grundlage":"In zwei Schritten rechnen: erst zusammenfassen, dann weiter"},{"id":"5.3.4-B2","text":"Ich kann zu einem Text den passenden Rechenausdruck mit Klammern finden.","voraussetzungen":["5.3.4-B1"],"grundlage":"Geschichte mit zwei Schritten der passenden Rechnung zuordnen"}],"merkzettel":{"regeln":["Was in der Klammer steht, wird zuerst berechnet.","Ohne Klammern rechnest du bei Plus und Minus von links nach rechts.","Eine Klammer hinter einem Minus fasst zusammen, was insgesamt abgezogen wird."],"beispiel":"80 − (25 + 15) = 80 − 40 = 40. Ohne Klammer kommt etwas anderes heraus: 80 − 25 + 15 = 55 + 15 = 70.","heft":"Schreibe jeden Rechenschritt in eine neue Zeile und unterstreiche, was du als Nächstes rechnest."},"wortspeicher":[{"wort":"Klammer","ab":"F","erklaerung":"Die Zeichen ( und ). Was in der Klammer steht, rechnest du zuerst."},{"wort":"zuerst","ab":"F","erklaerung":"Das kommt als Erstes dran."},{"wort":"Rechenausdruck","ab":"G","erklaerung":"Eine Rechnung aus Zahlen, Rechenzeichen und Klammern, zum Beispiel 20 − (5 + 3)."},{"wort":"Summe","ab":"G","erklaerung":"Das Ergebnis einer Plus-Aufgabe."},{"wort":"Differenz","ab":"G","erklaerung":"Das Ergebnis einer Minus-Aufgabe."},{"wort":"Minusklammer","ab":"M","erklaerung":"Eine Klammer hinter einem Minus. Alles in ihr wird zusammen abgezogen."},{"wort":"Term","ab":"E","erklaerung":"Ein anderes Wort für Rechenausdruck."}]},{"id":"5.3.5","titel":"Rechengesetze","extra":false,"lernziele":[{"id":"5.3.5-R1","text":"Ich kann das Vertauschungsgesetz und das Verbindungsgesetz erkennen.","grundlage":"Tauschaufgaben wie 3 + 5 und 5 + 3"},{"id":"5.3.5-R2","text":"Ich kann mit den Rechengesetzen vorteilhaft rechnen.","voraussetzungen":["5.3.5-R1","5.3.1-K3"],"grundlage":"Passende Zehner suchen, zum Beispiel 7 + 5 + 3"}],"merkzettel":{"regeln":["Vertauschungsgesetz: Beim Addieren darfst du die Summanden vertauschen. 17 + 48 = 48 + 17.","Verbindungsgesetz: Beim Addieren darfst du Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52).","Beide Gesetze gelten nicht beim Subtrahieren: 9 − 4 ist nicht dasselbe wie 4 − 9.","Nutze die Gesetze, um zuerst die Zahlen zu addieren, die gut zusammenpassen."],"beispiel":"37 + 48 + 63 = 37 + 63 + 48 = 100 + 48 = 148.","heft":"Schreibe auf, wie du umgestellt hast, bevor du rechnest."},"wortspeicher":[{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 + 9 und 9 + 3 ergeben beide 12."},{"wort":"zusammen","ab":"F","erklaerung":"Alles wird zusammengezählt."},{"wort":"Vertauschungsgesetz","ab":"G","erklaerung":"Beim Addieren darfst du die Zahlen vertauschen. 17 + 48 = 48 + 17."},{"wort":"Verbindungsgesetz","ab":"G","erklaerung":"Beim Addieren darfst du die Klammern beliebig setzen. (17 + 48) + 52 = 17 + (48 + 52)."},{"wort":"Rechenvorteil","ab":"M","erklaerung":"Ein geschickter Weg, der das Rechnen leichter macht."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern."}]}]},{"id":"5.4","titel":"Multiplizieren und Dividieren","unterkapitel":[{"id":"5.4.1","titel":"Kopfrechnen","extra":false,"lernziele":[{"id":"5.4.1-K1","text":"Ich kann die Aufgaben des kleinen Einmaleins sicher lösen.","grundlage":"Mal-Aufgaben im Punktefeld sehen, Kernaufgaben mit 2, 5 und 10"},{"id":"5.4.1-K2","text":"Ich kann Geteilt-Aufgaben aus dem kleinen Einmaleins lösen.","voraussetzungen":["5.4.1-K1"],"grundlage":"Gerecht verteilen im Punktefeld, Mal-Aufgabe als Hilfe"},{"id":"5.4.1-K3","text":"Ich kann im Kopf multiplizieren und dividieren und dabei geschickt vorgehen."}],"merkzettel":{"regeln":["Kernaufgaben helfen: mal 1, mal 2, mal 5 und mal 10 kannst du schnell.","Schwere Aufgaben zerlegst du: 7 · 8 ist 5 · 8 und noch 2 · 8, also 40 + 16 = 56.","Nachbaraufgaben: Kennst du 6 · 8 = 48, dann ist 7 · 8 eine Acht mehr, also 56.","Tauschaufgaben haben dasselbe Ergebnis: 3 · 9 = 27 und 9 · 3 = 27.","Geteilt rechnest du mit der Mal-Aufgabe: 56 : 8 = 7, denn 7 · 8 = 56."],"beispiel":"63 : 9: Welche Zahl mal 9 ergibt 63? 5 · 9 = 45, 6 · 9 = 54, 7 · 9 = 63. Also 63 : 9 = 7.","heft":"Schreibe die Reihen, die du noch nicht sicher kannst, ins Heft und sage sie dir laut vor."},"wortspeicher":[{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen ·. 3 · 4 heißt: 3 Päckchen mit je 4."},{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen :. 12 : 3 heißt: 12 gerecht in 3 Teile."},{"wort":"Kernaufgabe","ab":"F","erklaerung":"Eine leichte Aufgabe mit 1, 2, 5 oder 10. Von ihr aus rechnest du weiter."},{"wort":"Tauschaufgabe","ab":"F","erklaerung":"Die Zahlen tauschen den Platz. 3 · 4 und 4 · 3 ergeben beide 12."},{"wort":"Nachbaraufgabe","ab":"G","erklaerung":"Eine Reihe mehr oder weniger. Zu 6 · 7 gehören 5 · 7 und 7 · 7."},{"wort":"Produkt","ab":"G","erklaerung":"Das Ergebnis einer Mal-Aufgabe. Bei 4 · 5 = 20 ist 20 das Produkt."},{"wort":"Probe","ab":"G","erklaerung":"Du prüfst eine Geteilt-Aufgabe mit der Mal-Aufgabe."},{"wort":"zerlegen","ab":"M","erklaerung":"Eine schwere Aufgabe in zwei leichte teilen. 7 · 6 ist 5 · 6 und 2 · 6."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zu 56 : 8 gehört 7 · 8."},{"wort":"Quadratzahl","ab":"E","erklaerung":"Eine Zahl mal sich selbst. 6 · 6 = 36, also ist 36 eine Quadratzahl."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 6 teilbar, wenn beim Teilen durch 6 kein Rest bleibt."}]},{"id":"5.4.2","titel":"Multiplizieren","extra":false,"lernziele":[{"id":"5.4.2-L1","text":"Ich kann Multiplikationsaufgaben berechnen."}]},{"id":"5.4.3","titel":"Rechenvorteile","extra":false,"lernziele":[{"id":"5.4.3-L1","text":"Ich kann Rechengesetze anwenden und somit Rechenvorteile nutzen."}]},{"id":"5.4.4","titel":"Potenzen","extra":false,"lernziele":[{"id":"5.4.4-L1","text":"Ich kann Potenzen berechnen."}]},{"id":"5.4.5","titel":"Dividieren","extra":false,"lernziele":[{"id":"5.4.5-D1","text":"Ich kann die Fachbegriffe Dividend, Divisor und Quotient verwenden.","grundlage":"Teilen als Verteilen und als Aufteilen in Gruppen"},{"id":"5.4.5-D2","text":"Ich kann schriftlich durch einstellige Zahlen dividieren.","voraussetzungen":["5.4.1-K2","5.4.5-D1","5.3.1-K2"],"grundlage":"Einmaleins rückwärts, dann mit Zehnerzahlen (12 : 3 und 120 : 3)"},{"id":"5.4.5-D3","text":"Ich kann schriftlich durch zweistellige Zahlen dividieren.","voraussetzungen":["5.4.5-D2","5.4.1-K1"],"grundlage":"Durch 10 teilen"},{"id":"5.4.5-D4","text":"Ich kann Divisionen mit Rest berechnen und den Rest deuten.","voraussetzungen":["5.4.5-D2","5.4.1-K2"],"grundlage":"Plättchen verteilen, einige bleiben übrig"},{"id":"5.4.5-D5","text":"Ich kann ein Ergebnis mit Überschlag und Probe prüfen.","voraussetzungen":["5.4.5-D2","5.3.2-A4"],"grundlage":"Geteilt mit Mal rückgängig machen"},{"id":"5.4.5-D6","text":"Ich kann Sachaufgaben zur Division lösen.","voraussetzungen":["5.4.5-D2","5.4.5-D4"],"grundlage":"Verteil- und Aufteil-Geschichten, Rechnung zuordnen"}],"merkzettel":{"regeln":["Dividend : Divisor = Quotient. Bei 48 : 6 = 8 ist 48 der Dividend, 6 der Divisor, 8 der Wert des Quotienten.","Schriftlich dividieren: Beginne links. Teile, multipliziere zurück, ziehe ab und hole die nächste Ziffer herunter.","Bleibt am Ende etwas übrig, ist das der Rest. Der Rest ist immer kleiner als der Divisor.","Probe: Quotient · Divisor, dazu der Rest, ergibt den Dividenden.","Durch 0 kann man nicht dividieren."],"beispiel":"952 : 4: 9 : 4 = 2 Rest 1. Dann 15 : 4 = 3 Rest 3. Dann 32 : 4 = 8. Ergebnis 238. Probe: 238 · 4 = 952.","heft":"Rechne schriftliche Divisionen im Heft und schreibe die Probe dazu."},"wortspeicher":[{"wort":"geteilt durch","ab":"F","erklaerung":"So liest du das Zeichen : vor. 12 : 3 heißt: 12 geteilt durch 3."},{"wort":"teilen","ab":"F","erklaerung":"Gerecht verteilen oder gleich große Gruppen bilden."},{"wort":"mal","ab":"F","erklaerung":"So liest du das Zeichen · vor. Mal ist das Gegenteil von geteilt."},{"wort":"Ergebnis","ab":"F","erklaerung":"Die Zahl hinter dem Zeichen =."},{"wort":"Probe","ab":"F","erklaerung":"Du prüfst dein Ergebnis mit der Mal-Aufgabe. Zu 12 : 3 = 4 gehört 4 · 3 = 12."},{"wort":"Rest","ab":"F","erklaerung":"Was beim Teilen übrig bleibt. 14 : 4 = 3 Rest 2."},{"wort":"Quotient","ab":"G","erklaerung":"Das Ergebnis einer Geteilt-Aufgabe. Bei 12 : 3 = 4 ist 4 der Quotient."},{"wort":"Überschlag","ab":"G","erklaerung":"Du rechnest mit runden Zahlen. So siehst du, wie groß das Ergebnis ungefähr ist."},{"wort":"schriftlich dividieren","ab":"G","erklaerung":"Schritt für Schritt teilen: teilen, malnehmen, abziehen, nächste Ziffer herunterholen."},{"wort":"Dividend","ab":"M","erklaerung":"Die Zahl, die geteilt wird. Bei 12 : 3 ist 12 der Dividend."},{"wort":"Divisor","ab":"M","erklaerung":"Die Zahl, durch die geteilt wird. Bei 12 : 3 ist 3 der Divisor."},{"wort":"Umkehraufgabe","ab":"M","erklaerung":"Die Rechnung, die eine andere rückgängig macht. Zur Division gehört die Multiplikation."},{"wort":"Term","ab":"E","erklaerung":"Ein Rechenausdruck aus Zahlen, Rechenzeichen und Klammern, zum Beispiel (12 + 8) : 4."},{"wort":"Wert","ab":"E","erklaerung":"Die Zahl, die herauskommt, wenn man einen Term ausrechnet."},{"wort":"teilbar","ab":"E","erklaerung":"Eine Zahl ist durch 7 teilbar, wenn beim Dividieren durch 7 kein Rest bleibt."},{"wort":"Vielfaches","ab":"E","erklaerung":"Die Vielfachen von 7 sind 7, 14, 21, 28 und so weiter."}]},{"id":"5.4.6","titel":"Punkt vor Strich, Klammern zuerst","extra":false,"lernziele":[{"id":"5.4.6-L1","text":"Ich kann die Rechenregeln „Punkt vor Strich“ und „Klammern zuerst“ anwenden."}]},{"id":"5.4.7","titel":"Verteilungsgesetz","extra":false,"lernziele":[{"id":"5.4.7-L1","text":"Ich kann das Verteilungsgesetz anwenden, indem ich ausklammere und ausmultipliziere."}]},{"id":"5.4.X1","titel":"Zahlenmuster","extra":true,"lernziele":[{"id":"5.4.X1-L1","text":"Ich kann Zahlenmuster erkennen."}]}]},{"id":"5.5","titel":"Geometrische Grundbegriffe und ebene Figuren","unterkapitel":[{"id":"5.5.1","titel":"Strecke und Gerade","extra":false,"lernziele":[{"id":"5.5.1-L1","text":"Ich kann die Begriffe Strecke und Gerade anwenden."}]},{"id":"5.5.2","titel":"Senkrechten","extra":false,"lernziele":[{"id":"5.5.2-L1","text":"Ich kann Senkrechten erkennen und zeichnen."}]},{"id":"5.5.3","titel":"Parallelen","extra":false,"lernziele":[{"id":"5.5.3-L1","text":"Ich kann Parallelen erkennen und zeichnen."}]},{"id":"5.5.4","titel":"Koordinatensystem","extra":false,"lernziele":[{"id":"5.5.4-L1","text":"Ich kann Punkte im Koordinatensystem ablesen und darstellen."}]},{"id":"5.5.5","titel":"Entfernung und Abstand","extra":false,"lernziele":[{"id":"5.5.5-L1","text":"Ich kann die Begriffe Entfernung und Abstand richtig anwenden."}]},{"id":"5.5.6","titel":"Symmetrie","extra":false,"lernziele":[{"id":"5.5.6-L1","text":"Ich kann symmetrische Figuren erkennen und zeichnen."}]},{"id":"5.5.7","titel":"Rechteck und Quadrat","extra":false,"lernziele":[{"id":"5.5.7-L1","text":"Ich kann Rechteck und Quadrat erkennen, unterscheiden und zeichnen."}]},{"id":"5.5.8","titel":"Parallelogramm und Raute","extra":false,"lernziele":[{"id":"5.5.8-L1","text":"Ich kann Parallelogramm und Raute erkennen, unterscheiden und zeichnen."}]},{"id":"5.5.9","titel":"Drachen und Trapez","extra":false,"lernziele":[{"id":"5.5.9-L1","text":"Ich kann Drachen und Trapez erkennen, unterscheiden und zeichnen."}]}]},{"id":"5.6","titel":"Größen und Sachaufgaben","unterkapitel":[{"id":"5.6.1","titel":"Größen schätzen","extra":false,"lernziele":[{"id":"5.6.1-L1","text":"Ich kann Größen schätzen."}]},{"id":"5.6.2","titel":"Geld","extra":false,"lernziele":[{"id":"5.6.2-L1","text":"Ich kann mit Geldbeträgen und Geldeinheiten rechnen."}]},{"id":"5.6.3","titel":"Zeit","extra":false,"lernziele":[{"id":"5.6.3-L1","text":"Ich kann mit Zeitpunkten, Zeitspannen und Zeiteinheiten umgehen."}]},{"id":"5.6.4","titel":"Gewicht","extra":false,"lernziele":[{"id":"5.6.4-L1","text":"Ich kann mit Gewichten und Gewichtseinheiten umgehen."}]},{"id":"5.6.5","titel":"Länge","extra":false,"lernziele":[{"id":"5.6.5-L1","text":"Ich kann mit Längen und Längeneinheiten umgehen."}]},{"id":"5.6.6","titel":"Maßstab","extra":false,"lernziele":[{"id":"5.6.6-L1","text":"Ich kann mit Maßstäben und maßstäblichen Zeichnungen umgehen."}]},{"id":"5.6.7","titel":"Sachaufgaben","extra":false,"lernziele":[{"id":"5.6.7-L1","text":"Ich kann Sachaufgaben sicher lösen."}]},{"id":"5.6.X1","titel":"Sachaufgaben zu Beruf und Alltag","extra":true,"lernziele":[{"id":"5.6.X1-L1","text":"Ich kann Sachaufgaben zu Beruf und Alltag lösen."}]}]},{"id":"5.7","titel":"Kreis und Winkel","unterkapitel":[{"id":"5.7.1","titel":"Kreise","extra":false,"lernziele":[{"id":"5.7.1-L1","text":"Ich kann Kreise anhand verschiedener Vorgaben zeichnen."}]},{"id":"5.7.2","titel":"Winkel vergleichen","extra":false,"lernziele":[{"id":"5.7.2-L1","text":"Ich kann Winkel zeichnen und Winkelgrößen vergleichen."}]},{"id":"5.7.3","titel":"Winkelarten","extra":false,"lernziele":[{"id":"5.7.3-L1","text":"Ich kann Winkelarten angeben sowie Winkelgrößen schätzen und auch bestimmen."}]},{"id":"5.7.4","titel":"Winkel messen und zeichnen","extra":false,"lernziele":[{"id":"5.7.4-L1","text":"Ich kann Winkel zeichnen, schätzen und messen."}]},{"id":"5.7.X1","titel":"Dreiecke","extra":true,"lernziele":[{"id":"5.7.X1-L1","text":"Ich kann Dreiecke nach Winkelart oder Seitenbeziehung einteilen und selbst zeichnen."}]},{"id":"5.7.X2","titel":"Gradnetz","extra":true,"lernziele":[{"id":"5.7.X2-L1","text":"Ich kann mithilfe des Gradnetzes Aussagen treffen."}]}]},{"id":"5.8","titel":"Flächeninhalt und Umfang","unterkapitel":[{"id":"5.8.1","titel":"Flächen vergleichen","extra":false,"lernziele":[{"id":"5.8.1-L1","text":"Ich kann Flächeninhalte durch Abzählen von Kästchen angeben und vergleichen."}]},{"id":"5.8.2","titel":"Flächenmaße","extra":false,"lernziele":[{"id":"5.8.2-L1","text":"Ich kann sicher mit Flächenmaßen umgehen."}]},{"id":"5.8.3","titel":"Rechteck","extra":false,"lernziele":[{"id":"5.8.3-L1","text":"Ich kann die Berechnung von Flächeninhalt und Umfang bei Rechtecken sicher durchführen und anwenden."}]},{"id":"5.8.4","titel":"Zusammengesetzte Figuren","extra":false,"lernziele":[{"id":"5.8.4-L1","text":"Ich kann die Berechnung von Flächeninhalt und Umfang auch bei zusammengesetzten Figuren durchführen und anwenden."}]}]},{"id":"5.9","titel":"Brüche und Dezimalzahlen","unterkapitel":[{"id":"5.9.1","titel":"Bruchschreibweise","extra":false,"lernziele":[{"id":"5.9.1-L1","text":"Ich kann die Bruchschreibweise verwenden."}]},{"id":"5.9.2","titel":"Bruchteile von Größen","extra":false,"lernziele":[{"id":"5.9.2-L1","text":"Ich kann mit Bruchteilen von Größen umgehen."}]},{"id":"5.9.3","titel":"Dezimalschreibweise","extra":false,"lernziele":[{"id":"5.9.3-L1","text":"Ich kann die Dezimalschreibweise verwenden."}]}]}],"aufgaben":[{"id":"5.3.1-K1-F-01","lernziel":"5.3.1-K1","niveau":"F","afb":1,"format":"zahl","text":"Im Feld liegen 5 Plättchen.\nWie viele Plättchen fehlen bis 10?","loesung":5,"typischeFehler":[],"hilfen":{"tipp":"Zähle die leeren Felder.","beispiel":"7 Plättchen: Bis 10 fehlen 3.","loesungsschritt":"Zähle von 5 weiter bis 10."},"bild":{"art":"zehnerfeld","felder":10,"belegt":5},"nachweis":["10 − 5 = 5","5 + 5 = 10"]},{"id":"5.3.1 "5000 − 2000 = 3000","2702 + 2230 = 4932","4932 − 2230 = 2702"]},{"id":"5.3.3-S4-M-03","lernziel":"5.3.3-S4","niveau":"M","afb":2,"format":"auswahl","text":"Genau eine Rechnung ist falsch. Finde sie mit dem Überschlag.","mehrfach":false,"optionen":[{"text":"7239 − 2990 = 4249","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"7887 − 2786 = 5101","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"8945 − 2961 = 5984","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"7925 − 2139 = 6786","richtig":true}],"hilfen":{"tipp":"Runde bei jeder Rechnung beide Zahlen auf Tausender und vergleiche mit dem Ergebnis.","loesungsschritt":"Erste Rechnung im Überschlag: 8000 − 3000 = 5000."},"nachweis":[{"art":"gleichungen","falsche":true}]},{"id":"5.3.3-S4-M-04","lernziel":"5.3.3-S4","niveau":"M","afb":1,"format":"luecken","text":"Mache die Probe zu 7040 − 3869 = 3171. Probe: 3171 + {{a}} = {{b}}","luecken":{"a":{"loesung":3869,"typischeFehler":[{"wert":7040,"fehlvorstellung":"probe-falsche-umkehr"}]},"b":{"loesung":7040,"typischeFehler":[]}},"hilfen":{"tipp":"Die Probe ist die Umkehraufgabe: Differenz + Subtrahend = Minuend.","loesungsschritt":"Addiere zur Differenz 3171 den Subtrahenden 3869."},"nachweis":["7040 − 3869 = 3171","3171 + 3869 = 7040"]},{"id":"5.3.3-S4-M-05","lernziel":"5.3.3-S4","niveau":"M","afb":2,"format":"auswahl","text":"Ein Ergebnis liegt zwischen 2000 und 3000. Entscheide mit dem Überschlag, welche Aufgabe dazu gehört.","mehrfach":false,"optionen":[{"text":"4027 − 2970","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"6045 − 1970","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"7163 − 3111","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"text":"6098 − 3872","richtig":true}],"hilfen":{"tipp":"Überschlage jede Aufgabe mit gerundeten Tausendern.","loesungsschritt":"6098 − 3872 ist ungefähr 6000 − 4000."},"nachweis":[{"art":"zwischen","ausdruck":"6098 − 3872","von":2000,"bis":3000,"gilt":true},{"art":"zwischen","ausdruck":"6045 − 1970","von":2000,"bis":3000,"gilt":false},{"art":"zwischen","ausdruck":"4027 − 2970","von":2000,"bis":3000,"gilt":false},{"art":"zwischen","ausdruck":"7163 − 3111","von":2000,"bis":3000,"gilt":false}]},{"id":"5.3.3-S4-M-06","lernziel":"5.3.3-S4","niveau":"M","afb":3,"format":"auswahl","text":"Zu 7514 − 2494 passt der Überschlag 8000 − 2000 = 6000. Das genaue Ergebnis ist 5020. Erkläre, warum der Überschlag so stark abweicht.","mehrfach":false,"optionen":[{"text":"Beim Überschlag darf das Ergebnis beliebig weit abweichen.","richtig":false},{"text":"Beide Zahlen wurden aufgerundet. Das vergrößert die Differenz.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Der Minuend wurde um 486 aufgerundet, der Subtrahend um 494 abgerundet. Beide Rundungen vergrößern die Differenz.","richtig":true},{"text":"Der Überschlag ist falsch gerechnet.","richtig":false,"fehlvorstellung":"ueberschlag-nicht-gerundet"}],"hilfen":{"tipp":"Prüfe für jede der beiden Zahlen: Wurde auf- oder abgerundet, und was bewirkt das für die Differenz?","loesungsschritt":"7514 wurde auf 8000 aufgerundet. Das sind 486 mehr."},"nachweis":["7514 ≈ 8000","2494 ≈ 2000","8000 − 2000 = 6000","7514 − 2494 = 5020","8000 − 7514 = 486","2494 − 2000 = 494"]},{"id":"5.3.3-S4-E-01","lernziel":"5.3.3-S4","niveau":"E","afb":1,"format":"zahl","text":"Überschlage 9025 − 4622. Runde beide Zahlen auf Hunderter.","loesung":4400,"typischeFehler":[{"wert":4403,"fehlvorstellung":"ueberschlag-nicht-gerundet"},{"wert":4000,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Auf Hunderter runden heißt: Die Zehnerziffer entscheidet."},"nachweis":["9025 ≈ 9000","4622 ≈ 4600","9000 − 4600 = 4400"]},{"id":"5.3.3-S4-E-02","lernziel":"5.3.3-S4","niveau":"E","afb":2,"format":"auswahl","text":"Bei einem Überschlag wird der Minuend aufgerundet und der Subtrahend abgerundet. Vergleiche den Überschlag mit dem genauen Ergebnis.","mehrfach":false,"optionen":[{"text":"Der Überschlag ist kleiner: Beim Runden geht immer etwas verloren.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Der Überschlag ist größer: Es wird von mehr ausgegangen und weniger abgezogen.","richtig":true},{"text":"Das lässt sich ohne die Zahlen nicht sagen.","richtig":false},{"text":"Beide sind gleich: Die Rundungen heben sich auf.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Der Überschlag ist kleiner: Der Subtrahend wird kleiner.","richtig":false,"fehlvorstellung":"begriffe-verwechselt"}],"hilfen":{"tipp":"Prüfe an einem Beispiel wie 58 − 22 und dem Überschlag 60 − 20."},"nachweis":["58 − 22 = 36","60 − 20 = 40"]},{"id":"5.3.3-S4-E-03","lernziel":"5.3.3-S4","niveau":"E","afb":2,"format":"zahl","text":"Ali rechnet 8578 − 6586 und erhält ein falsches Ergebnis. Die Probe ergibt: Ergebnis + 6586 = 8568. Um wie viel ist das Ergebnis zu klein?","loesung":10,"typischeFehler":[{"wert":1982,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Die Probe müsste den Minuenden ergeben. Vergleiche."},"nachweis":["8578 − 6586 = 1992","8578 − 8568 = 10","1982 + 6586 = 8568"]},{"id":"5.3.3-S4-E-04","lernziel":"5.3.3-S4","niveau":"E","afb":3,"format":"auswahl","text":"Du willst eine Differenz möglichst genau überschlagen. Stelle eine Regel für das Runden auf.","mehrfach":false,"optionen":[{"text":"Runde nur den Subtrahenden. Der Minuend spielt für die Genauigkeit keine Rolle.","richtig":false},{"text":"Runde beide Zahlen auf dieselbe Stelle. Die Richtung ist gleichgültig.","richtig":false},{"text":"Runde Minuend und Subtrahend in dieselbe Richtung. Dann gleichen sich die Rundungsfehler teilweise aus.","richtig":true},{"text":"Runde den Minuenden auf und den Subtrahenden ab. Dann gleichen sich die Rundungsfehler aus.","richtig":false,"fehlvorstellung":"falsch-gerundet"},{"text":"Runde immer beide Zahlen ab. Dann ist der Überschlag nie zu groß.","richtig":false,"fehlvorstellung":"falsch-gerundet"}],"hilfen":{"tipp":"Vergleiche 58 − 27 = 31 mit den Überschlägen 60 − 30, 60 − 20 und 50 − 30."},"nachweis":["58 − 27 = 31","60 − 30 = 30","60 − 20 = 40","50 − 30 = 20"]},{"id":"5.3.3-S4-E-05","lernziel":"5.3.3-S4","niveau":"E","afb":2,"format":"zahl","text":"Bei einer Subtraktion ist die Differenz 2197. Die Probe lautet 2197 + ▢ = 4000. Bestimme den Subtrahenden.","loesung":1803,"typischeFehler":[{"wert":6197,"fehlvorstellung":"sub-addiert"},{"wert":2803,"fehlvorstellung":"ergaenzen-zu-viel"}],"hilfen":{"tipp":"Die Probe addiert Differenz und Subtrahend zum Minuenden."},"nachweis":["4000 − 2197 = 1803","2197 + 1803 = 4000"]},{"id":"5.3.3-S4-E-06","lernziel":"5.3.3-S4","niveau":"E","afb":3,"format":"auswahl","text":"Tarik prüft 74 − 28 = 46 mit der Rechnung 74 − 46. Ist das eine geeignete Probe? Wähle die richtige Begründung.","mehrfach":false,"optionen":[{"text":"Nein. 74 − 46 ergibt wieder 46.","richtig":false},{"text":"Ja. Bei der Subtraktion darf man die Zahlen beliebig vertauschen.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Ja, aber nur, weil 74 eine gerade Zahl ist.","richtig":false},{"text":"Ja. Minuend − Differenz ergibt den Subtrahenden: 74 − 46 = 28.","richtig":true},{"text":"Nein. Eine Probe muss immer eine Addition sein.","richtig":false,"fehlvorstellung":"probe-falsche-umkehr"}],"hilfen":{"tipp":"Minuend, Subtrahend und Differenz hängen zusammen: Kennst du zwei davon, liegt die dritte fest."},"nachweis":[{"art":"urteil","stimmt":true},"74 − 28 = 46","74 − 46 = 28"]},{"id":"5.3.3-S5-F-01","lernziel":"5.3.3-S5","niveau":"F","afb":1,"format":"auswahl","text":"In der Schale liegen 14 Nüsse.\nElif isst 3 Nüsse auf.\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"14 + 3","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"3 − 14","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"14 − 3","richtig":true}],"hilfen":{"tipp":"Es werden weniger. Das ist minus.","beispiel":"10 Äpfel, 3 Äpfel weg: 10 − 3.","loesungsschritt":"Am Anfang sind es 14. Dann gehen 3 weg."},"bild":{"art":"mengenbild","anzahl":14,"weg":3},"nachweis":["14 − 3 = 11"]},{"id":"5.3.3-S5-F-02","lernziel":"5.3.3-S5","niveau":"F","afb":1,"format":"zahl","text":"In der Schale liegen 16 Nüsse.\nFinn isst 5 Nüsse auf.\nWie viele Nüsse sind noch da?","loesung":11,"typischeFehler":[{"wert":21,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Zähle im Bild die Plättchen ohne Strich.","beispiel":"15 Stifte, 6 Stifte weg: 15 − 6 = 9.","loesungsschritt":"Rechne 16 − 5."},"bild":{"art":"mengenbild","anzahl":16,"weg":5},"nachweis":["16 − 5 = 11"]},{"id":"5.3.3-S5-F-03","lernziel":"5.3.3-S5","niveau":"F","afb":1,"format":"zahl","text":"Im Bus sitzen 24 Kinder.\n10 Kinder steigen aus.\nWie viele Kinder sitzen noch im Bus?","loesung":14,"typischeFehler":[{"wert":34,"fehlvorstellung":"sach-falsche-rechnung"},{"wert":23,"fehlvorstellung":"stellenwert"}],"hilfen":{"tipp":"Aussteigen heißt: Es werden weniger.","beispiel":"25 Kinder, 10 steigen aus: 25 − 10 = 15.","loesungsschritt":"Rechne 24 − 10."},"bild":{"art":"streifen","ganz":24,"teile":[10,{"wert":14,"frage":true}]},"nachweis":["24 − 10 = 14"]},{"id":"5.3.3-S5-F-04","lernziel":"5.3.3-S5","niveau":"F","afb":1,"format":"zahl","text":"Tom hat 30 Euro.\nTom gibt 5 Euro aus.\nWie viel Euro hat Tom noch?","loesung":25,"typischeFehler":[{"wert":35,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Ausgeben heißt: Das Geld wird weniger.","beispiel":"30 Euro, 4 Euro ausgegeben: 30 − 4 = 26.","loesungsschritt":"Springe von 30 aus 5 zurück."},"einheit":"Euro","bild":{"art":"zahlenstrahl","von":20,"bis":40,"schritt":1,"beschriftung":5,"start":30,"spruenge":[{"von":30,"nach":25,"text":"− 5"}]},"nachweis":["30 − 5 = 25"]},{"id":"5.3.3-S5-F-05","lernziel":"5.3.3-S5","niveau":"F","afb":2,"format":"auswahl","text":"Die Rechnung ist 15 − 8.\nWelche Geschichte passt?","mehrfach":false,"optionen":[{"text":"15 Ballons.\n8 Ballons kommen dazu.","ric ich","oben":{"name":"Jonas","wert":13},"unten":{"name":"Bruder","wert":{"wert":9,"frage":true}},"unterschied":4},"nachweis":["13 − 4 = 9"]},{"id":"5.3.3-S5-G-06","lernziel":"5.3.3-S5","niveau":"G","afb":3,"format":"auswahl","text":"Im Bus sind 62 Menschen.\n16 Menschen steigen aus.\nOle rechnet 62 + 16 = 78.\nStimmt das?","mehrfach":false,"optionen":[{"text":"Falsch.\nAussteigen heißt minus.\n62 − 16 = 46.","richtig":true},{"text":"Stimmt.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"Falsch.\nMan muss 16 − 62 rechnen.","richtig":false,"fehlvorstellung":"begriffe-verwechselt"}],"hilfen":{"tipp":"Steigen Menschen aus, werden es weniger.","beispiel":"40 Menschen, 10 steigen aus: 40 − 10 = 30.","loesungsschritt":"Rechne 62 − 16."},"bild":{"art":"streifen","ganz":62,"teile":[16,{"wert":46,"frage":true}]},"nachweis":[{"art":"urteil","stimmt":false,"rechnung":"62 − 16","behauptet":78},"62 − 16 = 46"]},{"id":"5.3.3-S5-M-01","lernziel":"5.3.3-S5","niveau":"M","afb":1,"format":"zahl","text":"Die Klasse 5d braucht 250 € für den Ausflug. In der Klassenkasse sind 151 €. Berechne den Betrag, der fehlt.","loesung":99,"typischeFehler":[{"wert":401,"fehlvorstellung":"sach-falsche-rechnung"},{"wert":101,"fehlvorstellung":"sub-kleiner-von-groesser"}],"hilfen":{"tipp":"Gesucht ist der Unterschied zwischen dem Betrag, der gebraucht wird, und dem Betrag, der da ist.","loesungsschritt":"Rechne 250 − 151."},"einheit":"€","nachweis":["250 − 151 = 99"]},{"id":"5.3.3-S5-M-02","lernziel":"5.3.3-S5","niveau":"M","afb":2,"format":"sachaufgabe","text":"Ein Bus fährt mit 47 Fahrgästen los. An der ersten Haltestelle steigen 12 aus, an der zweiten 8.","teile":[{"format":"zahl","text":"Berechne die Zahl der Fahrgäste nach der ersten Haltestelle.","loesung":35,"typischeFehler":[{"wert":59,"fehlvorstellung":"sach-falsche-rechnung"}]},{"format":"zahl","text":"Berechne die Zahl der Fahrgäste nach der zweiten Haltestelle.","loesung":27,"typischeFehler":[{"wert":39,"fehlvorstellung" {"id":"5.3.3-S5-M-06","lernziel":"5.3.3-S5","niveau":"M","afb":3,"format":"auswahl","text":"Ein Aufzug trägt 600 kg. Darin stehen 5 Personen mit zusammen 395 kg. Zwei weitere Personen mit 93 kg und 120 kg wollen einsteigen. Lena sagt: „Das passt.“ Beurteile die Aussage.","mehrfach":false,"optionen":[{"text":"Richtig: 600 − 395 = 205. Es ist noch viel Platz.","richtig":false,"fehlvorstellung":"sach-schritt-vergessen"},{"text":"Falsch: 395 + 93 + 120 = 608. Das sind 8 kg zu viel.","richtig":true},{"text":"Falsch: In einem Aufzug dürfen höchstens 5 Personen stehen.","richtig":false,"fehlvorstellung":"sach-unnoetige-angabe"},{"text":"Richtig: 600 − 395 − 93 = 112. Es bleibt noch etwas übrig.","richtig":false,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne das Gesamtgewicht aller sieben Personen und vergleiche es mit der Tragkraft.","loesungsschritt":"395 + 93 = 488. Addiere noch 120."},"nachweis":[{"art":"urteil","stimmt":false},"395 + 93 + 120 = 608","608 − 600 = 8"]},{"id":"5.3.3-S5-E-01","lernziel":"5.3.3-S5","niveau":"E","afb":1,"format":"zahl","text":"Ein Schwimmbad lässt 430 Menschen gleichzeitig ins Wasser und hat 11 Duschen. Um 14 Uhr sind 289 Menschen im Wasser. Berechne, wie viele noch hineindürfen.","loesung":141,"typischeFehler":[{"wert":130,"fehlvorstellung":"sach-unnoetige-angabe"},{"wert":719,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Nicht jede Angabe im Text wird gebraucht."},"nachweis":[{"zahl":11,"grund":"überflüssige Angabe"},"430 − 289 = 141"]},{"id":"5.3.3-S5-E-02","lernziel":"5.3.3-S5","niveau":"E","afb":2,"format":"zahl","text":"Lena hat 100 €. Lena kauft Schuhe für 46 € und zwei T-Shirts für je 12 €. An der Kasse gibt es 3 € Rabatt. Berechne das Restgeld.","loesung":33,"typischeFehler":[{"wert":45,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":27,"fehlvorstellung":"sach-falsche-rechnung"},{"wert":30,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne zuerst, was an der Kasse tat  Kinder aus.\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"6 − 5 − 2","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"6 + 5 + 2","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"6 + 5 − 2","richtig":true}],"hilfen":{"tipp":"Einsteigen heißt plus. Aussteigen heißt minus.","beispiel":"5 Kinder. 3 steigen ein, 2 steigen aus: 5 + 3 − 2.","loesungsschritt":"Erst kommen 5 dazu. Dann gehen 2 weg."},"bild":{"art":"mengenbild","anzahl":6,"weg":2,"dazu":5},"nachweis":["6 + 5 − 2 = 9"]},{"id":"5.3.4-B2-F-03","lernziel":"5.3.4-B2","niveau":"F","afb":1,"format":"zahl","text":"Auf dem Tisch liegen 15 Nüsse.\nIda isst 4 Nüsse.\nNoah isst 3 Nüsse.\nWie viele Nüsse bleiben?","loesung":8,"typischeFehler":[{"wert":11,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":14,"fehlvorstellung":"sub-klammerfehler"}],"hilfen":{"tipp":"Zähle im Bild die Plättchen ohne Strich.","beispiel":"10 Nüsse. 3 und 2 werden gegessen: 10 − 3 − 2 = 5.","loesungsschritt":"Zusammen werden 4 + 3 = 7 Nüsse gegessen."},"bild":{"art":"mengenbild","anzahl":15,"weg":7},"nachweis":["15 − 4 − 3 = 8","4 + 3 = 7"]},{"id":"5.3.4-B2-F-04","lernziel":"5.3.4-B2","niveau":"F","afb":1,"format":"zahl","text":"Elif hat 6 Sticker.\nElif bekommt 3 Sticker dazu.\nDann bekommt Elif noch 4 Sticker.\nWie viele Sticker hat Elif jetzt?","loesung":13,"typischeFehler":[{"wert":9,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Es kommt 2-mal etwas dazu. Folge den Sprüngen.","beispiel":"4 Sticker. 2 dazu, dann 3 dazu: 4 + 2 + 3 = 9.","loesungsschritt":"6 + 3 = 9. Dann kommen noch 4 dazu."},"bild":{"art":"zahlenstrahl","von":0,"bis":20,"schritt":1,"beschriftung":5,"start":6,"spruenge":[{"von":6,"nach":9,"text":"+ 3"},{"von":9,"nach":13,"text":"+ 4"}]},"nachweis":["6 + 3 + 4 = 13"]},{"id":"5.3.4-B2-F-05","lernziel":"5.3.4-B2","niveau":"F","afb":2,"format":"auswahl","text":"Die Rechnung ist 12 − 4 − 2.\nWelche Geschichte passt?","mehrfach":false,"optionen":[{"text":"12 4-B2-G-02","lernziel":"5.3.4-B2","niveau":"G","afb":1,"format":"zahl","text":"Noah hat 40 Euro.\nNoah kauft einen Ball für 16 Euro.\nNoah kauft ein Heft für 10 Euro.\nWie viel Euro bleiben?","loesung":14,"typischeFehler":[{"wert":34,"fehlvorstellung":"klammer-ignoriert"},{"wert":24,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Rechne erst aus, was beides zusammen kostet.","beispiel":"30 Euro. Zusammen 4 + 6 = 10 Euro ausgegeben. Es bleiben 20 Euro.","loesungsschritt":"16 + 10 = 26. Ziehe das von 40 ab."},"einheit":"Euro","bild":{"art":"streifen","ganz":40,"teile":[16,10,{"wert":14,"frage":true}]},"nachweis":["40 − (16 + 10) = 14"]},{"id":"5.3.4-B2-G-03","lernziel":"5.3.4-B2","niveau":"G","afb":2,"format":"luecken","text":"Die Rechnung ist 50 − (15 + 5).\nWie viel wird zusammen abgezogen? {{a}}\nWas ist das Ergebnis? {{b}}","luecken":{"a":{"loesung":20,"typischeFehler":[]},"b":{"loesung":30,"typischeFehler":[{"wert":40,"fehlvorstellung":"klammer-ignoriert"}]}},"hilfen":{"tipp":"In der Klammer steht, was zusammen abgezogen wird.","beispiel":"40 − (15 + 5): Zusammen werden 20 abgezogen. Ergebnis 20.","loesungsschritt":"15 + 5 = 20."},"bild":{"art":"streifen","ganz":50,"teile":[15,5,{"wert":30,"frage":true}]},"nachweis":["15 + 5 = 20","50 − (15 + 5) = 30"]},{"id":"5.3.4-B2-G-04","lernziel":"5.3.4-B2","niveau":"G","afb":1,"format":"auswahl","text":"Addiere 8 und 3.\nZiehe das Ergebnis von 30 ab.\nWelche Rechnung passt?","mehrfach":false,"optionen":[{"text":"(8 + 3) − 30","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"30 − 8 + 3","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"30 − (8 + 3)","richtig":true}],"hilfen":{"tipp":"Was zuerst gerechnet wird, steht in der Klammer.","beispiel":"Addiere 3 und 4. Ziehe das Ergebnis von 20 ab: 20 − (3 + 4).","loesungsschritt":"Zuerst wird 8 + 3 gerechnet. Das kommt in die Klammer."},"nachweis":["30 − (8 + 3) = 19"]},{"id":"5.3.4-B2-G-05","lernziel":"5.3.4-B2","niveau":"G","afb":2,"format":"auswahl","text":"Die Rechnung ist 30 − (7 + 13).\nWelche Geschichte passt?","mehrfach":false,"optionen":[{"text":"30 Plätze.\n7 Kinder setzen sich.\n13 Plätze kommen dazu.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"7 Kinder und 13 Erwachsene.\n30 Menschen kommen dazu.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"30 Plätze.\n7 Kinder und 13 Erwachsene setzen sich.","richtig":true}],"hilfen":{"tipp":"In der Klammer steht, was zusammen weggeht.","beispiel":"20 − (3 + 5) passt zu: 20 Plätze. 3 Kinder und 5 Erwachsene setzen sich.","loesungsschritt":"Suche die Geschichte, in der 7 und 13 zusammen weggehen."},"bild":{"art":"streifen","ganz":30,"teile":[7,13,{"wert":10,"frage":true}]},"nachweis":["30 − (7 + 13) = 10"]},{"id":"5.3.4-B2-G-06","lernziel":"5.3.4-B2","niveau":"G","afb":3,"format":"auswahl","text":"Paul hat 80 Euro.\nPaul gibt erst 25 Euro aus, dann 10 Euro.\nPaul schreibt: 80 − 25 + 10\nStimmt das?","mehrfach":false,"optionen":[{"text":"Stimmt.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Falsch.\nBeide Beträge gehen weg.\nRichtig ist 80 − (25 + 10).","richtig":true},{"text":"Falsch.\nRichtig ist 80 + 25 + 10.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Ausgeben heißt minus. Hier wird 2-mal Geld ausgegeben.","beispiel":"50 Euro, 10 Euro und 5 Euro ausgegeben: 50 − (10 + 5).","loesungsschritt":"Zusammen gehen 25 + 10 = 35 Euro weg."},"nachweis":[{"art":"urteil","stimmt":false},"80 − (25 + 10) = 45","80 − 25 + 10 = 65"]},{"id":"5.3.4-B2-M-01","lernziel":"5.3.4-B2","niveau":"M","afb":1,"format":"auswahl","text":"Welcher Rechenausdruck passt? „Subtrahiere die Summe von 65 und 30 von 200.“","mehrfach":false,"optionen":[{"text":"200 − 65 + 30","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"(65 + 30) − 200","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"200 − (65 + 30)","richtig":true},{"text":"(200 − 65) + 30","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"„Von“ nennt den Minuenden. Die Summe wird als Ganzes abgezogen und steht deshalb in der Klammer.","loesungsschritt":"Der Minuend ist 200. Abgezogen wird 65 + 30."},"nachweis":["200 − (65 + 30) = 105"]},{"id":"5.3.4-B2-M-02","lernziel":"5.3.4-B2","niveau":"M","afb":2,"format":"zahl","text":"Subtrahiere von 500 die Differenz der Zahlen 310 und 130. Stelle den Rechenausdruck auf und berechne.","loesung":320,"typischeFehler":[{"wert":60,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Die Differenz wird als Ganzes subtrahiert. Sie steht in einer Klammer.","loesungsschritt":"Rechenausdruck: 500 − (310 − 130). Klammer: 310 − 130 = 180."},"nachweis":["500 − (310 − 130) = 320"]},{"id":"5.3.4-B2-M-03","lernziel":"5.3.4-B2","niveau":"M","afb":2,"format":"zuordnen","text":"Ordne jedem Text den passenden Rechenausdruck zu.","paare":[{"links":"Subtrahiere die Summe von 30 und 15 von 80.","rechts":"80 − (30 + 15)"},{"links":"Subtrahiere 30 von 80 und addiere 15.","rechts":"(80 − 30) + 15"},{"links":"Subtrahiere die Differenz von 30 und 15 von 80.","rechts":"80 − (30 − 15)"}],"hilfen":{"tipp":"Achte darauf, was als Ganzes abgezogen wird. Das steht in der Klammer.","loesungsschritt":"„Die Summe von 30 und 15“ ist der Ausdruck 30 + 15."},"nachweis":["80 − (30 + 15) = 35","(80 − 30) + 15 = 65","80 − (30 − 15) = 65"]},{"id":"5.3.4-B2-M-04","lernziel":"5.3.4-B2","niveau":"M","afb":1,"format":"auswahl","text":"Welcher Rechenausdruck passt? „Addiere zur Differenz von 90 und 45 die Zahl 25.“","mehrfach":false,"optionen":[{"text":"90 − (45 + 25)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"(90 − 45) + 25","richtig":true},{"text":"25 − (90 − 45)","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"(90 + 45) − 25","richtig":false,"fehlvorstellung":"begriffe-verwechselt"}],"hilfen":{"tipp":"Bilde zuerst die Differenz. Danach wird addiert.","loesungsschritt":"Die Differenz von 90 und 45 ist 90 − 45."},"nachweis":["(90 − 45) + 25 = 70"]},{"id":"5.3.4-B2-M-05","lernziel":"5.3.4-B2","niveau":"M","afb":2,"format":"sachaufgabe","text":"Sara hat 80 € gespart und kauft einen Rucksack für 35 € und eine Trinkflasche für 18 €. Zur Situation passt der Rechenausdruck 80 − (35 + 18).","teile":[{"format":"zahl","text":"Berechne den Wert der Klammer. Er gibt an, wie viel zusammen ausgegeben wird.","loesung":53,"einheit":"€","typischeFehler":[]},{"format":"zahl","text":"Berechne das Restgeld.","loesung":27,"einheit":"€","typischeFehler":[{"wert":63,"fehlvorstellung":"klammer-ignoriert"}]}],"hilfen":{"tipp":"Die Klammer fasst beide Preise zusammen.","loesungsschritt":"35 + 18 = 53."},"nachweis":["35 + 18 = 53","80 − (35 + 18) = 27"]},{"id":"5.3.4-B2-M-06","lernziel":"5.3.4-B2","niveau":"M","afb":3,"format":"auswahl","text":"Von 80 € werden erst 33 € und dann 18 € ausgegeben. Ida schreibt 80 − 33 − 18, Ben schreibt 80 − (33 + 18). Beurteile die beiden Rechenausdrücke.","mehrfach":false,"optionen":[{"text":"Beide passen. Sie haben denselben Wert 29: Einmal werden die Beträge nacheinander abgezogen, einmal zusammen.","richtig":true},{"text":"Nur der Ausdruck von Ida passt. Eine Klammer verändert das Ergebnis.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur der Ausdruck von Ben passt. Ohne Klammer wird 18 addiert.","richtig":false,"fehlvorstellung":"sub-klammerfehler"},{"text":"Keiner von beiden passt. Hier muss addiert werden.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"}],"hilfen":{"tipp":"Berechne beide Rechenausdrücke und vergleiche.","loesungsschritt":"80 − 33 − 18 = 29."},"nachweis":["80 − 33 − 18 = 29","80 − (33 + 18) = 29"]},{"id":"5.3.4-B2-E-01","lernziel":"5.3.4-B2","niveau":"E","afb":1,"format":"auswahl","text":"Welcher Term passt? „Subtrahiere von 1000 die Summe aus 250 und der Differenz von 400 und 160.“","mehrfach":false,"optionen":[{"text":"1000 − 250 + (400 − 160)","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"(1000 − 250) + 400 − 160","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"1000 − [(250 + 400) − 160]","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"1000 − [250 + (400 − 160)]","richtig":true},{"text":"[1000 − (250 + 400)] − 160","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Baue den Term von innen nach außen: zuerst die Differenz, dann die Summe, dann die Subtraktion von 1000."},"nachweis":["1000 − [250 + (400 − 160)] = 510"]},{"id":"5.3.4-B2-E-02","lernziel":"5.3.4-B2","niveau":"E","afb":2,"format":"zahl","text":"Eine Klasse hat 30 Plätze im Bus reserviert. Angemeldet sind 28 Kinder. 3 Kinder sind krank, 3 Begleitpersonen kommen dazu. Stelle einen Term auf und berechne, wie viele Plätze frei bleiben.","loesung":2,"typischeFehler":[{"wert":5,"fehlvorstellung":"sach-schritt-vergessen"}],"hilfen":{"tipp":"Berechne zuerst in einer Klammer, wie viele Personen tatsächlich mitfahren."},"nachweis":["28 − 3 + 3 = 28","30 − (28 − 3 + 3) = 2"]},{"id":"5.3.4-B2-E-03","lernziel":"5.3.4-B2","niveau":"E","afb":2,"format":"auswahl","text":"Welcher Text passt zum Term 300 − (130 − 20)?","mehrfach":false,"optionen":[{"text":"In einem Saal sitzen 300 Gäste. Erst gehen 130, dann gehen 20. Gesucht sind die übrigen Gäste.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Ein Saal hat 300 Plätze. Erst kommen 130 Gäste, dann noch 20. Gesucht sind die freien Plätze.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Ein Saal hat 300 Plätze. 130 Karten wurden verkauft, 20 davon wurden zurückgegeben. Gesucht sind die freien Plätze.","richtig":true},{"text":"In einem Saal sitzen 130 Gäste. 20 gehen, 300 kommen dazu. Gesucht sind alle Gäste.","richtig":false,"fehlvorstellung":"sach-falsche-rechnung"},{"text":"Ein Saal hat 300 Plätze. 130 Gäste kommen, 20 Stühle werden weggeräumt. Gesucht sind die freien Plätze.","richtig":false,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Die Klammer beschreibt, wie viele Plätze tatsächlich besetzt sind."},"nachweis":["300 − (130 − 20) = 190"]},{"id":"5.3.4-B2-E-04","lernziel":"5.3.4-B2","niveau":"E","afb":3,"format":"auswahl","text":"Für welche Zahlen im Kästchen haben die Terme 100 − (▢ + 20) und 100 − ▢ − 20 denselben Wert? Stelle die Regel auf.","mehrfach":false,"optionen":[{"text":"Nur für die Zahl 0.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur für die Zahl 20.","richtig":false},{"text":"Für keine Zahl: Eine Klammer verändert immer den Wert.","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"Nur für gerade Zahlen.","richtig":false},{"text":"Für jede Zahl von 0 bis 80: Beide Terme subtrahieren insgesamt die Zahl und 20.","richtig":true}],"hilfen":{"tipp":"Setze mehrere Zahlen ein, zum Beispiel 10, 35 und 80, und vergleiche die Werte."},"nachweis":["100 − (10 + 20) = 70","100 − 10 − 20 = 70","100 − (35 + 20) = 45","100 − 35 − 20 = 45","100 − (80 + 20) = 0","100 − 80 − 20 = 0"]},{"id":"5.3.4-B2-E-05","lernziel":"5.3.4-B2","niveau":"E","afb":2,"format":"zahl","text":"Mia ist 12 Jahre alt und hat 50 €. Mia kauft 3 Hefte für je 5 € und einen Füller für 9 €. Stelle einen Term auf und berechne das Restgeld.","loesung":26,"typischeFehler":[{"wert":36,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":14,"fehlvorstellung":"sach-unnoetige-angabe"}],"hilfen":{"tipp":"Nicht jede Angabe wird gebraucht. Die Klammer fasst alle Ausgaben zusammen."},"einheit":"€","nachweis":[{"zahl":12,"grund":"überflüssige Angabe"},"3 · 5 + 9 = 24","50 − (3 · 5 + 9) = 26"]},{"id":"5.3.4-B2-E-06","lernziel":"5.3.4-B2","niveau":"E","afb":3,"format":"auswahl","text":"In 60 − 20 − 10 + 5 soll genau ein Klammerpaar gesetzt werden, sodass der Wert 45 herauskommt. Welcher Term erfüllt das?","mehrfach":false,"optionen":[{"text":"(60 − 20) − 10 + 5","richtig":false,"fehlvorstellung":"klammer-ignoriert"},{"text":"60 − (20 − 10 + 5)","richtig":true},{"text":"60 − (20 + 10) + 5","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"60 − 20 − (10 + 5)","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"},{"text":"60 − (20 − 10) + 5","richtig":false,"fehlvorstellung":"klammer-falsch-gesetzt"}],"hilfen":{"tipp":"Berechne jeden Term. Achte auf die Rechenzeichen innerhalb der Klammer."},"nachweis":[{"art":"wert","wert":45},"60 − (20 − 10 + 5) = 45"]},{"id":"5.3.5-R1-F-01","lernziel":"5.3.5-R1","niveau":"F","afb":1,"format":"luecken","text":"3 + 8 = 11\nTausche die Zahlen.\n8 + 3 = {{a}}","luecken":{"a":{"loesung":11,"typischeFehler":[]}},"hilfen":{"tipp":"Beim Plus-Rechnen darfst du die Zahlen tauschen. Das Ergebnis bleibt gleich.","beispiel":"2 + 7 = 9. Also ist auch 7 + 2 = 9.","loesungsschritt":"Es sind dieselben Plättchen. Zusammen sind es 11."},"bild":{"art":"mengenbild","anzahl":3,"dazu":8},"nachweis":["3 + 8 = 11","8 + 3 = 11"]},{"id":"5.3.5-R1-F-02","lernziel":"5.3.5-R1","niveau":"F","afb":1,"format":"auswahl","text":"Welche Aufgabe ist die Tauschaufgabe?\n2 + 7","mehrfach":false,"optionen":[{"text":"7 − 2","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"7 + 2","richtig":true},{"text":"2 + 2","richtig":false}],"hilfen":{"tipp":"Bei der Tauschaufgabe tauschen die beiden Zahlen den Platz.","beispiel":"Die Tauschaufgabe zu 2 + 6 ist 6 + 2.","loesungsschritt":"Die Zahlen 2 und 7 bleiben. Das Plus bleibt auch."},"bild":{"art":"mengenbild","anzahl":2,"dazu":7},"nachweis":["2 + 7 = 9","7 + 2 = 9"]},{"id":"5.3.5-R1-F-03","lernziel":"5.3.5-R1","niveau":"F","afb":1,"format":"zahl","text":"2 + 14 ist schwer zu zählen.\nTausche die Zahlen.\nRechne 14 + 2.","loesung":16,"typischeFehler":[{"wert":12,"fehlvorstellung":"add-subtrahiert"}],"hilfen":{"tipp":"Starte bei der großen Zahl. Dann sind es nur wenige Schritte.","beispiel":"2 + 15: Starte bei 15 und gehe 2 weiter. Ergebnis 17.","loesungsschritt":"Starte bei 14. Gehe 2 Schritte weiter."},"bild":{"art":"zahlenstrahl","von":10,"bis":20,"schritt":1,"beschriftung":5,"start":14,"spruenge":[{"von":14,"nach":16,"text":"+ 2"}]},"nachweis":["14 + 2 = 16","2 + 14 = 16"]},{"id":"5.3.5-R1-F-04","lernziel":"5.3.5-R1","niveau":"F","afb":1,"format":"luecken","text":"Welche Zahl fehlt?\n5 + 9 = {{a}} + 5","luecken":{"a":{"loesung":9,"typischeFehler":[{"wert":14,"fehlvorstellung":"sach-schritt-vergessen"}]}},"hilfen":{"tipp":"Links und rechts stehen dieselben Zahlen. Sie sind nur getauscht.","beispiel":"2 + 7 = 7 + 2.","loesungsschritt":"Links stehen 5 und 9. Rechts steht schon die 5."},"bild":{"art":"mengenbild","anzahl":5,"dazu":9},"nachweis":["5 + 9 = 14","9 + 5 = 14"]},{"id":"5.3.5-R1-F-05","lernziel":"5.3.5-R1","niveau":"F","afb":2,"format":"auswahl","text":"Welche 2 Aufgaben haben dasselbe Ergebnis?","mehrfach":false,"optionen":[{"text":"8 + 2 und 8 − 2","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"8 + 2 und 2 + 8","richtig":true},{"text":"8 + 2 und 8 + 8","richtig":false}],"hilfen":{"tipp":"Tauschaufgaben haben dasselbe Ergebnis.","beispiel":"5 + 3 und 3 + 5 haben beide das Ergebnis 8.","loesungsschritt":"Suche die Aufgabe mit denselben Zahlen und einem Plus."},"bild":{"art":"mengenbild","anzahl":8,"dazu":2},"nachweis":[{"art":"gleicheWerte"},"8 + 2 = 10","2 + 8 = 10","8 − 2 = 6","8 + 8 = 16"]},{"id":"5.3.5-R1-F-06","lernziel":"5.3.5-R1","niveau":"F","afb":1,"format":"zahl","text":"30 + 40 = 70\nWie viel ist 40 + 30?","loesung":70,"typischeFehler":[{"wert":10,"fehlvorstellung":"add-subtrahiert"}],"hilfen":{"tipp":"Das ist die Tauschaufgabe. Das Ergebnis bleibt gleich.","beispiel":"10 + 40 = 50. Also ist auch 40 + 10 = 50.","loesungsschritt":"Die Sprünge im Bild sind dieselben. Du landest bei 70."},"bild":{"art":"zahlenstrahl","von":0,"bis":100,"schritt":10,"beschriftung":10,"start":0,"spruenge":[{"von":0,"nach":40,"text":"+ 40"},{"von":40,"nach":70,"text":"+ 30"}]},"nachweis":["30 + 40 = 70","40 + 30 = 70"]},{"id":"5.3.5-R1-G-01","lernziel":"5.3.5-R1","niveau":"G","afb":1,"format":"auswahl","text":"Welches Gesetz siehst du?\n15 + 46 = 46 + 15","mehrfach":false,"optionen":[{"text":"Vertauschungsgesetz","richtig":true},{"text":"Verbindungsgesetz","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Kein Gesetz.\nDie Rechnung ist falsch.","richtig":false}],"hilfen":{"tipp":"Schau genau: Haben die Zahlen den Platz getauscht?","beispiel":"5 + 9 = 9 + 5: Die Zahlen sind vertauscht. Das ist das Vertauschungsgesetz.","loesungsschritt":"15 und 46 haben den Platz getauscht."},"nachweis":["15 + 46 = 61","46 + 15 = 61"]},{"id":"5.3.5-R1-G-02","lernziel":"5.3.5-R1","niveau":"G","afb":1,"format":"luecken","text":"Die Klammer wandert.\nDie Zahlen bleiben gleich.\n(14 + 21) + 4 = 14 + (21 + {{a}})","luecken":{"a":{"loesung":4,"typischeFehler":[]}},"hilfen":{"tipp":"Beim Verbindungsgesetz bleibt die Reihenfolge der Zahlen gleich.","beispiel":"(4 + 7) + 3 = 4 + (7 + 3).","loesungsschritt":"Links stehen 14, 21 und 4. Rechts fehlt die letzte Zahl."},"bild":{"art":"streifen","ganz":{"wert":39,"frage":true},"teile":[14,21,4]},"nachweis":["(14 + 21) + 4 = 39","14 + (21 + 4) = 39"]},{"id":"5.3.5-R1-G-03","lernziel":"5.3.5-R1","niveau":"G","afb":2,"format":"luecken","text":"Rechne auf 2 Wegen.\n(11 + 3) + 7 = {{a}}\n11 + (3 + 7) = {{b}}","luecken":{"a":{"loesung":21,"typischeFehler":[]},"b":{"loesung":21,"typischeFehler":[]}},"hilfen":{"tipp":"Rechne immer zuerst die Klammer aus.","beispiel":"(12 + 9) + 1 = 21 + 1 = 22. Und 12 + (9 + 1) = 12 + 10 = 22.","loesungsschritt":"Zweiter Weg: 3 + 7 = 10. Dann 11 + 10."},"bild":{"art":"streifen","ganz":{"wert":21,"frage":true},"teile":[11,3,7]},"nachweis":["(11 + 3) + 7 = 21","11 + (3 + 7) = 21"]},{"id":"5.3.5-R1-G-04","lernziel":"5.3.5-R1","niveau":"G","afb":1,"format":"auswahl","text":"Wo darfst du die Zahlen tauschen?","mehrfach":false,"optionen":[{"text":"Bei beiden Aufgaben","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Bei 40 − 23","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Bei 40 + 23","richtig":true}],"hilfen":{"tipp":"Das Vertauschungsgesetz gilt nur beim Addieren.","beispiel":"8 + 3 = 3 + 8. Aber 8 − 3 ist nicht 3 − 8.","loesungsschritt":"Suche die Aufgabe mit dem Plus."}},{"id":"5.3.5-R1-G-05","lernziel":"5.3.5-R1","niveau":"G","afb":2,"format":"auswahl","text":"Welche Rechnung hat dasselbe Ergebnis?\n34 + (16 + 5)","mehrfach":false,"optionen":[{"text":"34 − (16 + 5)","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"(34 + 16) − 5","richtig":false,"fehlvorstellung":"add-subtrahiert"},{"text":"(34 + 16) + 5","richtig":true}],"hilfen":{"tipp":"Beim Addieren darfst du die Klammer versetzen.","beispiel":"5 + (4 + 6) = (5 + 4) + 6.","loesungsschritt":"Suche die Rechnung mit denselben Zahlen und 2-mal Plus."},"bild":{"art":"streifen","ganz":{"wert":55,"frage":true},"teile":[34,16,5]},"nachweis":[{"art":"wert","wert":55},"34 + (16 + 5) = 55","(34 + 16) + 5 = 55"]},{"id":"5.3.5-R1-G-06","lernziel":"5.3.5-R1","niveau":"G","afb":3,"format":"auswahl","text":"Lena sagt:\n20 − 9 − 3 ist dasselbe wie 20 − (9 − 3).\nStimmt das?","mehrfach":false,"optionen":[{"text":"Stimmt.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch.\nLinks kommt 8 heraus.\nRechts kommt 14 heraus.","richtig":true},{"text":"Falsch.\nLinks kommt 14 heraus.\nRechts kommt 8 heraus.","richtig":false,"fehlvorstellung":"klammer-ignoriert"}],"hilfen":{"tipp":"Rechne beide Seiten aus. Die Klammer kommt zuerst.","beispiel":"10 − 4 − 2 = 4. Aber 10 − (4 − 2) = 10 − 2 = 8.","loesungsschritt":"Rechts: Klammer 9 − 3 = 6. Dann 20 − 6."},"nachweis":[{"art":"urteil","stimmt":false},"20 − 9 − 3 = 8","20 − (9 − 3) = 14"]},{"id":"5.3.5-R1-M-01","lernziel":"5.3.5-R1","niveau":"M","afb":1,"format":"auswahl","text":"Welches Rechengesetz wurde angewendet? (132 + 72) + 28 = 132 + (72 + 28)","mehrfach":false,"optionen":[{"text":"Verbindungsgesetz","richtig":true},{"text":"Vertauschungsgesetz","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Vertauschungsgesetz und Verbindungsgesetz zugleich","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"Kein Rechengesetz. Die Gleichung ist falsch.","richtig":false}],"hilfen":{"tipp":"Vergleiche beide Seiten: Hat sich die Reihenfolge der Zahlen geändert oder nur die Klammer?","loesungsschritt":"Die Reihenfolge der Zahlen ist gleich geblieben. Nur die Klammer steht an einer anderen Stelle."},"nachweis":["(132 + 72) + 28 = 232","132 + (72 + 28) = 232"]},{"id":"5.3.5-R1-M-02","lernziel":"5.3.5-R1","niveau":"M","afb":2,"format":"auswahl","text":"Welche Gleichungen stimmen? Wähle alle richtigen aus.","mehrfach":true,"optionen":[{"text":"42 + 57 = 57 + 42","richtig":true},{"text":"42 + 57 = 42 + 75","richtig":false,"fehlvorstellung":"stellenwert"},{"text":"(42 + 57) + 43 = 42 + (57 + 43)","richtig":true},{"text":"(90 − 40) − 10 = 90 − (40 − 10)","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Bei der Addition darfst du vertauschen und Klammern versetzen. Prüfe die übrigen Gleichungen durch Ausrechnen.","loesungsschritt":"(90 − 40) − 10 = 40, aber 90 − (40 − 10) = 60."},"nachweis":[{"art":"gleichungen"},"(90 − 40) − 10 = 40","90 − (40 − 10) = 60"]},{"id":"5.3.5-R1-M-03","lernziel":"5.3.5-R1","niveau":"M","afb":2,"format":"luecken","text":"Nutze das Verbindungsgesetz und fülle die Lücken: (41 + 83) + 17 = 41 + (83 + {{a}}) = 41 + {{b}} = {{c}}","luecken":{"a":{"loesung":17,"typischeFehler":[]},"b":{"loesung":100,"typischeFehler":[]},"c":{"loesung":141,"typischeFehler":[]}},"hilfen":{"tipp":"Die Klammer wandert zu den beiden Zahlen, die sich zu 100 ergänzen.","loesungsschritt":"83 + 17 = 100."},"nachweis":["83 + 17 = 100","41 + 100 = 141","(41 + 83) + 17 = 141"]},{"id":"5.3.5-R1-M-04","lernziel":"5.3.5-R1","niveau":"M","afb":1,"format":"auswahl","text":"Welche Gleichung zeigt das Vertauschungsgesetz?","mehrfach":false,"optionen":[{"text":"(61 + 31) + 5 = 61 + (31 + 5)","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"61 + 31 = 31 + 61","richtig":true},{"text":"61 + 31 = 92","richtig":false},{"text":"61 − 31 = 31 − 61","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Beim Vertauschungsgesetz tauschen die Summanden den Platz.","loesungsschritt":"Suche die Gleichung, in der auf beiden Seiten dieselben zwei Summanden in getauschter Reihenfolge stehen."},"nachweis":["61 + 31 = 31 + 61"]},{"id":"5.3.5-R1-M-05","lernziel":"5.3.5-R1","niveau":"M","afb":2,"format":"luecken","text":"Zeige mit einem Beispiel, dass das Verbindungsgesetz für die Subtraktion nicht gilt. (70 − 20) − 15 = {{a}} und 70 − (20 − 15) = {{b}}","luecken":{"a":{"loesung":35,"typischeFehler":[{"wert":65,"fehlvorstellung":"klammer-ignoriert"}]},"b":{"loesung":65,"typischeFehler":[{"wert":35,"fehlvorstellung":"klammer-ignoriert"}]}},"hilfen":{"tipp":"Berechne in beiden Rechenausdrücken zuerst die Klammer.","loesungsschritt":"70 − 20 = 50 und 20 − 15 = 5."},"nachweis":["(70 − 20) − 15 = 35","70 − (20 − 15) = 65"]},{"id":"5.3.5-R1-M-06","lernziel":"5.3.5-R1","niveau":"M","afb":3,"format":"auswahl","text":"Mara behauptet: „Das Vertauschungsgesetz gilt auch für die Subtraktion.“ Welche Begründung ist richtig?","mehrfach":false,"optionen":[{"text":"Richtig. Die Rechengesetze gelten für alle Rechenarten.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch. Ein Gegenbeispiel genügt: 12 − 6 = 6, aber 6 − 12 ist keine natürliche Zahl.","richtig":true},{"text":"Richtig, denn 12 − 6 und 6 − 12 haben dasselbe Ergebnis.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch. Das Vertauschungsgesetz gilt für keine Rechenart.","richtig":false}],"hilfen":{"tipp":"Prüfe die Behauptung an einem Beispiel: Vertausche Minuend und Subtrahend.","loesungsschritt":"12 − 6 = 6. Bei 6 − 12 ist der Subtrahend größer als der Minuend."},"nachweis":[{"art":"urteil","stimmt":false},"12 − 6 = 6"]},{"id":"5.3.5-R1-E-01","lernziel":"5.3.5-R1","niveau":"E","afb":1,"format":"auswahl","text":"Welche Gleichung beschreibt das Verbindungsgesetz der Addition allgemein?","mehrfach":false,"optionen":[{"text":"a + (b + c) = (a + b) · c","richtig":false},{"text":"a + b = b + a","richtig":false,"fehlvorstellung":"begriffe-verwechselt"},{"text":"(a + b) + c = a + (b + c)","richtig":true},{"text":"(a + b) + c = a + b","richtig":false},{"text":"(a − b) − c = a − (b − c)","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Beim Verbindungsgesetz bleibt die Reihenfolge der Summanden gleich. Nur die Klammer wird versetzt."}},{"id":"5.3.5-R1-E-02","lernziel":"5.3.5-R1","niveau":"E","afb":2,"format":"luecken","text":"Berechne für a = 60, b = 35 und c = 15: (a − b) − c = {{x}} und a − (b − c) = {{y}}. Die beiden Ergebnisse unterscheiden sich um {{z}}.","luecken":{"x":{"loesung":10,"typischeFehler":[{"wert":40,"fehlvorstellung":"klammer-ignoriert"}]},"y":{"loesung":40,"typischeFehler":[{"wert":10,"fehlvorstellung":"klammer-ignoriert"}]},"z":{"loesung":30,"typischeFehler":[]}},"hilfen":{"tipp":"Setze die Zahlen ein und berechne jeweils zuerst die Klammer."},"nachweis":["(60 − 35) − 15 = 10","60 − (35 − 15) = 40","40 − 10 = 30"]},{"id":"5.3.5-R1-E-03","lernziel":"5.3.5-R1","niveau":"E","afb":2,"format":"auswahl","text":"Für welche Zahlen im Kästchen gilt (70 − 40) − ▢ = 70 − (40 − ▢)?","mehrfach":false,"optionen":[{"text":"Nur für die Zahl 20.","richtig":false},{"text":"Nur für die Zahl 0.","richtig":true},{"text":"Für jede Zahl von 0 bis 40.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Nur für die Zahl 40.","richtig":false},{"text":"Für keine Zahl.","richtig":false}],"hilfen":{"tipp":"Links wird die Zahl im Kästchen abgezogen, rechts kommt sie dazu. Setze mehrere Zahlen ein."},"nachweis":["(70 − 40) − 0 = 30","70 − (40 − 0) = 30","(70 − 40) − 10 = 20","70 − (40 − 10) = 40","(70 − 40) − 20 = 10","70 − (40 − 20) = 50"]},{"id":"5.3.5-R1-E-04","lernziel":"5.3.5-R1","niveau":"E","afb":3,"format":"auswahl","text":"(50 − 20) − 5 = 25 und 50 − (20 − 5) = 35. Ebenso (80 − 40) − 10 = 30 und 80 − (40 − 10) = 50. Stelle eine Regel für die Terme (a − b) − c und a − (b − c) auf.","mehrfach":false,"optionen":[{"text":"a − (b − c) ist immer um 2 · c kleiner als (a − b) − c.","richtig":false},{"text":"a − (b − c) ist immer um b größer als (a − b) − c.","richtig":false},{"text":"a − (b − c) ist immer um c größer als (a − b) − c.","richtig":false},{"text":"a − (b − c) ist immer um 2 · c größer als (a − b) − c.","richtig":true},{"text":"Beide Terme haben immer denselben Wert.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"}],"hilfen":{"tipp":"Vergleiche in beiden Beispielen den Unterschied der Ergebnisse mit der Zahl c."},"nachweis":["(50 − 20) − 5 = 25","50 − (20 − 5) = 35","35 − 25 = 10","2 · 5 = 10","(80 − 40) − 10 = 30","80 − (40 − 10) = 50","50 − 30 = 20","2 · 10 = 20"]},{"id":"5.3.5-R1-E-05","lernziel":"5.3.5-R1","niveau":"E","afb":2,"format":"luecken","text":"Bestimme die fehlende Zahl mithilfe des Verbindungsgesetzes: ({{a}} + 37) + 13 = 110","luecken":{"a":{"loesung":60,"typischeFehler":[{"wert":73,"fehlvorstellung":"sach-schritt-vergessen"},{"wert":160,"fehlvorstellung":"add-subtrahiert"}]}},"hilfen":{"tipp":"Fasse zuerst die beiden bekannten Summanden zusammen."},"nachweis":["37 + 13 = 50","110 − 50 = 60","(60 + 37) + 13 = 110"]},{"id":"5.3.5-R1-E-06","lernziel":"5.3.5-R1","niveau":"E","afb":3,"format":"auswahl","text":"Paul behauptet: „a − b = b − a gilt für keine natürlichen Zahlen.“ Beurteile die Aussage.","mehrfach":false,"optionen":[{"text":"Falsch. Die Gleichung gilt für alle natürlichen Zahlen.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Falsch. Für a = b gilt die Gleichung, zum Beispiel 7 − 7 = 7 − 7 = 0. Für verschiedene Zahlen gilt sie nicht.","richtig":true},{"text":"Richtig. Bei der Subtraktion darf man in keinem Fall vertauschen.","richtig":false},{"text":"Falsch. Die Gleichung gilt immer, wenn a größer ist als b.","richtig":false,"fehlvorstellung":"gesetz-auf-subtraktion"},{"text":"Richtig. Auch wenn a und b gleich sind, sind die Ergebnisse verschieden.","richtig":false}],"hilfen":{"tipp":"Untersuche auch den Sonderfall, dass a und b dieselbe Zahl sind."},"nachweis":[{"art":"urteil","stimmt":false},"7 − 7 = 0"]},{"id":"5.3.5-R2-F-01","lernziel":"5.3.5-R2","niveau":"F","afb":1,"format":"luecken","text":"7 + 4 + 3\nRechne erst 7 + 3 = {{a}}\nDann plus 4: {{b}}","luecken":{"a":{"loesung":10,"typischeFehler":[]},"b":{"loesung":14,"typischeFehler":[]}},"hilfen":{"tipp":"Suche 2 Zahlen, die zusammen 10 ergeben.","beispiel":"8 + 5 + 2: Erst 8 + 2 = 10. Dann 10 + 5 = 15.","loesungsschritt":"7 + 3 = 10."},"bild":{"art":"zehnerfeld","felder":10,"belegt":7,"dazu":3},"nachweis":["7 + 3 = 10","10 + 4 = 14","7 + 4 + 3 = 14"]},{"id":"5.3.5-R2-F-02","lernziel":"5.3.5-R2","niveau":"F","afb":1,"format":"auswahl","text":"Welche 2 Zahlen ergeben zusammen 10?\n7 + 2 + 3","mehrfach":false,"optionen":[{"text":"2 und 3","richtig":false},{"text":"7 und 2","richtig":false},{"text":"7 und 3","richtig":true}],"hilfen":{"tipp":"Schau auf das Zehnerfeld: Welche Zahlen füllen es genau?","beispiel":"9 + 4 + 1: 9 und 1 ergeben 10.","loesungsschritt":"Zu 7 fehlen 3 bis zur 10."},"bild":{"art":"zehnerfeld","felder":10,"belegt":7,"dazu":3},"nachweis":[{"art":"paarsumme","ziel":10},"7 + 3 = 10","7 + 2 = 9","2 + 3 = 5"]},{"id":"5.3.5-R2-F-03","lernziel":"5.3.5-R2","niveau":"F","afb":1,"format":"zahl","text":"Rechne geschickt.\n9 + 4 + 1","loesung":14,"typischeFehler":[],"hilfen":{"tipp":"Rechne erst die 2 Zahlen, die zusammen 10 ergeben.","beispiel":"8 + 5 + 2: Erst 8 + 2 = 10. Dann 10 + 5 = 15.","loesungsschritt":"9 + 1 = 10. Dann kommen noch 4 dazu."},"bild":{"art":"zehnerfeld","felder":10,"belegt":9,"dazu":1},"nachweis":["9 + 1 = 10","10 + 4 = 14","9 + 4 + 1 = 14"]},{"id":"5.3.5-R2-F-04","lernziel":"5.3.5-R2","niveau":"F","afb":1,"format":"zahl","text":"Suche erst die 10.\n4 + 3 + 6","loesung":13,"typischeFehler":[],"hilfen":{"tipp":"Die erste <script>(()=>{var H={nummer:"0.9",datum:"18.11.2026",schueler:["Alle Aufgaben sind neu. Silber, Gold und Purpur unterscheiden sich jetzt deutlich: Auf Silber rechnest du mit einem festen Verfahren, auf Gold l\xF6st du Aufgaben mit mehreren Schritten, auf Purpur begr\xFCndest du.","Viele Aufgaben haben ein Bild: Pl\xE4ttchen, Zehnerstangen, Punktefelder, Streifen oder einen Zahlenstrahl.","Bronze steht nicht mehr zur Wahl. Du spielst mindestens um Silber.","Grundlage: Klappt ein Lernziel auf Silber noch nicht, \xFCbst du zuerst drei Aufgaben zur Grundlage. Dort liegt der Tipp schon offen. Danach geht es von selbst mit Silber weiter. F\xFCr die drei Aufgaben bekommst du die Bronze-Krone.","Rechenraster und Ziffernr\xE4tsel: Du tr\xE4gst jede Ziffer in ein eigenes Feld ein."],lehrkraft:["Niveaustufen mit fester Bedeutung: G Hauptschulabschluss, M Realschulabschluss, E Zugabe Richtung Gymnasium, F Basiskompetenzen mit gr\xF6\xDFtm\xF6glicher Unterst\xFCtzung. Alle 600 Aufgaben der Klasse 5 sind danach neu erzeugt.","F wird nicht mehr gew\xE4hlt oder empfohlen. Sch\xFCler kommen nur \xFCber die Grundlagen-Schleife dorthin, je Lernziel, und nach drei richtigen Aufgaben zur\xFCck. Ein Kind, das fest auf F arbeiten soll, bekommt wie bisher das Zielniveau F.","Neuer Impuls \u201EGrundlage\u201C: \xDCbt ein Sch\xFCler bei einem Lernziel zum zweiten Mal die Grundlage, steht das unter \u201EImpulse\u201C, mit dem Baustein, der fehlt.","Die Br\xFCcke gibt es nur noch auf M und E. Auf G \xFCbernimmt die Grundlagen-Schleife.","Hilfek\xE4rtchen: F und G drei, M zwei, E eines. Auf F und G gibt es h\xF6chstens drei Auswahlantworten.","Jede Aufgabe tr\xE4gt ihren Rechenweg als Nachweis. Ein unabh\xE4ngiger Pr\xFCfer rechnet L\xF6sung, Hilfek\xE4rtchen und Bild nach, bevor der Pool gebaut wird."]};var _n={name:"ECDSA",namedCurve:"P-256"},jn={name:"ECDSA",hash:"SHA-256"},Wn=e=>btoa(String.fromCharCode(...new Uint8Array(e))),ct=e=>Uint8Array.from(atob(e),t=>t.charCodeAt(0)),ht=e=>new Tex
